<style>
/* Layout: an exam answer sheet — a bubble grid of every question beside the setup, then one question card at a time. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#eef1f4; --sheet:#ffffff; --ink:#18222e; --muted:#5b6876; --rule:#d5dbe2;
  --accent:#2340b8; --accent-soft:#e3e8fb;
  --good:#17845a; --good-soft:#dff3ea; --bad:#c43a4f; --bad-soft:#fbe5e9; --unseen:#f6f8fa;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11161c; --sheet:#19212a; --ink:#e6ebf1; --muted:#97a3b1; --rule:#2c3743;
  --accent:#8ea2ff; --accent-soft:#232d52;
  --good:#4cc792; --good-soft:#163428; --bad:#f07689; --bad-soft:#3d1c24; --unseen:#1f2832; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161c; --sheet:#19212a; --ink:#e6ebf1; --muted:#97a3b1; --rule:#2c3743;
  --accent:#8ea2ff; --accent-soft:#232d52;
  --good:#4cc792; --good-soft:#163428; --bad:#f07689; --bad-soft:#3d1c24; --unseen:#1f2832; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
#installBtn{font:inherit;font-size:13px}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(26px,4vw,34px);font-weight:900;letter-spacing:.02em}
h2{font-size:18px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:20px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;line-height:1.1}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:22px}
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.home{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px dashed var(--rule)}
.field:first-of-type{border-top:0;padding-top:4px}
.seg,.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chips button{font:inherit;font-size:14px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chips button small{font-family:var(--f-mono);opacity:.7;margin-left:4px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.start-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding-top:16px;border-top:1px dashed var(--rule)}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 22px;cursor:pointer;background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn:not(.ghost){color:#0f1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost){color:#0f1530}}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:500}
.btn.small{padding:7px 14px;font-size:14px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:13px}
/* answer-card grid */
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.cell{aspect-ratio:1;max-width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--unseen);font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cell.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cell.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--rule);background:var(--unseen)}
.legend .l-ok::before{background:var(--good-soft);border-color:var(--good)}
.legend .l-ng::before{background:var(--bad-soft);border-color:var(--bad)}
.topics{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.trow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.6em;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--unseen);border:1px solid var(--rule);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--good)} .bar .b-ng{background:var(--bad)}
.trow .mono{text-align:right;color:var(--muted);font-size:12px}
.linkish{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
/* quiz */
.qbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.progress{flex:1 1 200px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;border:1px solid var(--rule);border-radius:4px;padding:1px 8px;color:var(--muted)}
.tag.src-teacher{color:var(--good);border-color:var(--good);font-weight:700}.tag.src-ai{font-style:italic}
.tag.ch{border-color:var(--accent);color:var(--accent)}
.qtext{font-size:19px;font-weight:700;line-height:1.6;margin:0}
.opts{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.bubble{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.opt .txt{min-width:0;padding-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bubble{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.feedback{border-left:4px solid var(--good);background:var(--sheet);border-radius:0 8px 8px 0;padding:12px 16px}
.feedback.no{border-left-color:var(--bad)}
.feedback strong{display:block;margin-bottom:2px}
.feedback.yes strong{color:var(--good)} .feedback.no strong{color:var(--bad)}
.feedback p{margin:0}
.nav{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* result */
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.score .big{font-family:var(--f-mono);font-size:56px;font-weight:600;line-height:1}
.wrong-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.witem{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--sheet);display:flex;flex-direction:column;gap:6px}
.witem .q{font-weight:700}
.witem .ans{font-size:14px}
.witem .ans .y{color:var(--bad)} .witem .ans .c{color:var(--good);font-weight:700}
.witem .e{font-size:14px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}.stats{gap:14px}.sheet{padding:16px}.qtext{font-size:17px}}

.quick-start{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:16px}.quick-start p{margin:6px 0 0}.quick-actions{display:flex;flex-wrap:wrap;gap:10px}.answer-details summary,.topic-options summary{cursor:pointer;font-weight:700;min-height:40px;padding:5px 0}.answer-details[open] summary{margin-bottom:16px}.topic-options[open] summary{margin-bottom:10px}.topic-options .hint{font-weight:400}.seg button{min-height:42px}.seg button:disabled{opacity:.35;cursor:default}.quick-actions .btn{white-space:nowrap}.resume-note{color:var(--muted);font-size:13px}
@media(max-width:820px){.quick-start{align-items:flex-start;flex-direction:column}.quick-actions{width:100%}.quick-actions button{flex:1 1 auto}}
@media(max-width:600px){body{padding-bottom:120px}.wrap{gap:16px}.start-row{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -4px 18px #0000000d;padding:10px 16px calc(10px + env(safe-area-inset-bottom));gap:8px}.start-row .btn{flex:1}.start-row .hint{flex:1;line-height:1.4}.quick-start{padding:16px}.quick-actions .btn{padding:10px 12px}.qbar{gap:8px}.qbar .btn{min-height:44px}header p{font-size:13px}.answer-details{padding:16px}.qcard .nav{position:sticky;bottom:0;background:var(--paper);padding:10px 0}.kbd{display:none}}
</style>

<link rel="stylesheet" href="pwa.css"><script defer src="pwa.js"></script></head>
<body>
<div class="wrap" id="app">
  <header class="quiz-header">
    <div class="header-intro"><h1>專案管理題庫</h1><p id="subtitle"></p></div>
    <div class="stats header-stats" id="hdrStats"></div>
    <div class="pwa-actions header-actions" data-pwa-actions><a class="btn ghost small" href="chart.html" style="text-decoration:none">架構圖默寫 →</a><button class="btn ghost small" id="installBtn">安裝到手機</button></div>
    <div class="pwa-status-row" data-pwa-status></div>
  </header>

  <section id="home" class="home">
    <div class="sheet quick-start"><div><h2>開始今天的練習</h2><p class="hint" id="quickHint">選好範圍，直接開始；也可以往下調整題數。</p></div><div class="quick-actions"><button class="btn" id="quickTen">快速練 10 題</button><button class="btn ghost" id="quickWrong">重練錯題</button><button class="btn ghost" id="resumeBtn" hidden>繼續上次</button></div></div>
    <div class="sheet">
      <div class="field" id="chField">
        <span class="label">章節</span>
        <div class="seg" id="chSeg"></div>
      </div>
      <div class="field"><span class="label">題目來源</span><div class="seg" id="sourceSeg"></div></div>
      <details class="field topic-options"><summary>選擇主題 <span class="hint" id="topicSummary">全部主題</span></summary><div class="chips" id="topicChips"></div></details>
      <div class="field">
        <span class="label">出題範圍</span>
        <div class="seg" id="modeSeg"></div>
      </div>
      <div class="field">
        <span class="label">題數</span>
        <div class="seg" id="countSeg"></div>
      </div>
      <div class="field">
        <label class="toggle"><input type="checkbox" id="shuffleOpts" checked> 打亂選項順序</label>
      </div>
      <div class="start-row" id="startRow">
        <button class="btn" id="startBtn">開始測驗</button>
        <span class="hint" id="poolInfo"></span>
      </div>
    </div>

    <details class="sheet answer-details"><summary>答題卡與學習進度 <span class="hint" id="gridSummary"></span></summary>
      <div class="card-head">
        <h2>答題卡</h2>
        <span class="label">點格子可單獨練那一題</span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span class="l-ok">上次答對</span><span class="l-ng">上次答錯</span><span>還沒做過</span></div>
      <div class="topics" id="topicBars"></div>
      <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center" id="resetRow">
        <button class="linkish" id="resetBtn">清除作答紀錄</button>
      </div>
    </details>
  </section>

  <section id="quiz" hidden>
    <div class="qcard">
      <div class="qbar">
        <span class="mono" id="qCount"></span>
        <div class="progress"><i id="qProg"></i></div>
        <span class="mono" id="qScore"></span>
        <button class="btn ghost small" id="pauseBtn">暫停</button><button class="btn ghost small" id="quitBtn">結束測驗</button>
      </div>
      <div class="sheet" style="display:flex;flex-direction:column;gap:16px">
        <div class="qmeta" id="qMeta"></div>
        <p class="qtext" id="qText"></p>
        <ul class="opts" id="qOpts"></ul>
        <div id="qFeedback"></div>
      </div>
      <div class="nav">
        <span class="kbd" id="kbdHint">鍵盤：A–D 或 1–4 作答，Enter 下一題</span>
        <button class="btn" id="nextBtn" hidden>下一題</button>
      </div>
    </div>
  </section>

  <section id="result" hidden>
    <div class="qcard">
      <div class="sheet" style="display:flex;flex-direction:column;gap:16px">
        <span class="label">本次成績</span>
        <div class="score"><span class="big" id="rScore"></span><span id="rDetail"></span></div>
        <div class="actions">
          <button class="btn" id="retryWrongBtn">重練這次答錯的題</button>
          <button class="btn ghost" id="againBtn">同樣設定再考一次</button>
          <button class="btn ghost" id="homeBtn">回到首頁</button>
        </div>
      </div>
      <div id="rWrongWrap">
        <h2 style="margin-bottom:8px" id="rWrongTitle"></h2>
        <div class="wrong-list" id="rWrong"></div>
      </div>
    </div>
  </section>
</div>

<script>
const BANK = [{"id": "q000", "ch": "ch1", "topic": "創新與時代趨勢", "q": "根據 Steve Blank 對中國大陸與美國矽谷創新生態的觀察，下列哪一項是中國大陸「完全不具備」的？", "o": ["創業動機", "基礎建設", "創新創業管理工具", "創業人才"], "a": 2, "e": "Steve Blank 認為中國大陸在「管理工具」方面完全不具備，也就是缺乏創新創業管理工具。", "src": "ch1"}, {"id": "q001", "ch": "ch1", "topic": "創新與時代趨勢", "q": "根據 Steve Blank 對中國大陸與美國矽谷創新生態的觀察，中國大陸在哪一方面與美國一樣？", "o": ["管理工具", "文化", "動機", "原創力"], "a": 2, "e": "動機方面中國大陸和美國一樣（基礎建設也一樣完備）；文化方面稍缺冒險精神與原創力；管理工具則完全不具備。", "src": "ch1"}, {"id": "q002", "ch": "ch1", "topic": "創新與時代趨勢", "q": "下列何者正確描述 LLP 模式？", "o": ["商業模式＋客戶開發＋敏捷開發", "商業模式＋品質管理＋瀑布開發", "市場分析＋財務管理＋人力資源", "客戶開發＋風險管理＋成本管理"], "a": 0, "e": "LLP 是 Lean LaunchPad：商業模式＋客戶開發＋敏捷開發。", "src": "ch1"}, {"id": "q003", "ch": "ch1", "topic": "創新與時代趨勢", "q": "在創新經濟時代，傳統專案管理應如何因應？", "o": ["完全被敏捷取代", "適度結合敏捷實務", "完全排除敏捷方法", "只增加文件與流程"], "a": 1, "e": "簡報指出：在創新經濟時代，傳統專案管理也可以適度結合敏捷實務，讓專案更順利、更成功。", "src": "ch1"}, {"id": "q004", "ch": "ch1", "topic": "創新與時代趨勢", "q": "Standish Group 1995 年的調查指出，許多專案無法如期完成與失敗的兩個主要原因為何？", "o": ["預算不足與技術落後", "需求不完整與缺乏使用者參與", "員工不足與設備不足", "管理者經驗不足與市場競爭"], "a": 1, "e": "Standish Group 1995 年報告：專案無法如期完成與失敗的兩大主因是「需求不完整」和缺乏「使用者參與」。", "src": "ch1"}, {"id": "q005", "ch": "ch1", "topic": "創新與時代趨勢", "q": "下列何者「不是」Ken Schwaber 所提出的軟體開發常見問題？", "o": ["無法準時交付", "開發期間很難做更改", "品質持續惡化", "客戶參與程度過高"], "a": 3, "e": "Ken Schwaber 列的問題包括發布時間越來越長、無法準時交付、開發期間很難更改、品質持續惡化、死亡行軍等。客戶參與過高不在其中，傳統問題反而是參與不足。", "src": "ch1"}, {"id": "q006", "ch": "ch1", "topic": "創新與時代趨勢", "q": "傳統工作時代的專案管理模式較屬於哪一種流程？", "o": ["明確固定型流程", "完全隨機流程", "自我組織流程", "客戶驅動流程"], "a": 0, "e": "傳統工作時代的專案管理模式是「明確固定型流程」，並不適用於軟體開發。", "src": "ch1"}, {"id": "q007", "ch": "ch1", "topic": "創新與時代趨勢", "q": "根據簡報，傳統固定型專案管理模式較不適合下列哪種工作？", "o": ["工作內容穩定的工作", "大量重複性生產", "充滿變動的軟體與新產品研發", "流程高度標準化的工作"], "a": 2, "e": "明確固定型流程對充滿變動的軟體和新產品研發而言，是浪費時間且達不到預期成果的。", "src": "ch1"}, {"id": "q008", "ch": "ch1", "topic": "創新與時代趨勢", "q": "工業時代與知識經濟時代相比，工業時代較強調：", "o": ["根據需求改變", "依計畫行事", "持續創新", "給予授權"], "a": 1, "e": "工業時代強調依計畫行事；知識經濟時代強調根據需求改變。", "src": "ch1"}, {"id": "q009", "ch": "ch1", "topic": "創新與時代趨勢", "q": "知識經濟時代的工作特點為何？", "o": ["工作內容穩定", "決策點較少", "工作內容常變", "強調命令與控制"], "a": 2, "e": "知識經濟時代工作內容常變，工業時代則是工作內容穩定。", "src": "ch1"}, {"id": "q010", "ch": "ch1", "topic": "創新與時代趨勢", "q": "在知識經濟時代，相較於「強調正確的答案」，更重視什麼？", "o": ["問正確的問題", "減少所有問題", "遵循主管指示", "建立標準答案"], "a": 0, "e": "工業時代強調正確的答案；知識經濟時代重視問正確的問題。", "src": "ch1"}, {"id": "q011", "ch": "ch1", "topic": "創新與時代趨勢", "q": "工業時代較強調「命令與控制」，知識經濟時代則強調什麼？", "o": ["集權", "監督", "給予授權", "嚴格管制"], "a": 2, "e": "工業時代強調命令與控制；知識經濟時代強調給予授權。", "src": "ch1"}, {"id": "q012", "ch": "ch1", "topic": "創新與時代趨勢", "q": "下列何者最符合知識經濟時代的工作特點？", "o": ["專注於數量", "嚴謹的標準", "將員工工作成本最小化", "將員工視為財產而不是成本"], "a": 3, "e": "知識經濟時代將員工視為財產（資產）而不是成本；專注數量、嚴謹標準、員工成本最小化都是工業時代的特點。", "src": "ch1"}, {"id": "q013", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷宣言於哪一年被提出？", "o": ["1995 年", "1999 年", "2001 年", "2012 年"], "a": 2, "e": "敏捷宣言於 2001 年 2 月 11–13 日提出。", "src": "ch1"}, {"id": "q014", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "2001 年，17 位軟體實務大師聚集在哪裡討論輕量級軟體開發模式？", "o": ["美國矽谷", "美國猶他州雪鳥", "紐約哥倫比亞大學", "麻省理工學院"], "a": 1, "e": "17 位大師聚集在美國猶他州的雪鳥（Snowbird, Utah）。", "src": "ch1"}, {"id": "q015", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷軟體開發模式希望取代的主要是什麼？", "o": ["以文件為導向的重量級軟體開發模式", "客戶參與的開發模式", "團隊合作的開發模式", "產品導向的開發模式"], "a": 0, "e": "敏捷要以輕量級軟體開發模式，取代重量級、以文件為導向的開發模式。", "src": "ch1"}, {"id": "q016", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "根據敏捷的觀點，最終決定產品的應該是誰？", "o": ["製造團隊", "設計團隊", "客戶", "專案經理"], "a": 2, "e": "做出產品後就上市，再根據客戶回饋修改；決定產品的不是製造團隊或設計團隊，而是客戶。", "src": "ch1"}, {"id": "q017", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列何者符合敏捷宣言的價值觀？", "o": ["流程與工具勝於個人與互動", "個人與互動勝於流程與工具", "合約談判勝於客戶協作", "遵循計畫勝於回應變更"], "a": 1, "e": "四大價值觀：個人與互動＞流程與工具、可用的軟體＞複雜的文件、與客戶協作＞合約談判、回應變更＞遵循計畫。", "src": "ch1"}, {"id": "q018", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷宣言認為，下列何者勝於「複雜的文件」？", "o": ["詳細的合約", "完整的計畫", "可用的軟體", "嚴格的流程"], "a": 2, "e": "可用的軟體勝於複雜的文件。", "src": "ch1"}, {"id": "q019", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷宣言認為「與客戶協作」勝於：", "o": ["合約談判", "團隊溝通", "回應變更", "軟體測試"], "a": 0, "e": "與客戶協作勝於合約談判。", "src": "ch1"}, {"id": "q020", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "「回應變更勝於＿＿＿＿」是敏捷宣言四大價值觀之一，空格應填入什麼？", "o": ["與客戶協作", "遵循計畫", "個人與互動", "可用的軟體"], "a": 1, "e": "回應變更勝於遵循計畫。", "src": "ch1"}, {"id": "q021", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則的第一優先任務是什麼？", "o": ["降低人事成本", "完成所有文件", "儘早且持續交付有價值的成果以滿足客戶", "完全避免需求變更"], "a": 2, "e": "敏捷原則第 1 條：第一優先是儘早且持續交付有價值的軟體（成果）來滿足客戶。", "src": "ch1"}, {"id": "q022", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "當客戶在開發後期提出需求變更時，依敏捷原則應如何處理？", "o": ["一律拒絕", "歡迎改變需求", "延到下一個專案", "要求客戶重新簽約後才能討論"], "a": 1, "e": "敏捷原則第 2 條：竭誠歡迎改變需求，即使在最後開發階段也是如此。", "src": "ch1"}, {"id": "q023", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則認為，交付可用成果的時間間隔應如何安排？", "o": ["越長越好", "一律每年一次", "以較短的時間間隔為佳", "專案結束才交付"], "a": 2, "e": "敏捷原則第 3 條：經常交付可用的軟體，頻率從數週到數月，以較短的時間間隔為佳。", "src": "ch1"}, {"id": "q024", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則認為，業務人員與開發者在專案進行中應：", "o": ["每天一起工作", "每月開會一次", "各自獨立工作", "只透過專案經理聯絡"], "a": 0, "e": "敏捷原則第 4 條：業務人員與開發者在專案進行中必須每天一起工作。", "src": "ch1"}, {"id": "q025", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則認為，團隊成員之間傳遞訊息最有效率與效能的方式是什麼？", "o": ["正式公文", "電子郵件", "面對面溝通", "詳細的工作報告"], "a": 2, "e": "敏捷原則第 6 條：面對面的溝通是傳遞訊息最有效率與效能的方式。", "src": "ch1"}, {"id": "q026", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則將什麼視為進度的主要測量標準？", "o": ["已完成的文件頁數", "已召開的會議次數", "可用的產品、服務或成果", "團隊工作時數"], "a": 2, "e": "敏捷原則第 7 條：可用的軟體（產品、服務或成果）是進度的主要測量標準。", "src": "ch1"}, {"id": "q027", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "「盡最大的可能排除不需要的工作」最符合敏捷原則中的哪一項？", "o": ["精簡", "控制", "標準化", "文件化"], "a": 0, "e": "敏捷原則第 10 條：精簡，精髓是要盡最大的可能排除不需要的工作。", "src": "ch1"}, {"id": "q028", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則認為，最佳的架構、需求及設計來自：", "o": ["高階主管", "外部顧問", "自我組織的團隊", "專案管理辦公室"], "a": 2, "e": "敏捷原則第 11 條：最佳的架構、需求及設計皆來自於能自我組織的團隊。", "src": "ch1"}, {"id": "q029", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "某敏捷團隊每隔一段時間便檢討「怎樣工作可以更有效率」，並據以調整工作方式。這最符合哪一項敏捷原則？", "o": ["團隊定期自省並調整與修正行為", "遵循原始計畫", "加強合約談判", "增加專案文件"], "a": 0, "e": "敏捷原則第 12 條：團隊定期自省如何更有效率，並據以調整與修正行為。", "src": "ch1"}, {"id": "q030", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列何者「不是」簡報所列採用敏捷可達成的五項主要商業目標？", "o": ["可持續創新", "產品有彈性", "加速上市時間", "完全消除市場風險"], "a": 3, "e": "Jim Highsmith 列的五項：可持續創新、產品有彈性、加速上市時間、人員與流程有彈性、產出可靠的成果。沒有「完全消除市場風險」。", "src": "ch1"}, {"id": "q031", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷為何可能增加投資報酬率（ROI）？", "o": ["延後產品上市", "根據市場價值開發小批迭代產品，儘快上市與快速回收", "增加產品文件", "減少與客戶接觸"], "a": 1, "e": "加速上市時間：根據市場價值開發小批迭代產品，可儘快上市與快速回收，增加 ROI。", "src": "ch1"}, {"id": "q032", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "組織專案管理（OPM）的主要目的為何？", "o": ["讓每個專案完全獨立於組織策略", "透過專案相關管理實務達成組織策略", "只負責軟體開發", "只管理日常營運"], "a": 1, "e": "OPM 是基於組織策略的執行框架，藉由專案組合、專案集、專案及組織驅動實務來達成組織策略。", "src": "ch1"}, {"id": "q033", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "OPM3 中的「SMCI」四個成熟度測評等級，正確順序為何？", "o": ["Standardize → Measure → Control → Improve", "Structure → Manage → Control → Innovate", "Standardize → Manage → Create → Improve", "Strategy → Measure → Control → Integrate"], "a": 0, "e": "SMCI＝標準化（Standardize）→ 可衡量（Measure）→ 可控制（Control）→ 持續改進（Improve）。", "src": "ch1"}, {"id": "q034", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "下列關於「專案組合（Portfolio）」與「專案集（Program）」的敘述，何者正確？", "o": ["Portfolio 只能包含單一專案", "Program 是一群彼此完全無關的專案", "Portfolio 可包含專案、專案集、子專案組合及日常營運工作", "Program 與組織策略完全無關"], "a": 2, "e": "專案組合包含專案、專案集、子專案組合和日常營運工作；專案集是一群「相關」的專案；兩者都要符合組織策略。", "src": "ch1"}, {"id": "q035", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列哪一項不是「敏捷原則」（Agile Principle）？", "o": ["專案靠積極的個人來完成，給予他們所需的環境與支援，並相信他們可以完成工作。", "經常交付可用的成果，頻率可從數週到數個月，以較長的時間間隔為佳。", "敏捷流程提倡穩定持續的開發，發起人、開發者及用戶都應該能不斷地維持穩定的步調。", "精簡 — 精髓是要盡最大的可能，排除不需要做的工作。"], "a": 1, "e": "敏捷原則第 3 條是「以較短的時間間隔為佳」，B 寫成較長，所以不是敏捷原則。", "src": "ch1"}, {"id": "q036", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列對敏捷原則中「精簡（Simplicity）」的敘述，哪一項正確？", "o": ["是要盡最大的可能，排除不需要做的工作。", "是要盡最小的可能，排除不需要做的工作。", "是要盡最大的可能，排除需要做的工作。", "是要盡最小的可能，排除需要做的工作。"], "a": 0, "e": "敏捷原則第 10 條：精簡是要盡最大的可能，排除不需要做的工作。", "src": "ch1"}, {"id": "q037", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列哪一項不是「敏捷原則」（Agile Principle）？", "o": ["可用的軟體是進度的主要量測標準", "持續專注於追求卓越的技術與優良的設計以強化敏捷力", "最佳的架構、需求及設計皆來自於能有效監控的團隊", "團隊定期自省應如何更有效率，並據以適當地調整與修正行為"], "a": 2, "e": "敏捷原則第 11 條是「能自我組織的團隊」，不是「能有效監控的團隊」。", "src": "ch1"}, {"id": "q038", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "根據「敏捷原則」（Agile Principle），下列哪一項是進度的主要量測標準？", "o": ["大量的文件", "可用的軟體", "好的架構", "充分授權的工作環境"], "a": 1, "e": "敏捷原則第 7 條：可用的軟體是進度的主要量測標準。", "src": "ch1"}, {"id": "q039", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "根據「敏捷原則」（Agile Principle），最佳的架構、需求及設計皆來自於下列哪一項？", "o": ["產品負責人(ProductOwner)", "敏捷教練 (Coach)", "能自我組織的團隊", "專案經理"], "a": 2, "e": "敏捷原則第 11 條：最佳的架構、需求及設計皆來自於能自我組織的團隊。", "src": "ch1"}, {"id": "q040", "ch": "ch2", "topic": "傳統開發模式", "q": "根據資訊系統開發模式演進圖，下列哪一個模式最早提出？", "o": ["漸進模式", "雛型模式", "瀑布模式", "螺旋模式"], "a": 2, "e": "瀑布模式（Royce, 1970）最早；漸進、雛型是 1977，螺旋是 1988，RUP 是 1999。", "src": "ch12a"}, {"id": "q041", "ch": "ch2", "topic": "傳統開發模式", "q": "若開發團隊將雛型系統視為最終產品，最可能造成什麼結果？", "o": ["客戶滿意度提高", "需求更完整", "文件更齊全", "犧牲產品品質"], "a": 3, "e": "雛型模式的缺點：開發團隊會將雛型系統視為最終產品，犧牲產品品質。", "src": "ch12a"}, {"id": "q042", "ch": "ch2", "topic": "傳統開發模式", "q": "RUP 模式以什麼作為系統開發的首要工作，以便更精確地了解使用者需求？", "o": ["企業塑模", "程式撰寫", "部署", "測試"], "a": 0, "e": "RUP 以「企業塑模」為系統開發首要工作，讓開發者更精確地了解使用者需求。", "src": "ch12a"}, {"id": "q043", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者符合瀑布模式的特性？", "o": ["各階段可以同時並行進行", "專案資源配置以客戶需求變動為基礎", "各階段工作人員須完成正確、完整、易讀的文件，移交給下一階段的工作人員", "客戶全程密集參與開發過程"], "a": 2, "e": "瀑布模式特性：各階段要完成正確、完整、易讀的文件移交下一階段。A、B、D 都與瀑布相反。", "src": "ch12a"}, {"id": "q044", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 的基本價值觀？", "o": ["公開", "專注", "承諾", "檢視"], "a": 3, "e": "Scrum 五個價值觀：公開、勇氣、尊重、專注、承諾。「檢視」是三大支柱之一。", "src": "ch12a"}, {"id": "q045", "ch": "ch2", "topic": "Scrum", "q": "Scrum 是由誰在何時共同提出的？", "o": ["Kent Beck 於 1999 年", "Alistair Cockburn 於 2001 年", "Jeff De Luca 於 1997 年", "Ken Schwaber 與 Jeff Sutherland 於 1995 年"], "a": 3, "e": "Scrum 由 Ken Schwaber 與 Jeff Sutherland 於 1995 年在 OOPSLA 研討會共同提出。", "src": "ch12a"}, {"id": "q046", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者「不是」瀑布模式的缺點？", "o": ["專案開始時必須完整且清楚地描述所有需求", "客戶要到專案末期才能看到產品", "各階段的改變或錯誤須回溯到前一階段，並經冗長的審查簽核", "各階段的產出都須經過確認、驗證及測試，藉此發現品質缺失並加以改善"], "a": 3, "e": "D 是瀑布模式的「特性」（產出要經確認、驗證及測試），不是缺點。", "src": "ch12a"}, {"id": "q047", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者是 RUP 模式的缺點？", "o": ["缺乏視覺化模型", "無法迭代", "模式過於繁雜，企業學習與導入困難，且支援工具受限於 IBM Rational 軟體", "不重視需求分析"], "a": 2, "e": "RUP 缺點：模式過於繁雜、學習導入困難，支援工具受限於 IBM Rational 軟體。", "src": "ch12a"}, {"id": "q048", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 的儀式？", "o": ["燃盡圖", "衝刺規劃", "衝刺審查", "衝刺回顧"], "a": 0, "e": "燃盡圖是 Scrum 的「產出」，不是儀式。四儀式：衝刺規劃、每日立會、衝刺審查、衝刺回顧。", "src": "ch12a"}, {"id": "q049", "ch": "ch2", "topic": "傳統開發模式", "q": "瀑布模式的標準開發流程順序為何？", "o": ["設計→需求→開發→測試→部署", "需求→設計→開發→測試→部署", "需求→開發→設計→部署→測試", "需求→設計→測試→開發→部署"], "a": 1, "e": "瀑布流程：需求 → 設計 → 開發 → 測試 → 部署。", "src": "ch12a"}, {"id": "q050", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者是漸進模式的缺點？", "o": ["無法分階段編列預算", "需要對每個漸進階段做清楚完整的定義，可能使系統開發期程變長", "風險管理成本過高", "完全沒有文件可供維護"], "a": 1, "e": "漸進模式缺點：每個階段都要清楚完整定義（期程變長）、階層僵化不易關聯、總成本通常大於瀑布。", "src": "ch12a"}, {"id": "q051", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式屬於客戶導向的分析與設計，但可能遇到什麼問題？", "o": ["客戶參與度過低", "開發團隊不願意修改系統", "大部分時間客戶並不清楚他們真正的需求是什麼", "專案一開始就能精確估算完成時間"], "a": 2, "e": "雛型模式屬客戶導向，但大部分時間客戶並不清楚自己真正的需求是什麼。", "src": "ch12a"}, {"id": "q052", "ch": "ch2", "topic": "傳統開發模式", "q": "螺旋模式是由哪位學者於哪一年提出？", "o": ["Royce，1970", "Bally et al.，1977", "Barry，1988", "Booch，1999"], "a": 2, "e": "螺旋模式由 Barry 於 1988 年提出。", "src": "ch12a"}, {"id": "q053", "ch": "ch2", "topic": "傳統開發模式", "q": "瀑布模式的風險與失敗成本偏高，主要原因為何？", "o": ["專案較後階段才開始進行開發", "專案初期過度簡化需求", "客戶參與過多", "各階段不需要審查簽核"], "a": 0, "e": "瀑布模式在專案較後階段才開始開發，所以風險與失敗成本都高。", "src": "ch12a"}, {"id": "q054", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 的產出？", "o": ["產品待辦清單", "甘特圖", "燃盡圖", "衝刺待辦清單"], "a": 1, "e": "Scrum 四個產出：產品待辦清單、衝刺待辦清單、可交付的增量成果、燃盡圖。甘特圖不是。", "src": "ch12a"}, {"id": "q055", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式強調的重點是什麼？", "o": ["風險分析與風險管理", "完整的分析設計文件", "以企業塑模為首要工作", "雛型的快速開發及使用者高度參與"], "a": 3, "e": "雛型模式強調雛型的快速開發及使用者高度參與。風險分析是螺旋，企業塑模是 RUP。", "src": "ch12a"}, {"id": "q056", "ch": "ch2", "topic": "傳統開發模式", "q": "螺旋模式藉由哪一項作法，大幅降低軟體失敗造成損失的可能性？", "o": ["風險分析", "完整文件", "嚴格簽核", "一次性完整需求"], "a": 0, "e": "螺旋模式藉由風險分析，大幅降低軟體失敗造成損失的可能性。", "src": "ch12a"}, {"id": "q057", "ch": "ch2", "topic": "傳統開發模式", "q": "漸進模式的第一個漸進階段（漸進一）建置的是什麼？", "o": ["核心功能", "功能一", "所有功能的雛型", "部署與教育訓練"], "a": 0, "e": "漸進一建置核心功能，之後依序加入功能一、功能二、功能三。", "src": "ch12a"}, {"id": "q058", "ch": "ch2", "topic": "其他敏捷方法論", "q": "由 Kent Beck 創建，專注於敏捷開發實務，強調效率、聚焦於客戶、回饋及品質的是哪一種方法論？", "o": ["Scrum", "精益（Lean）", "看板（Kanban）", "終極編程（XP）"], "a": 3, "e": "終極編程（XP）由 Kent Beck 創建，專注於敏捷開發實務，強調效率、聚焦於客戶、回饋及品質。", "src": "ch12a"}, {"id": "q059", "ch": "ch2", "topic": "傳統開發模式", "q": "為什麼螺旋模式「不利於已簽署合約的客戶與開發者之間的協調」？", "o": ["因為文件過於繁雜", "因為工具受限於特定廠商", "因為開發流程過於靈活", "因為客戶完全不參與"], "a": 2, "e": "螺旋模式的開發流程過於靈活，不利於已簽約的客戶與開發者之間的協調。", "src": "ch12a"}, {"id": "q060", "ch": "ch2", "topic": "其他敏捷方法論", "q": "下列敏捷方法論與創建者的配對，何者正確？", "o": ["看板（Kanban）— David J. Anderson", "Scrum — Kent Beck", "功能驅動開發（FDD）— Alistair Cockburn", "水晶家族（Crystal） — Jeff De Luca"], "a": 0, "e": "Kanban—David J. Anderson 正確。Scrum 是 Sutherland & Schwaber，FDD 是 Jeff De Luca，Crystal 是 Alistair Cockburn。", "src": "ch12a"}, {"id": "q061", "ch": "ch2", "topic": "傳統開發模式", "q": "RUP 模式的四個階段為何？", "o": ["需求、設計、開發、測試", "初始、詳述、建構、轉移", "構想、推測、探索、調整", "決定目標、風險分析、開發、規劃"], "a": 1, "e": "RUP 四階段：初始、詳述、建構、轉移。C 是 APM 的階段，D 是螺旋模式的步驟。", "src": "ch12a"}, {"id": "q062", "ch": "ch2", "topic": "Scrum", "q": "在 Scrum 流程中，一個衝刺（Sprint）與每日立會的週期分別約為多久？", "o": ["衝刺約 2–4 週，每日立會每 24 小時一次", "衝刺約 6 個月，每日立會每週一次", "衝刺約 1 天，每日立會每月一次", "衝刺約 3 個月，每日立會每 24 小時一次"], "a": 0, "e": "一個衝刺約 2–4 週，每日立會每 24 小時一次（15 分鐘）。", "src": "ch12a"}, {"id": "q063", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 團隊的組成角色？", "o": ["產品負責人（PO）", "開發團隊", "專案經理", "Scrum 大師"], "a": 2, "e": "Scrum 團隊只有產品負責人、Scrum 大師、開發團隊，沒有專案經理。", "src": "ch12a"}, {"id": "q064", "ch": "ch2", "topic": "傳統開發模式", "q": "若組織希望員工能充分熟悉與接受新系統，並有充分時間學習與進行技術移轉，較適合採用哪一種模式？", "o": ["瀑布模式", "雛型模式", "螺旋模式", "漸進模式"], "a": 3, "e": "漸進模式分階段建置，讓組織成員有充分時間學習與進行技術移轉。", "src": "ch12a"}, {"id": "q065", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理的知識中，軟技術方面的要求，不包含下列何者？", "o": ["決策的分析與下達", "人力資源的運用及專案領導的藝術", "對人際關係的互動", "時程規劃"], "a": 3, "e": "時程規劃屬硬技術。軟技術是與人相關的技術，如人際互動、溝通、決策、專案領導。", "src": "ch12a"}, {"id": "q066", "ch": "ch1", "topic": "專案管理基礎", "q": "專案章程於專案管理過程中何時撰寫 ？", "o": ["起始過程組", "規劃過程組", "結束過程組", "監視與管制過程組"], "a": 0, "e": "專案章程在起始過程組撰寫，用來正式授權專案。", "src": "ch12a"}, {"id": "q067", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者屬於專案管理知識結構中「軟技術」之部分？", "o": ["專案領導的藝術", "時程規劃", "品質確保", "成本分析"], "a": 0, "e": "專案領導的藝術屬軟技術；時程規劃、品質確保、成本分析都屬硬技術。", "src": "ch12a"}, {"id": "q068", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "下列何者屬專案管理辦公室類型？", "o": ["支援型", "管制型", "指示型", "以上皆是"], "a": 3, "e": "PMO 三種類型：支援型（管制低）、管制型（管制中）、指示型（管制高）。", "src": "ch12a"}, {"id": "q069", "ch": "ch1", "topic": "專案管理基礎", "q": "「定義活動」屬於哪一專案管理知識領域？", "o": ["專案資源管理", "專案範疇管理", "專案採購管理", "專案時程管理"], "a": 3, "e": "定義活動屬於專案時程管理。", "src": "ch12a"}, {"id": "q070", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "根據「敏捷原則」（Agile Principle），下列哪一項是衡量進度的主要標準？", "o": ["大量的文件", "可用的軟體 ( 成果 )", "好的架構", "充分授權的工作環境"], "a": 1, "e": "敏捷原則第 7 條：可用的軟體（成果）是進度的主要測量標準。", "src": "ch12a"}, {"id": "q071", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理學會組織（PMI）何時成立？", "o": ["1958", "1968", "1969", "1978"], "a": 2, "e": "PMI（專案管理學會）成立於 1969 年。", "src": "ch12a"}, {"id": "q072", "ch": "ch1", "topic": "專案管理基礎", "q": "「獲得資源」屬於哪一專案管理知識領域？", "o": ["專案資源管理", "專案範疇管理", "專案整合管理", "專案溝通管理"], "a": 0, "e": "獲得資源屬於專案資源管理。", "src": "ch12a"}, {"id": "q073", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷專案管理緊盯的是？", "o": ["計畫", "願景", "需求", "成本"], "a": 1, "e": "敏捷專案管理緊盯願景，而不是緊盯計畫。", "src": "ch12a"}, {"id": "q074", "ch": "ch1", "topic": "專案管理基礎", "q": "「建立工作分解結構（WBS）」屬於哪一專案管理知識領域？", "o": ["專案資源管理", "專案範疇管理", "專案採購管理", "專案溝通管理"], "a": 1, "e": "建立工作分解結構（WBS）屬於專案範疇管理。", "src": "ch12a"}, {"id": "q075", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何種活動可以歸屬於專案？", "o": ["公司上市計畫", "建置資訊系統", "建設工程", "以上皆是"], "a": 3, "e": "公司上市計畫、建置資訊系統、建設工程都是為了創造獨特成果的暫時性努力，都可以是專案。", "src": "ch12a"}, {"id": "q076", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列哪一項不是「敏捷宣言」（Agile Manifesto）的價值觀？", "o": ["流程與工具勝於個人與互動", "可用的軟體勝於複雜的文件", "與客戶協同合作勝於合約談判", "回應變更勝於遵循計畫"], "a": 0, "e": "正確的價值觀是「個人與互動勝於流程與工具」，A 把順序顛倒了。", "src": "ch12a"}, {"id": "q077", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "哪一種專案管理辦公室（PMO）對於專案管控採直接管理方式，專案經理由 PMO 指派並直接對 PMO 報告？", "o": ["支援型", "管制型", "指示型", "配合型"], "a": 2, "e": "指示型 PMO：直接管理專案，專案經理由 PMO 指派並直接對 PMO 報告，管制程度高。", "src": "ch12a"}, {"id": "q078", "ch": "ch1", "topic": "專案管理基礎", "q": "專案是指：為了創造出獨特的產品、服務或成果所做的何種努力？", "o": ["長期性", "暫時性", "短期性", "中程性"], "a": 1, "e": "專案是為了創造出獨一無二的產品、服務或成果所做「暫時性」的努力。", "src": "ch12a"}, {"id": "q079", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者不是「專案」(Project)？", "o": ["研發新手機", "開發校務資訊系統", "舉辦畢業典禮", "經營早餐店"], "a": 3, "e": "經營早餐店是持續、重複的日常營運，不是專案。", "src": "ch12a"}, {"id": "q080", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "哪一種專案管理辦公室（PMO）除了提供諮詢之外，還要求專案遵循相關規定？", "o": ["支援型", "管制型", "指示型", "配合型"], "a": 1, "e": "管制型 PMO：除了提供諮詢，還要求專案遵循相關規定，管制程度中等。", "src": "ch12a"}, {"id": "q081", "ch": "ch1", "topic": "專案管理基礎", "q": "依 PMBOK 第六版，專案管理共有幾個專案管理過程？", "o": ["42", "49", "47", "39"], "a": 1, "e": "PMBOK 第六版共 49 個專案管理過程，分布在 5 大過程組、10 大知識領域。", "src": "ch12a"}, {"id": "q082", "ch": "ch1", "topic": "專案管理基礎", "q": "「估算活動資源」屬於哪一專案管理知識領域？", "o": ["專案資源管理", "專案範疇管理", "專案採購管理", "專案時間管理"], "a": 0, "e": "估算活動資源屬於專案資源管理（第六版）。", "src": "ch12a"}, {"id": "q083", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者屬於專案管理知識結構中 「軟技術」之部分？", "o": ["成本分析", "品質確保", "風險控管", "決策的分析與下達"], "a": 3, "e": "決策的分析與下達屬軟技術；成本分析、品質確保、風險控管屬硬技術。", "src": "ch12a"}, {"id": "q084", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理指的是：將下列哪些應用於專案活動上，以滿足專案需求？", "o": ["知識", "技能", "工具及技術", "以上皆是"], "a": 3, "e": "專案管理是將知識、技能、工具及技術應用於專案活動上，以滿足專案需求。", "src": "ch12a"}, {"id": "q085", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者不是專案與日常營運工作的共同性？", "o": ["都是靠人來完成", "都受到有限資源的限制", "達成組織特殊的目標", "都必須經過規劃、執行和監視與管制的過程"], "a": 2, "e": "專案與日常營運都靠人完成、受有限資源限制、須經規劃執行與監管；「達成組織特殊目標」是專案才有的。", "src": "ch12a"}, {"id": "q086", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者不是「專案」(Project)的特性？", "o": ["帶來商業價值", "任務的獨特性", "時間的明確性", "資源的可用性"], "a": 3, "e": "專案基本特性：任務獨特、時間明確、有衡量完成的方法、帶來改變、帶來商業價值。資源的可用性不是。", "src": "ch12a"}, {"id": "q087", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理有幾大過程組？", "o": ["3", "4", "5", "6"], "a": 2, "e": "五大過程組：起始、規劃、執行、監視與管制、結束。", "src": "ch12a"}, {"id": "q088", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者屬於專案管理知識結構中「軟技術」之部分？", "o": ["人際關係的互動", "溝通、協調", "談判能力的發揮", "以上皆是"], "a": 3, "e": "人際關係的互動、溝通協調、談判能力都是與人相關的軟技術。", "src": "ch12a"}, {"id": "q089", "ch": "ch2", "topic": "傳統開發模式", "q": "螺旋模式每個循環的四個步驟，順序為何？", "o": ["開發與測試→決定目標→識別與解決風險→規劃下個循環", "決定目標 → 識別與解決風險 → 開發與測試 → 規劃下個循環", "規劃下個循環 → 決定目標 → 開發與測試 → 識別與解決風險", "識別與解決風險 → 決定目標 → 規劃下個循環 → 開發與測試"], "a": 1, "e": "螺旋模式四步驟：決定目標 → 識別與解決風險 → 開發與測試 → 規劃下個循環。", "src": "ch12b"}, {"id": "q090", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 的三大屬性？", "o": ["輕量的", "文件嚴謹", "簡單易懂", "難以精通"], "a": 1, "e": "Scrum 三大屬性：輕量的（文件夠用就好）、簡單易懂、難以精通。", "src": "ch12b"}, {"id": "q091", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式是由哪位學者於哪一年提出？", "o": ["Bally et al.，1977", "Bally et al.，1972", "Barry，1988", "Royce，1970"], "a": 0, "e": "雛型模式由 Bally et al. 於 1977 年提出（漸進模式也是）。", "src": "ch12b"}, {"id": "q092", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者是漸進模式的優點？", "o": ["總開發成本一定低於瀑布模式", "預算編列、付款、系統測試及教育訓練可分階段進行，降低財務風險與專案失敗風險", "不需要對每個漸進階段做完整定義", "各漸進階段之間高度關聯、容易整合"], "a": 1, "e": "漸進模式優點：預算、付款、測試、教育訓練都可分階段進行，降低財務與專案失敗風險。", "src": "ch12b"}, {"id": "q093", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式強調以「雛型演進」代替完整的分析與設計，可能造成什麼問題？", "o": ["開發成本大幅降低", "系統文件較不完備，後續程式維護相對困難", "客戶無法參與需求溝通", "無法快速滿足使用者需求"], "a": 1, "e": "以雛型演進代替完整分析設計，系統文件較不完備，後續程式維護相對困難。", "src": "ch12b"}, {"id": "q094", "ch": "ch2", "topic": "其他敏捷方法論", "q": "哪一種敏捷方法論的重點是「精簡與流程最佳化」，強調減少無法創造客戶價值的工作？", "o": ["DSDM", "FDD", "精益（Lean）", "Crystal"], "a": 2, "e": "精益（Lean）：精簡與流程最佳化，減少無法創造客戶價值的工作。", "src": "ch12b"}, {"id": "q095", "ch": "ch2", "topic": "其他敏捷方法論", "q": "依「敏捷方法和實務的使用率」調查（9th State of Agile），使用率最高的敏捷方法是什麼？", "o": ["Kanban", "Scrum", "XP", "Lean Development"], "a": 1, "e": "第 9 屆 State of Agile 調查中 Scrum 使用率 56%，遠高於其他方法。", "src": "ch12b"}, {"id": "q096", "ch": "ch2", "topic": "Scrum", "q": "下列何者是 Scrum 的三大支柱之一？", "o": ["透明", "承諾", "勇氣", "尊重"], "a": 0, "e": "Scrum 三大支柱：透明、檢視、調適。承諾、勇氣、尊重是五大價值觀。", "src": "ch12b"}, {"id": "q097", "ch": "ch2", "topic": "Scrum", "q": "下列哪一項最符合 Scrum 的定義？", "o": ["一套詳細規定所有文件格式的重量級流程", "以一次完整交付為目標的開發方法", "讓團隊關注於「在最短時間內交付最高商業價值產品」的框架", "專門用於測試階段的管理工具"], "a": 2, "e": "Mike Cohn（2007）：Scrum 是讓我們關注於「在最短時間內交付最高商業價值產品」的框架。", "src": "ch12b"}, {"id": "q098", "ch": "ch2", "topic": "傳統開發模式", "q": "RUP 採用迭代式開發，主要優點為何？", "o": ["完全不需要文件", "不需要專案管理", "可以省略測試", "每次迭代中能及早發現問題，降低開發風險"], "a": 3, "e": "RUP 採迭代式開發，每次迭代中能及早發現問題，降低開發風險。", "src": "ch12b"}, {"id": "q099", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者是螺旋模式的缺點？", "o": ["無法建立雛型", "不重視軟體測試", "客戶無法提供回饋", "過分依賴風險分析的經驗與技術，分析若出現偏差將造成重大損失"], "a": 3, "e": "螺旋模式缺點：過分依賴風險分析的經驗與技術，分析若出現偏差將造成重大損失。", "src": "ch12b"}, {"id": "q100", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式較不適用於哪一類專案？", "o": ["大型及多人參與的系統開發專案", "小型專案", "需要快速確認需求的專案", "使用者介面導向的專案"], "a": 0, "e": "雛型模式缺乏整體規劃、分析與設計，較不適用於大型及多人參與的專案。", "src": "ch12b"}, {"id": "q101", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者「不是」RUP 的九大工作流程之一？", "o": ["企業塑模", "風險分析", "組態管理與變更管理", "環境"], "a": 1, "e": "RUP 九大工作流程：企業塑模、需求、設計、開發、測試、部署、組態管理與變更管理、專案管理、環境。沒有風險分析。", "src": "ch12b"}, {"id": "q102", "ch": "ch2", "topic": "傳統開發模式", "q": "在瀑布模式中，一個階段的結束代表什麼意義？", "o": ["專案正式結束", "必須重新蒐集需求", "客戶必須完成驗收並付款", "專案管理的里程碑，據以決定是否進入下一階段"], "a": 3, "e": "瀑布模式中，一個階段的結束就是專案管理的里程碑，依成果決定是否進入下一階段。", "src": "ch12b"}, {"id": "q103", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者屬於專案管理知識結構中「軟技術」之部分？", "o": ["政治與權力問題的處理", "決策的分析與下達", "人力資源的運用", "以上皆是"], "a": 3, "e": "政治與權力問題的處理、決策的分析與下達、人力資源的運用都是軟技術。", "src": "ch12b"}, {"id": "q104", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者是專案的基本特性？", "o": ["任務是否獨特", "時間是否明確", "是否帶來改變", "以上均是"], "a": 3, "e": "專案基本特性包括任務獨特、時間明確、帶來改變等，全部都是。", "src": "ch12b"}, {"id": "q105", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理知識結構中，硬技術不包含下列何者？", "o": ["衝突的化解", "成本分析", "時程規劃", "過程設計"], "a": 0, "e": "衝突的化解是軟技術；成本分析、時程規劃、過程設計是硬技術。", "src": "ch12b"}, {"id": "q106", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者不屬於專案管理知識結構中「硬技術」之部分？", "o": ["成本分析", "品質確保", "風險控管", "決策的分析與下達"], "a": 3, "e": "決策的分析與下達屬軟技術，不屬硬技術。", "src": "ch12b"}, {"id": "q107", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列哪一項不是「敏捷原則」（Agile Principle）？", "o": ["專案成功依賴於積極的個人，應給予他們所需的支持與信任。", "定期交付可用的軟體（成果），從數週到數月不等，以較長的交付週期為佳。", "敏捷流程強調穩定且持續的開發，發起人、開發者與用戶都應維持穩定的步調。", "精簡-精髓是要盡最大的可能，排除不需要做的工作。"], "a": 1, "e": "敏捷原則第 3 條是「以較短的時間間隔為佳」，B 寫成較長的交付週期，所以錯。", "src": "ch12b"}, {"id": "q108", "ch": "ch1", "topic": "專案管理基礎", "q": "專案計畫書於專案管理過程中何時撰寫？", "o": ["起始過程組", "規劃過程組", "結束過程組", "監視與管制過程組"], "a": 1, "e": "專案計畫書在規劃過程組撰寫。", "src": "ch12b"}, {"id": "q110", "ch": "ch1", "topic": "專案管理基礎", "q": "下列有關「專案」(Project)的敘述，何者不正確？", "o": ["專案是指為了創造出獨一無二的產品、服務或成果所做暫時性的努力", "專案是靠人來完成，受到有限資源的限制，必須經過規劃、執行和監視與管制的過程", "專案是指特殊而有限的任務，或由一群具相互關聯性的工作共同組合的產品、服務或成果。", "專案是持續性、重複性的工作，是執行重要的日常營運任務。"], "a": 3, "e": "專案是暫時性的努力；D 描述的是持續性、重複性的日常營運。", "src": "ch12b"}, {"id": "d000", "ch": "x2", "topic": "人名與年份", "q": "瀑布模式由誰在哪一年提出？", "o": ["Booch，1999", "Bally et al.，1977", "Royce，1970", "Barry，1988"], "a": 2, "e": "演進圖：瀑布模式是 Royce 於 1970 年提出，是最早的模式。", "src": "drill"}, {"id": "d001", "ch": "x2", "topic": "人名與年份", "q": "漸進模式由誰在哪一年提出？", "o": ["Booch，1983", "Royce，1970", "Aoyama，1996", "Bally et al.，1977"], "a": 3, "e": "漸進模式和雛型模式都是 Bally et al. 於 1977 年提出。", "src": "drill"}, {"id": "d002", "ch": "x2", "topic": "人名與年份", "q": "演進圖中的「物件導向開發模式」由誰在哪一年提出？", "o": ["Booch，1999", "Booch，1983", "Bally et al.，1977", "Barry，1988"], "a": 1, "e": "物件導向開發模式是 Booch 1983；Booch 1999 提出的是 RUP。", "src": "drill"}, {"id": "d003", "ch": "x2", "topic": "人名與年份", "q": "RUP 模式由誰在哪一年提出？", "o": ["Beck，2001", "Aoyama，1996", "Booch，1999", "Barry，1988"], "a": 2, "e": "RUP 是 Booch 於 1999 年提出。", "src": "drill"}, {"id": "d004", "ch": "x2", "topic": "人名與年份", "q": "演進圖中的「同步模式」與「MDA 模式」由誰在哪一年提出？", "o": ["Beck，2001", "Aoyama，1996", "Booch，1983", "Bally et al.，1977"], "a": 1, "e": "同步模式和 MDA 模式都是 Aoyama 於 1996 年提出。", "src": "drill"}, {"id": "d005", "ch": "x2", "topic": "人名與年份", "q": "演進圖中的「敏捷開發模式」標示為誰、哪一年？", "o": ["Booch，1999", "Aoyama，1996", "Beck，2001", "Royce，1970"], "a": 2, "e": "敏捷開發模式標示為 Beck 2001，與敏捷宣言同年。", "src": "drill"}, {"id": "d006", "ch": "x2", "topic": "人名與年份", "q": "螺旋模式由誰在哪一年提出？", "o": ["Booch，1983", "Aoyama，1996", "Bally et al.，1977", "Barry，1988"], "a": 3, "e": "螺旋模式是 Barry 於 1988 年提出。", "src": "drill"}, {"id": "d007", "ch": "x2", "topic": "人名與年份", "q": "哪兩個模式同在 1977 年由 Bally et al. 提出？", "o": ["螺旋模式與 RUP", "漸進模式與雛型模式", "雛型模式與螺旋模式", "瀑布模式與漸進模式"], "a": 1, "e": "漸進模式和雛型模式都是 Bally et al. 1977。", "src": "drill"}, {"id": "d008", "ch": "x2", "topic": "人名與年份", "q": "Booch 在演進圖中提出了哪兩個模式？", "o": ["漸進模式與雛型模式", "同步模式與 MDA 模式", "物件導向開發模式與 RUP", "螺旋模式與 RUP"], "a": 2, "e": "Booch 1983 提出物件導向開發模式，1999 提出 RUP。", "src": "drill"}, {"id": "d009", "ch": "x2", "topic": "人名與年份", "q": "依提出年份由早到晚，下列排序何者正確？", "o": ["瀑布 → 螺旋 → 漸進／雛型 → RUP → 物件導向 → 敏捷", "瀑布 → 物件導向 → 漸進／雛型 → 螺旋 → RUP → 敏捷", "漸進／雛型 → 瀑布 → 螺旋 → RUP → 同步／MDA → 敏捷", "瀑布 → 漸進／雛型 → 物件導向 → 螺旋 → 同步／MDA → RUP → 敏捷"], "a": 3, "e": "年份依序：1970、1977、1983、1988、1996、1999、2001。", "src": "drill"}, {"id": "d010", "ch": "x2", "topic": "人名與年份", "q": "Scrum 是在哪一個研討會上被提出的？", "o": ["PMI 全球大會", "OOPSLA（物件導向編程、系統、語言及應用研討會）", "敏捷聯盟年會", "猶他州雪鳥會議"], "a": 1, "e": "Ken Schwaber 和 Jeff Sutherland 於 1995 年在 OOPSLA 共同提出 Scrum。", "src": "drill"}, {"id": "d011", "ch": "x2", "topic": "人名與年份", "q": "「Scrum 是一個讓我們關注於在最短時間內交付最高商業價值產品的框架」是誰在哪一年的定義？", "o": ["Mike Griffiths，2012", "Ken Schwaber，1995", "Jeff Sutherland，2001", "Mike Cohn，2007"], "a": 3, "e": "這是 Mike Cohn（2007）的定義；另一個定義來自 Scrum 指南。", "src": "drill"}, {"id": "d012", "ch": "x2", "topic": "人名與年份", "q": "終極編程（XP）是由哪些人開發的？", "o": ["Jim Highsmith、Alistair Cockburn", "Mary 與 Tom Poppendieck", "Kent Beck、Ron Jeffries、Ward Cunningham", "Ken Schwaber、Jeff Sutherland"], "a": 2, "e": "XP 由 Kent Beck、Ron Jeffries 和 Ward Cunningham 開發；總表上的創建者寫 Kent Beck。", "src": "drill"}, {"id": "d013", "ch": "x2", "topic": "人名與年份", "q": "XP 是在哪一個專案工作時被提出的？", "o": ["豐田汽車的生產線改善專案", "IBM Rational 工具開發專案", "克萊斯勒綜合報酬系統（C3）的薪水冊專案", "為亞洲客戶開發的軟體專案"], "a": 2, "e": "XP 源自克萊斯勒綜合報酬系統（Chrysler Comprehensive Compensation System, C3）的薪水冊專案。", "src": "drill"}, {"id": "d014", "ch": "x2", "topic": "人名與年份", "q": "精益（Lean）軟體開發的創建者是誰？", "o": ["David J. Anderson", "Kent Beck", "Jeff De Luca", "Mary 與 Tom Poppendieck"], "a": 3, "e": "Lean 的創建者是 Mary 與 Tom Poppendieck。", "src": "drill"}, {"id": "d015", "ch": "x2", "topic": "人名與年份", "q": "看板（Kanban）由誰發現？受到什麼啟發？", "o": ["David J. Anderson，受豐田「及時交付」啟發", "Kent Beck，受克萊斯勒 C3 專案啟發", "Poppendieck 夫婦，受日本百貨業啟發", "Alistair Cockburn，受晶體結構啟發"], "a": 0, "e": "Kanban 由 David J. Anderson 發現，受日本豐田汽車「及時交付」（Just-in-Time Delivery）啟發。", "src": "drill"}, {"id": "d016", "ch": "x2", "topic": "人名與年份", "q": "DSDM 由誰在哪一年提出？", "o": ["DSDM 聯盟，1994", "Ken Schwaber，1995", "Jeff De Luca，1997", "Jim Highsmith，2001"], "a": 0, "e": "DSDM 是 DSDM 聯盟（DSDM Consortium）於 1994 年提出。", "src": "drill"}, {"id": "d017", "ch": "x2", "topic": "人名與年份", "q": "DSDM 聯盟的總部設在哪裡？屬於什麼性質的組織？", "o": ["舊金山，非營利組織", "倫敦，非營利組織", "紐約，營利公司", "東京，政府機構"], "a": 1, "e": "DSDM 聯盟屬非營利組織，總部設於倫敦。", "src": "drill"}, {"id": "d018", "ch": "x2", "topic": "人名與年份", "q": "FDD（功能驅動開發）由誰在哪一年提出？", "o": ["Kent Beck，1999", "Jeff De Luca，1997", "Alistair Cockburn，1997", "DSDM 聯盟，1994"], "a": 1, "e": "FDD 是 Jeff De Luca 於 1997 年提出。", "src": "drill"}, {"id": "d019", "ch": "x2", "topic": "人名與年份", "q": "Jeff De Luca 當初提出 FDD，是為了在哪裡提供客戶軟體？", "o": ["澳洲", "歐洲", "美國矽谷", "亞洲"], "a": 3, "e": "Jeff De Luca 在 1997 年為了在亞洲提供客戶軟體，想出這個迭代且有效率交付軟體的方法。", "src": "drill"}, {"id": "d020", "ch": "x2", "topic": "人名與年份", "q": "水晶家族（Crystal Family）的創建者是誰？", "o": ["Alistair Cockburn", "Mike Griffiths", "Jim Highsmith", "Ward Cunningham"], "a": 0, "e": "Crystal 由 Alistair Cockburn 創建。", "src": "drill"}, {"id": "d021", "ch": "x2", "topic": "人名與年份", "q": "APM 模式（構想、推測、探索、調整、結束）是誰提出的？", "o": ["Mike Griffiths", "Jim Highsmith", "Kent Beck", "Mike Cohn"], "a": 1, "e": "APM 模式結構出自 Jim Highsmith。", "src": "drill"}, {"id": "d022", "ch": "x2", "topic": "人名與年份", "q": "敏捷通用流程（AUP）概觀圖出自誰？", "o": ["Booch", "Jim Highsmith", "Mike Cohn", "Mike Griffiths"], "a": 3, "e": "AUP 出自 Mike Griffiths。注意 APM 是 Jim Highsmith，Mike Cohn 是 Scrum 定義。", "src": "drill"}, {"id": "d023", "ch": "x2", "topic": "人名與年份", "q": "RUP 的支援工具受限於哪一家公司的軟體？", "o": ["Oracle Primavera", "IBM Rational", "Atlassian Jira", "Microsoft Project"], "a": 1, "e": "RUP 的缺點之一：支援工具受限於 IBM Rational 軟體。", "src": "drill"}, {"id": "d024", "ch": "x2", "topic": "方法論對照", "q": "摘要為「敏捷專案管理架構」，強調「組成團隊、安排工作」的是哪一種方法論？", "o": ["DSDM", "Scrum", "XP", "Crystal"], "a": 1, "e": "Scrum：敏捷專案管理架構，強調組成團隊、安排工作。", "src": "drill"}, {"id": "d025", "ch": "x2", "topic": "方法論對照", "q": "摘要為「強調在對的時間交付對的成果」，以結構化方式快速開發、綜整最佳實務的是？", "o": ["Kanban", "FDD", "Lean", "DSDM"], "a": 3, "e": "DSDM：在對的時間交付對的成果，以結構化的方式快速開發、綜整最佳實務。", "src": "drill"}, {"id": "d026", "ch": "x2", "topic": "方法論對照", "q": "摘要為「專注於產品功能的交付」，迭代開發出使用者所要功能的是？", "o": ["FDD", "XP", "DSDM", "Scrum"], "a": 0, "e": "FDD（功能驅動開發）：專注於產品功能的交付。", "src": "drill"}, {"id": "d027", "ch": "x2", "topic": "方法論對照", "q": "摘要為「條列出特定情況的解決方案」，強調人、溝通、產品和組織動態有機融合的是？", "o": ["水晶家族（Crystal）", "DSDM", "Lean", "Scrum"], "a": 0, "e": "Crystal：條列出特定情況的解決方案，強調人、溝通、產品和組織動態有機融合的嚴謹流程。", "src": "drill"}, {"id": "d028", "ch": "x2", "topic": "方法論對照", "q": "摘要為「工作可視化與限制進行中工作」，強調及時開發的是？", "o": ["XP", "精益（Lean）", "FDD", "看板（Kanban）"], "a": 3, "e": "Kanban：工作可視化與限制進行中工作，強調可視化與管理工作流程、及時開發。", "src": "drill"}, {"id": "d029", "ch": "x2", "topic": "方法論對照", "q": "摘要為「專注於敏捷開發實務」，強調效率、聚焦於客戶、回饋及品質的是？", "o": ["Scrum", "XP", "Crystal", "FDD"], "a": 1, "e": "XP：專注於敏捷開發實務。", "src": "drill"}, {"id": "d030", "ch": "x2", "topic": "方法論對照", "q": "哪一種方法論可以視為其他敏捷方法論的上層？", "o": ["DSDM", "Scrum", "XP", "精益（Lean）"], "a": 3, "e": "精益的 7 項原則在精神上已包含看板和其他敏捷方法，可視為其他方法論的上層。", "src": "drill"}, {"id": "d031", "ch": "x2", "topic": "方法論對照", "q": "水晶家族為什麼用「水晶」命名？", "o": ["沒有兩個晶體是一樣的，就像沒有兩個專案一模一樣", "取自創建者的姓氏", "水晶透明，代表流程透明", "水晶堅硬，代表流程嚴謹"], "a": 0, "e": "用「水晶」命名，是因為沒有兩個晶體是一樣的，就好像沒有兩個專案是一模一樣的。", "src": "drill"}, {"id": "d032", "ch": "x2", "topic": "方法論對照", "q": "DSDM 是哪一種開發方式更結構化的版本？", "o": ["螺旋模式", "瀑布模式", "快速應用開發（RAD）", "RUP"], "a": 2, "e": "DSDM 是一種更結構化的「快速應用開發（Rapid Application Development）」。", "src": "drill"}, {"id": "d033", "ch": "x2", "topic": "方法論對照", "q": "精益（Lean）軟體開發源自什麼？", "o": ["克萊斯勒的薪資系統專案", "IBM 的軟體流程", "豐田的生產製造流程", "日本百貨業的廣告牌"], "a": 2, "e": "精益軟體開發源於豐田的生產製造流程，主要概念是以客戶為主。", "src": "drill"}, {"id": "d034", "ch": "x2", "topic": "方法論對照", "q": "「看板」一詞的原意是什麼？", "o": ["工作清單", "流程圖", "招牌或廣告牌", "會議紀錄"], "a": 2, "e": "看板的原意是招牌或廣告牌，豐田和日本百貨業用它顯示待做、進行中、可交付的產品。", "src": "drill"}, {"id": "d035", "ch": "x2", "topic": "方法論對照", "q": "XP 角色對照 Scrum，下列何者正確？", "o": ["教練相當於產品負責人", "客戶相當於開發團隊", "客戶相當於產品負責人", "測試者相當於 Scrum 大師"], "a": 2, "e": "程式設計師＋測試者＝開發團隊；教練＝Scrum 大師；客戶＝產品負責人。", "src": "drill"}, {"id": "d036", "ch": "x2", "topic": "模式與流程", "q": "RUP 的四個階段，順序何者正確？", "o": ["初始 → 詳述 → 建構 → 轉移", "初始 → 建構 → 詳述 → 轉移", "詳述 → 初始 → 建構 → 轉移", "構想 → 推測 → 探索 → 調整"], "a": 0, "e": "RUP 四階段：初始、詳述、建構、轉移。構想、推測、探索、調整是 APM。", "src": "drill"}, {"id": "d037", "ch": "x2", "topic": "模式與流程", "q": "在 RUP 開發流程圖中，「企業塑模」的工作量主要集中在哪個階段？", "o": ["轉移階段", "建構階段", "平均分布在四個階段", "初始階段"], "a": 3, "e": "企業塑模是 RUP 的首要工作，工作量集中在專案前段的初始階段。", "src": "drill"}, {"id": "d038", "ch": "x2", "topic": "模式與流程", "q": "在 RUP 開發流程圖中，「部署」的工作量主要集中在哪個階段？", "o": ["轉移階段", "初始階段", "詳述階段", "平均分布在四個階段"], "a": 0, "e": "部署集中在最後的轉移階段。", "src": "drill"}, {"id": "d039", "ch": "x2", "topic": "模式與流程", "q": "螺旋模式圖中，雛型的演進順序為何？", "o": ["雛型 1 → 雛型 2 → 可運轉雛型", "雛型 1 → 可運轉雛型 → 雛型 2", "整個流程只建立一個雛型", "可運轉雛型 → 雛型 1 → 雛型 2"], "a": 0, "e": "螺旋由內往外，每一圈都做風險分析，雛型依序為雛型 1、雛型 2、可運轉雛型。", "src": "drill"}, {"id": "d040", "ch": "x2", "topic": "模式與流程", "q": "雛型模式的流程中，客戶評估雛型後若不滿意，接下來會怎麼做？", "o": ["檢討／更新後回到設計，再產出新雛型", "結束專案", "直接進入正式開發", "直接進行部署"], "a": 0, "e": "雛型模式：原始需求 → 設計 → 產出雛型 → 客戶評估 → 檢討／更新，反覆循環到滿意才正式開發。", "src": "drill"}, {"id": "d041", "ch": "x2", "topic": "模式與流程", "q": "雛型模式流程中，客戶評估滿意之後的步驟順序為何？", "o": ["部署 → 測試 → 維護", "維護 → 正式開發 → 測試", "正式開發 → 測試 → 維護", "測試 → 正式開發 → 維護"], "a": 2, "e": "客戶評估滿意後依序進入正式開發、測試、維護。", "src": "drill"}, {"id": "d042", "ch": "x2", "topic": "模式與流程", "q": "APM 模式中，產出「發布計畫書（Release Plan）」的是哪個階段？", "o": ["調整（Adapt）", "探索（Explore）", "推測（Speculate）", "構想（Envision）"], "a": 2, "e": "推測階段依據故事待辦清單產出發布計畫書。", "src": "drill"}, {"id": "d043", "ch": "x2", "topic": "模式與流程", "q": "APM 模式中，「構想（Envision）」階段的產出是什麼？", "o": ["完成的故事", "最終產品", "願景（Vision）", "發布計畫書"], "a": 2, "e": "構想階段產出願景；推測產出發布計畫書；探索產出完成的故事。", "src": "drill"}, {"id": "d044", "ch": "x2", "topic": "模式與流程", "q": "APM 模式中，哪幾個階段會反覆循環？", "o": ["推測 → 探索 → 調整", "探索 → 調整 → 結束", "構想 → 結束", "構想 → 推測 → 探索"], "a": 0, "e": "推測、探索、調整是循環；構想和結束只各發生一次。", "src": "drill"}, {"id": "d045", "ch": "x2", "topic": "模式與流程", "q": "敏捷通用流程（AUP）的流程順序為何？", "o": ["構想 → 推測 → 探索 → 調整 → 結束", "起始 → 可行性研究 → 迭代 → 發布規劃 → 結束", "初始 → 詳述 → 建構 → 轉移", "可行性研究 → 起始 → 發布規劃 → 迭代 → 結束"], "a": 3, "e": "AUP：可行性研究（Feasibility）→ 起始（Initiation）→ 發布規劃 → 迭代內 → 發布前置迭代 → 結束（Close Out）。", "src": "drill"}, {"id": "d046", "ch": "x2", "topic": "模式與流程", "q": "漸進模式的四個漸進階段，依序建置什麼？", "o": ["核心功能 → 功能一 → 功能二 → 功能三", "功能一 → 功能二 → 功能三 → 核心功能", "需求 → 設計 → 開發 → 測試", "雛型 → 核心功能 → 測試 → 部署"], "a": 0, "e": "漸進一建核心功能，之後依序加入功能一、二、三。", "src": "drill"}, {"id": "d047", "ch": "x2", "topic": "模式與流程", "q": "Scrum 流程中，產品待辦清單、衝刺待辦清單、增量產品的流向為何？", "o": ["產品待辦清單 → 增量產品 → 衝刺待辦清單", "產品待辦清單 → 衝刺待辦清單 → 潛在可交付的增量產品", "增量產品 → 產品待辦清單 → 衝刺待辦清單", "衝刺待辦清單 → 產品待辦清單 → 增量產品"], "a": 1, "e": "衝刺規劃時從產品待辦清單挑出工作放進衝刺待辦清單，衝刺結束產出潛在可交付的增量產品。", "src": "drill"}, {"id": "d048", "ch": "x2", "topic": "數字與清單", "q": "XP 共有幾個核心實務？", "o": ["13 個", "12 個", "7 個", "9 個"], "a": 0, "e": "XP 的核心是 13 個實務，例如結對編程、測試驅動、重構、持續整合。", "src": "drill"}, {"id": "d049", "ch": "x2", "topic": "數字與清單", "q": "精益（Lean）有幾個基本原則？", "o": ["7 個", "12 個", "5 個", "13 個"], "a": 0, "e": "Lean 七原則：消除浪費、強化學習、盡可能晚做決策、盡可能儘快交付、授權團隊、建構完整性、著眼整體。", "src": "drill"}, {"id": "d050", "ch": "x2", "topic": "數字與清單", "q": "Kanban 的主要原則、核心價值、實務，各有幾個？", "o": ["4、6、5", "6、5、4", "5、4、6", "4、5、6"], "a": 3, "e": "Kanban：4 個主要原則、5 個核心價值（與精益共享）、6 個實務。", "src": "drill"}, {"id": "d051", "ch": "x2", "topic": "數字與清單", "q": "水晶家族規定漸進式開發最長不要超過多久？", "o": ["一個月", "六個月", "一年", "四個月"], "a": 3, "e": "Crystal 適用規則：漸進式開發最長不超過四個月，專案前後都要開檢討會議。", "src": "drill"}, {"id": "d052", "ch": "x2", "topic": "數字與清單", "q": "水晶家族分類圖中，橫軸與縱軸分別代表什麼？", "o": ["團隊經驗；風險", "參與人數；臨界（缺陷造成的損失）", "功能數量；品質", "專案時間；預算"], "a": 1, "e": "橫軸是參與人數（±20%），縱軸是臨界，也就是缺陷造成的損失。", "src": "drill"}, {"id": "d053", "ch": "x2", "topic": "數字與清單", "q": "水晶家族的臨界等級，由低到高依序為何？", "o": ["C 安逸／舒適 → E 必要的 → D 可自由支配的 → L 生活", "D 可自由支配的 → C 安逸／舒適 → E 必要的 → L 生活", "L 生活 → E 必要的 → D 可自由支配的 → C 安逸／舒適", "C 安逸／舒適 → D 可自由支配的 → E 必要的 → L 生活"], "a": 3, "e": "臨界由低到高：C（Comfort）、D（Discretionary）、E（Essential）、L（Life），例如 L6 代表 6 人以下、攸關生命的專案。", "src": "drill"}, {"id": "d054", "ch": "x2", "topic": "數字與清單", "q": "水晶家族的顏色從 C6 到 L1000，分為哪幾種？", "o": ["白色、綠色、黃色、紅色及黑色", "紅色、橘色、黃色、綠色及藍色", "透明、藍色、綠色、黃色及紅色", "透明、黃色、橘色、紅色及藍色"], "a": 3, "e": "顏色依參與人數由少到多：透明、黃、橘、紅、藍，人越多顏色越深。", "src": "drill"}, {"id": "d055", "ch": "x2", "topic": "數字與清單", "q": "Mike Cohn 認為，每隔多久任何人都能看到真正可用的軟體？", "o": ["三到六個月", "一年", "每天", "兩週到一個月"], "a": 3, "e": "Mike Cohn：每兩週到一個月，任何人都能看到真正可用的軟體，並決定交付或再加一個衝刺。", "src": "drill"}, {"id": "d056", "ch": "x2", "topic": "數字與清單", "q": "Scrum 每日立會每次多久？每人說幾件事？", "o": ["15 分鐘，5 件事", "30 分鐘，3 件事", "1 小時，4 件事", "15 分鐘，3 件事"], "a": 3, "e": "每天 15 分鐘、站著開，說三件事：昨天完成什麼、今天要做什麼、有沒有困難。", "src": "drill"}, {"id": "d057", "ch": "x2", "topic": "數字與清單", "q": "第 9 屆 State of Agile 調查中，Scrum 的使用率約為多少？", "o": ["56%", "30%", "8%", "10%"], "a": 0, "e": "Scrum 56%，第二名 Scrum/XP Hybrid 約 10%，Custom Hybrid 約 8%。", "src": "drill"}, {"id": "d058", "ch": "x2", "topic": "數字與清單", "q": "Scrum 的角色、儀式、產出、支柱、價值觀，數量分別為？", "o": ["3 角色、4 儀式、4 產出、3 支柱、5 價值觀", "4 角色、3 儀式、4 產出、3 支柱、5 價值觀", "3 角色、5 儀式、4 產出、3 支柱、4 價值觀", "3 角色、4 儀式、3 產出、5 支柱、4 價值觀"], "a": 0, "e": "角色：PO、Scrum 大師、開發團隊；儀式：規劃、立會、審查、回顧；產出：產品待辦、衝刺待辦、增量、燃盡圖；支柱：透明、檢視、調適；價值觀：公開、勇氣、尊重、專注、承諾。", "src": "drill"}, {"id": "d059", "ch": "x2", "topic": "數字與清單", "q": "XP 團隊共有幾種角色？", "o": ["3 種", "5 種", "4 種", "6 種"], "a": 2, "e": "XP 四種角色：程式設計師、測試者、教練、客戶。", "src": "drill"}, {"id": "d060", "ch": "x2", "topic": "數字與清單", "q": "依簡報，DSDM 團隊的核心原則共有幾條？", "o": ["9 條", "12 條", "7 條", "4 條"], "a": 0, "e": "簡報列出 DSDM 九條核心原則；另外有 4 項團隊必須決定的事（MoSCoW）。", "src": "drill"}, {"id": "d061", "ch": "x2", "topic": "數字與清單", "q": "RUP 開發流程圖中，共有幾個工作流程？", "o": ["7 個", "9 個", "4 個", "13 個"], "a": 1, "e": "九個工作流程：企業塑模、需求、設計、開發、測試、部署、組態管理與變更管理、專案管理、環境。", "src": "drill"}, {"id": "d062", "ch": "x2", "topic": "數字與清單", "q": "FDD 專注的兩項工作是什麼？", "o": ["衝刺規劃、每日立會", "工作可視化、限制進行中工作", "創建模型、開發功能列表", "結對編程、重構"], "a": 2, "e": "FDD 專注於創建模型與開發功能列表。", "src": "drill"}, {"id": "d063", "ch": "x2", "topic": "數字與清單", "q": "水晶家族的價值觀是什麼？", "o": ["公開、承諾", "高耐受性、專注於人和溝通", "透明、檢視、調適", "消除浪費、強化學習"], "a": 1, "e": "Crystal 價值觀：高耐受性（High Tolerance）、專注於人和溝通。", "src": "drill"}, {"id": "d064", "ch": "x2", "topic": "數字與清單", "q": "DSDM 團隊必須決定的四件事（MoSCoW），正確的是？", "o": ["現在做、下週做、以後做、不做", "必要的、重要的、次要的、不要的", "高、中、低、無", "必要的、應該要的、可以要的、不要的"], "a": 3, "e": "Musts 必要的、Shoulds 應該要的、Coulds 可以要的、Won't Have 不要的。", "src": "drill"}, {"id": "d065", "ch": "x2", "topic": "數字與清單", "q": "螺旋模式每個循環包含幾個步驟？", "o": ["6 個", "4 個", "5 個", "3 個"], "a": 1, "e": "四步驟：決定目標、識別與解決風險、開發與測試、規劃下個循環。", "src": "drill"}, {"id": "c3ai001", "ch": "ch3", "topic": "架構與生命週期", "q": "APMF 最核心的管理導向為何？", "o": ["把文件數量最大化", "讓所有資源的使用率達到百分之百", "將專案商業價值最大化", "以遵循最初計畫作為唯一標準"], "a": 2, "e": "APMF 是基於價值分析和分解的價值驅動管理模式。【Ch3 講義第 5 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 5}, {"id": "c3ai002", "ch": "ch3", "topic": "架構與生命週期", "q": "講義如何描述敏捷專案管理中的科學化與人性化管理？", "o": ["依企業情況融合協調，平衡點未必在中間", "只能選擇其中一種", "科學化管理應完全排除人性化管理", "兩者必須各占一半"], "a": 0, "e": "講義以陰陽平衡說明兩者融合，每家企業的平衡點不同。【Ch3 講義第 5 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 5}, {"id": "c3ai003", "ch": "ch3", "topic": "架構與生命週期", "q": "APMF 架構用哪四個面向說明由誰做什麼、產出什麼？", "o": ["願景、使命、策略、績效", "參與人員、階段、工作事項、產出", "風險、假設、限制、預算", "範疇、成本、品質、採購"], "a": 1, "e": "四個面向將人員、階段、工作與流程／工作產出連接起來。【Ch3 講義第 7 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 7}, {"id": "c3ai004", "ch": "ch3", "topic": "架構與生命週期", "q": "依講義，敏捷專案一開始的規劃方式為何？", "o": ["直到最後一次發布才規劃需求", "一次完成所有詳細需求後才可開始", "先做大方向規劃，再逐步細化", "不設定任何方向與目標"], "a": 2, "e": "敏捷更具體地實踐漸進明細，以小步快跑持續交付並取得回饋。【Ch3 講義第 9 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 9}, {"id": "c3ai005", "ch": "ch3", "topic": "架構與生命週期", "q": "建立共同願景、準備營運企劃案與核准專案，屬於哪個階段？", "o": ["可行性分析", "起始", "迭代回顧", "結束"], "a": 0, "e": "可行性分析先確認願景與商業論證，並取得專案核准。【Ch3 講義第 10 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 10}, {"id": "c3ai006", "ch": "ch3", "topic": "架構與生命週期", "q": "下列哪組是可行性分析階段的產出？", "o": ["角色卡、產品地圖、團隊章程", "燃盡圖、迭代待辦清單、工作卡", "產品盒／願景卡、營運企劃案、專案核准文件", "驗收測試案例、改進行動方案、用戶故事看板"], "a": 2, "e": "講義將願景、商業論證與核准事項分別對應這些產出。【Ch3 講義第 10 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 10}, {"id": "c3ai007", "ch": "ch3", "topic": "架構與生命週期", "q": "辨識角色之後，用來更詳細描述利害關係人的產出是什麼？", "o": ["角色卡", "產品盒", "燃盡圖", "驗收測試案例"], "a": 0, "e": "角色卡屬於起始階段辨識角色的產出。【Ch3 講義第 11 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 11}, {"id": "c3ai008", "ch": "ch3", "topic": "架構與生命週期", "q": "敏捷專案章程在講義中包含哪兩部分？", "o": ["願景卡與用戶故事看板", "發布待辦清單與測試案例", "產品盒與燃盡圖", "專案章程與團隊章程"], "a": 3, "e": "起始階段的敏捷專案章程包含專案章程及團隊章程。【Ch3 講義第 11 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 11}, {"id": "c3ai009", "ch": "ch3", "topic": "架構與生命週期", "q": "分解用戶故事、定義驗收標準與估算故事點數，主要屬於哪個階段？", "o": ["發布循環", "可行性分析", "專案結束", "專案核准"], "a": 0, "e": "發布循環包含上述事項、發布待辦清單、刺探、迭代與發布回顧。【Ch3 講義第 12 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 12}, {"id": "c3ai010", "ch": "ch3", "topic": "架構與生命週期", "q": "迭代循環中的測試產出，應如何描述？", "o": ["僅包含專案核准文件", "不須可驗收的完整需求清單", "通過驗收測試的增量成果", "只有尚未驗證的設計草稿"], "a": 2, "e": "講義列出驗收測試案例與通過驗收測試的增量成果。【Ch3 講義第 14 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 14}, {"id": "c3ai011", "ch": "ch3", "topic": "架構與生命週期", "q": "專案結束階段除了交付成果，還應做什麼？", "o": ["重新估算所有已完成工作後才建立願景", "進行專案回顧並結束專案活動", "僅刪除所有歷史紀錄", "開始第一次產品待辦清單排序"], "a": 1, "e": "結束階段的工作包括交付成果、專案回顧與結束活動，並產出改進行動方案。【Ch3 講義第 15 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 15}, {"id": "c3ai012", "ch": "ch3", "topic": "架構與生命週期", "q": "依講義範例，一次發布有兩個迭代，每個迭代兩週，發布期間為多久？", "o": ["四週", "兩週", "六週", "八週"], "a": 0, "e": "範例以兩個兩週迭代組成一次四週發布。【Ch3 講義第 16 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 16}, {"id": "c3ai013", "ch": "ch3", "topic": "架構與生命週期", "q": "迭代規劃之後，講義如何描述分析、設計、寫程式與測試？", "o": ["每次迭代只能選其中一項工作", "在迭代內同步進行，之後再審查與回顧", "只在專案最後一次進行測試", "必須各自分成四個獨立發布"], "a": 1, "e": "講義描述迭代內同步進行這些工作，再做迭代審查及回顧。【Ch3 講義第 16 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 16}, {"id": "c3ai014", "ch": "ch3", "topic": "時間盒與自我組織", "q": "敏捷團隊的重要時間紀律是什麼？", "o": ["每次迭代都可任意延長", "遵守固定時間或時間盒", "所有會議長度由當天情緒決定", "只有專案結束日期需要管理"], "a": 1, "e": "專案期程、發布、迭代與每日立會都應在固定時間內完成。【Ch3 講義第 19 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 19}, {"id": "c3ai015", "ch": "ch3", "topic": "時間盒與自我組織", "q": "講義的時間盒圖例中，每日立會的時間為多久？", "o": ["45 分鐘", "15 分鐘", "半天", "2 小時"], "a": 1, "e": "圖例標示每日立會 15 分鐘、迭代兩週、發布一個月及專案六個月；後三者是該圖範例。【Ch3 講義第 20 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 20}, {"id": "c3ai016", "ch": "ch3", "topic": "時間盒與自我組織", "q": "把成果分成多次發布與迭代，主要希望帶來什麼效果？", "o": ["確保最初需求永遠不變", "延後所有客戶接觸直到專案結束", "讓客戶及早看到成果與回饋，降低失敗風險", "使團隊不再需要承諾交付"], "a": 2, "e": "短週期交付讓客戶較早回饋，團隊能據以調整後續工作。【Ch3 講義第 19 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 19}, {"id": "c3ai017", "ch": "ch3", "topic": "時間盒與自我組織", "q": "哪個行為最符合自我組織團隊的「自律」？", "o": ["拒絕參與共同規劃", "只在有人監督時完成工作", "主動拿取工作，不等待別人逐一派工", "等待主管指定每一個動作"], "a": 2, "e": "自律強調主動承擔工作，團隊以共同規劃與互助履行責任。【Ch3 講義第 21 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 21}, {"id": "c3ai018", "ch": "ch3", "topic": "時間盒與自我組織", "q": "團隊成員共同制定規劃並承諾計畫，主要體現什麼？", "o": ["取消所有個人投入與參與", "共同分擔責任", "每個人只對自己的部門負責", "完全由教練承擔交付責任"], "a": 1, "e": "每位成員都有責任規劃、投入及積極參與，並互相協助完成任務。【Ch3 講義第 21 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 21}, {"id": "c3ai019", "ch": "ch3", "topic": "時間盒與自我組織", "q": "團隊的核心價值與工作協議，應如何形成與使用？", "o": ["共同制定並與每位成員溝通，成為共同遵守的基本原則", "只對新進人員有效", "由一位成員秘密決定", "完成後不需要再讓成員知道"], "a": 0, "e": "團隊章程中的核心價值和工作協議，適用於全體團隊成員。【Ch3 講義第 21 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 21}, {"id": "c3ai020", "ch": "ch3", "topic": "時間盒與自我組織", "q": "團隊把規劃、流程與執行狀況放在牆上，是為了什麼？", "o": ["只用來裝飾團隊空間", "讓外部人員可直接改寫所有承諾", "取代所有與客戶的討論", "提高透明度，提早發現問題並互相協助"], "a": 3, "e": "透明化有助及早看出問題、協作與降低失敗風險。【Ch3 講義第 21 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 21}, {"id": "c3ai021", "ch": "ch3", "topic": "時間盒與自我組織", "q": "自我組織與公司制度的關係，何者符合講義？", "o": ["自我組織代表不必遵守任何公司標準", "只有完全脫離組織才能自我組織", "在公司制度與標準下，靈活選擇工作方式", "每個人自行建立互不相容的制度"], "a": 2, "e": "講義將「與公司標準一致」列為自我組織團隊應做到的事項。【Ch3 講義第 21 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 21}, {"id": "c3ai022", "ch": "ch3", "topic": "團隊角色與職責", "q": "依 APMF，哪一組屬於敏捷團隊成員？", "o": ["僅贊助者與所有外部利害關係人", "僅部門主管與財務主管", "只有專案經理與採購經理", "產品負責人、敏捷教練、團隊成員、測試者"], "a": 3, "e": "贊助者及利害關係人位於外圈，對專案影響大，但並非此處所列的敏捷團隊成員。【Ch3 講義第 24 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 24}, {"id": "c3ai023", "ch": "ch3", "topic": "團隊角色與職責", "q": "在 APMF 中，主要由哪個角色面對贊助者或發起人？", "o": ["任意一位外部供應商", "只限財務承辦人", "測試者", "敏捷教練"], "a": 3, "e": "講義對照 Scrum 大師與 APMF 敏捷教練，兩者各在其模式中面對贊助者。【Ch3 講義第 23 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 23}, {"id": "c3ai024", "ch": "ch3", "topic": "團隊角色與職責", "q": "依講義，敏捷與傳統專案管理最大的不同之一是什麼？", "o": ["將利害關係人代表納入敏捷團隊，包含甲乙雙方", "產品負責人不得參與決策", "將客戶完全排除於團隊之外", "只讓贊助者知道專案狀況"], "a": 0, "e": "產品負責人／客戶代表進入團隊，共同依商業價值排序與決策。【Ch3 講義第 25 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 25}, {"id": "c3ai025", "ch": "ch3", "topic": "團隊角色與職責", "q": "講義指出開發團隊通常是怎樣的團隊？", "o": ["成員只能來自同一部門", "至少 50 人且只具備單一職能", "少於 12 人的跨職能團隊", "只由主管組成，不包含實作人員"], "a": 2, "e": "這是本講義對開發團隊的描述，並非所有敏捷方法通用的人數規定。【Ch3 講義第 26 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 26}, {"id": "c3ai026", "ch": "ch3", "topic": "團隊角色與職責", "q": "「通用專家」Generalizing Specialists 的意思為何？", "o": ["只能做單一專業，不能協助他人", "每樣工作都必須達到最高專家程度", "有多項專精，能互相幫忙，但不必每樣工作都精通", "不須具備任何專業能力"], "a": 2, "e": "團隊成員具備專長並能跨工作 題】", "src": "ch3-ai", "slide": 37}, {"id": "c3ai043", "ch": "ch3", "topic": "團隊發展與衝突", "q": "團隊開始互相挑戰，較符合哪個發展階段？", "o": ["高效期 Performing", "專案結束", "建立期 Forming", "風暴期 Storming"], "a": 3, "e": "圖中以 Challenging each other 描述風暴期，規範期則開始共同工作。【Ch3 講義第 37 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 37}, {"id": "c3ai044", "ch": "ch3", "topic": "團隊發展與衝突", "q": "成員分享資訊、以事實為基礎互助解題，屬於哪個衝突等級？", "o": ["第三級：競爭", "第一級：解決問題", "第四級：聖戰", "第五級：世界大戰"], "a": 1, "e": "第一級的管理方式是合作，尋找雙贏結果。【Ch3 講義第 38 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 38}, {"id": "c3ai045", "ch": "ch3", "topic": "團隊發展與衝突", "q": "成員謹慎且各自表述，出現保護個人利益的合作，屬於哪個衝突等級？", "o": ["第二級：不同意", "第四級：聖戰", "第一級：解決問題", "第五級：世界大戰"], "a": 0, "e": "第二級對應的管理方式是支持並授權每個人解決問題。【Ch3 講義第 38 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 38}, {"id": "c3ai046", "ch": "ch3", "topic": "團隊發展與衝突", "q": "「贏過對方比解決問題重要」，言語出現人身攻擊，屬於哪一級？", "o": ["第一級：解決問題", "第四級：聖戰", "第二級：不同意", "第三級：競爭"], "a": 3, "e": "競爭階段宜調停、談判並取得事實。【Ch3 講義第 38 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 38}, {"id": "c3ai047", "ch": "ch3", "topic": "團隊發展與衝突", "q": "衝突焦點轉為保護自己的團體，言語充滿意識形態，屬於哪一級？", "o": ["第一級：解決問題", "第三級：競爭", "第四級：聖戰", "第二級：不同意"], "a": 2, "e": "第四級宜建立安全結構，使用外交手段處理。【Ch3 講義第 38 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 38}, {"id": "c3ai048", "ch": "ch3", "topic": "團隊發展與衝突", "q": "成員以摧毀對方為目標，幾乎不再溝通時，應優先如何處理？", "o": ["只增加績效獎金", "盡必要努力避免互相傷害", "鼓勵雙方繼續競爭直到分出勝負", "要求雙方停止提供任何事實"], "a": 1, "e": "這屬於第五級世界大戰，安全與避免傷害是優先考量。【Ch3 講義第 38 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 38}, {"id": "c3ai049", "ch": "ch3", "topic": "溝通與團隊空間", "q": "依講義，雙向溝通中最有效率與效能的方式為何？", "o": ["只播放不可問答的影片", "面對面高頻寬溝通", "只寄送紙本文件", "只把訊息貼在未讀公告區"], "a": 1, "e": "面對面可即時問答，是講義強調的高頻寬溝通。【Ch3 講義第 40 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 40}, {"id": "c3ai050", "ch": "ch3", "topic": "溝通與團隊空間", "q": "敏捷團隊集中在同一間辦公室，可藉聆聽達到哪種溝通？", "o": ["完全隔離溝通", "滲透式溝通", "只靠正式公文溝通", "單向命令溝通"], "a": 1, "e": "共同空間可透過聆聽取得相關資訊，形成滲透式溝通。【Ch3 講義第 41 頁｜AI 模擬題】", "src": "ch3-ai", "slide": 41}, {"id": "c3ai051", "ch": "ch3", "topic": "溝通與團隊空間", "q": "關於團隊距離與溝通成本，講義的觀點是什麼？", "o": ["距離 "ch": "ch3", "topic": "架構與生命週期", "q": "某公司導入敏捷時，要求每個部門完全照搬同一套流程，不得調整。依你對敏捷的了解，你覺得應該要採取下列哪一項建議做調整會比較恰當？", "o": ["維持敏捷價值觀與原則，再依組織文化及需求裁適流程", "尊重成員的意願，必要時可取消或更動敏捷價值觀與原則無妨", "將所有流程改為個人自行決定，不需要共同架構", "先固定工具，再要求所有專案改變目標以配合工具"], "a": 0, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 62 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher063", "ch": "ch3", "topic": "架構與生命週期", "q": "某團隊在第一次發布後收到客戶回饋，只修正已交付的功能，卻不調整後續規劃。此做法最主要忽略了什麼？", "o": ["發布後應立即結束專案", "客戶回饋只能用於最終驗收", "後續規劃只能由贊助者更動", "回饋也應用於修正後續規劃，落實漸進明細"], "a": 3, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 63 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher064", "ch": "ch3", "topic": "架構與生命週期", "q": "某專案尚未確認共同願景與商業論證，就開始進行詳細的用戶故事點數估算。依APMF階段安排，最應優先補足哪一項工作？", "o": ["準備所有迭代的驗收測試案例", "完成可行性分析所需的願景、營運企劃案與專案核准", "進行專案結束回顧", "決定每日立會的發言順序"], "a": 1, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 64 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher065", "ch": "ch3", "topic": "架構與生命週期", "q": "團隊正在建立角色卡、進行高階估算，並繪製產品地圖。這組工作最可能屬於APMF的哪一階段？", "o": ["可行性分析階段", "結束階段", "起始階段", "迭代審查階段"], "a": 2, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 65 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher066", "ch": "ch3", "topic": "架構與生命週期", "q": "某團隊已準備展開下一迭代，但對其中一項用戶故事的細節仍不清楚。在這種狀況下，最適合運用哪一項活動補足資料？", "o": ["可行性分析", "迭代審查", "迭代回顧", "刺探（Spike）"], "a": 3, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 66 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher067", "ch": "ch3", "topic": "架構與生命週期", "q": "某團隊準備依下列順序進行工作：①迭代規劃、②開發與測試增量成果、③迭代審查與回顧、④下一迭代規劃。下列敘述何者正確？", "o": ["此順序能讓團隊將本次檢視與回顧的發現帶入下一次規劃", "應將③移至整個專案結束後才進行", "應取消②中的測試，留到迭代完成後進行", "應先完成④，才可討論本次迭代的改進事項"], "a": 0, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 67 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher068", "ch": "ch3", "topic": "架構與生命週期", "q": "某團隊每兩週完成一次迭代，但從未將成果交付客戶。團隊宣稱：「只要持續迭代，就已充分實現敏捷。」你身為敏捷專案經理，你的看法是？", "o": ["正確，迭代是敏捷最重要的核心，有持續迭代即可", "仍應透過發布交付有價值的增量成果，並取得客戶回饋", "正確，客戶只需在最後專案最終驗收時滿意即可", "應取消迭代，改為一次完成全部成果"], "a": 1, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 68 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher069", "ch": "ch3", "topic": "架構與生命週期", "q": "某次發布包含3次迭代，每次迭代2週。團隊規劃連續進行2次相同安排的發布。若不另計其他時間，總共需要多久？", "o": ["6週", "8週", "10週", "12週"], "a": 3, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 69 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher070", "ch": "ch3", "topic": "時間盒與自我組織", "q": "團隊預計在下一次規劃前，先討論本次合作方式與流程有哪些地方可以改善。下列哪一組「活動與產出」最符合此目的？", "o": ["可行性分析與產品盒", "角色辨識與角色卡", "回顧會議與改進行動方案", "高階估算與產品地圖"], "a": 2, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 70 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher071", "ch": "ch3", "topic": "時間盒與自我組織", "q": "團隊成員表示：「自我組織就是每個人各做各的，完成自己的部分就好。」下列哪一項最能指出此說法的問題？", "o": ["自我組織仍要求共同承諾、分擔責任及互相支援", "自我組織要求所有工作都由主管指派", "自我組織表示不需要與客戶溝通", "自我組織只適用於沒有共同目標的工作"], "a": 0, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 71 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher072", "ch": "ch3", "topic": "時間盒與自我組織", "q": "某成員已完成自己的工作，但另一位成員的高優先工作遇到困難。在此情況下，最符合敏捷團隊精神的做法為何？", "o": ["優先挑選較容易完成的低價值工作，增加個人完成件數", "等敏捷教練下令後，才考慮是否協助", "將困難工作退回產品負責人，要求他親自完成", "在能力範圍內提供支援，協助團隊完成共同承諾"], "a": 3, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 72 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher073", "ch": "ch3", "topic": "時間盒與自我組織", "q": "某開發人員認為高商業價值的工作較困難，因此只挑選清單底部自己熟悉的工作。針對這種情況，最適當的調整方式為何？", "o": ["只要個人工作速度快，就不需要考慮清單排序", "依專長優先承接高價值工作，必要時與其他成員合作", "將所有困難工作保留到專案最後處理", "由贊助者取代開發人員完成困難工作"], "a": 1, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 73 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher074", "ch": "ch3", "topic": "時間盒與自我組織", "q": "某公司認為「通用專家」代表每個人都必須精通所有技術，才能加入敏捷團隊。針對這個說法，下列哪一項修正最適當？", "o": ["成員完全不需具備專長，只需願意參與", "成員應只保留一項專長，以免分散注意力", "成員應具備多項專精並能互助，但不必樣樣精通", "團隊只需要一位精通全部工作的成員，其餘人員不需學習"], "a": 2, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 74 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher075", "ch": "ch3", "topic": "時間盒與自我組織", "q": "某團隊允許成員自行安排工作，但要求所有人完全照主管指定的方式執行，且不得提出改進。這種情況反應的是？", "o": ["此安排充分落實了自下而上的智慧", "此安排削弱了自我組織與團隊改善工作方式的空間", "只要成員能自行選擇上班時間，就代表充分授權", "敏捷團隊本來就不應參與流程決策"], "a": 1, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 75 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher076", "ch": "ch3", "topic": "團隊角色與職責", "q": "產品負責人長期無法聯繫，且對需求優先順序沒有決策權。這最可能造成哪一項問題？", "o": ["團隊難以及時確認工作方向，並將生產力轉換為價值", "團隊可以因此省略所有需求確認", "敏捷教練自然取得所有產品決策權", "贊助者不再需要關注產品價值"], "a": 0, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 76 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher077", "ch": "ch3", "topic": "團隊角色與職責", "q": "多位主管分別要求團隊優先處理自己的需求，導致工作順序互相衝突。最適當的處理方式為何？", "o": ["讓每位開發人員自行選擇要聽從哪位主管", "以提出需求者的職級決定優先順序", "由產品負責人整合需求，依商業價值排定優先順序", "將所有需求設為最高優先，要求團隊同時完成"], "a": 2, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 77 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher078", "ch": "ch3", "topic": "團隊角色與職責", "q": "下列哪一組分工最符合敏捷團隊的運作方式？", "o": ["贊助者決定所有技術細節，測試者決定產品價值", "敏捷教練提供全部經費，產品負責人移除所有組織障礙", "開發團隊決定全部產品優先順序，產品負責人執行每日測試", "產品負責人決定做什麼及順序，敏捷教練協助團隊合作與排除障礙"], "a": 3, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 78 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher079", "ch": "ch3", "topic": "團隊角色與職責", "q": "當某專案發生跨部門資源障礙，團隊成員無法自行排除時，敏捷教練該做什麼？", "o": ["協助移除障礙，必要時與贊助者或發起人協調", "要求成員在沒有資源的情況下照原計畫完成", "直接取消產品負責人的需求決策權", "將問題留到專案結束時再討論"], "a": 0, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 79 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher080", "ch": "ch3", "topic": "團隊角色與職責", "q": "贊助者認為已提供經費，因此不需要參加任何成果審查。你做為資深敏捷經理，你的建議是？", "o": ["同意，出錢的是大爺，他提供財務資源後本就不需再參與", "應參加發布與迭代審查，了解增量成果及其價值", "應改為每日透過產品負責人替所有成員指派工作", "只需檢查工時紀錄，不需檢視成果"], "a": 1, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 80 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher081", "ch": "ch3", "topic": "僕人式領導與 EQ", "q": "團隊詢問敏捷教練應如何解決某項問題。下列哪一項回應最能同時展現授權與支持？", "o": ["「等我找出唯一正確的答案，你們再開始。」", "「你們自己決定，我不干預。」", "「先照過去的方法試試看。」", "「你們認為有哪些可行方法？需要哪些資源或協助？」"], "a": 3, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 81 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher082", "ch": "ch3", "topic": "僕人式領導與 EQ", "q": "一個總是幫團隊做為所有決策、自稱採取僕人式領導的主管。其最主要的問題為何？", "o": ["提供協助過少，應增加命令次數", "沒有要求團隊取消共同願景", "持續代替團隊思考，限制成員自主決策與成長", "未將全部問題轉交贊助者處理"], "a": 2, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 82 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher083", "ch": "ch3", "topic": "僕人式領導與 EQ", "q": "在討論衝突時，敏捷教練先完整聽取成員說法，再確認自己是否理解，最後提出回應。此做法最符合哪一項概念？", "o": ["流程裁適", "積極傾聽", "高階估算", "角色辨識"], "a": 1, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 83 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher084", "ch": "ch3", d": "c3teacher092", "ch": "ch3", "topic": "團隊發展與衝突", "q": "某團隊衝突升高，雙方以摧毀對方為目標，且幾乎不再交談。此時最優先的處理目標為何？", "o": ["避免彼此傷害", "加快下一迭代的點數估算", "增加產品待辦清單的項目", "立即要求雙方共同承諾更多工作"], "a": 0, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 92 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher093", "ch": "ch3", "topic": "溝通與團隊空間", "q": "團隊透過大量電子郵件討論模糊需求，往返多次仍無共識。最適當的改善方式為何？", "o": ["增加副本收件人，讓更多人收到同樣內容", "將每封郵件改得更長，減少即時互動", "將討論延至專案最終驗收", "安排面對面白板討論，透過雙向問答澄清需求"], "a": 3, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 93 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher094", "ch": "ch3", "topic": "溝通與團隊空間", "q": "公司將原本同室工作的團隊分散到不同樓層，卻未補充其他溝通安排。最可能受到影響的是什麼？", "o": ["自然聆聽周遭對話的機會減少，溝通成本可能增加", "團隊一定能獲得更多滲透式溝通", "因距離增加，團隊就不再需要共同規範", "所有成員的技術能力會立即下降"], "a": 0, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 94 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher095", "ch": "ch3", "topic": "溝通與團隊空間", "q": "某公司設置團隊作戰室，但禁止成員討論，也不展示任何專案資訊。最合理的評估為何？", "o": ["只要空間名稱是作戰室，就已達成目的", "禁止討論能充分發揮集中辦公的價值", "雖集中辦公，卻未充分發揮促進溝通與團隊意識的功能", "資訊應只提供給主管，才符合保密原則"], "a": 2, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 95 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher096", "ch": "ch3", "topic": "溝通與團隊空間", "q": "某跨國遠距團隊成員能力優秀，合作卻持續不順。下列哪一項分析最合理？", "o": ["人才優秀就足以保證合作，不需檢視其他因素", "除專業能力外，還應檢視溝通協作、時區、階級意識及文化差異", "遠距團隊不適合建立共同工作方式", "只要增加每日個人工時，就能排除所有問題"], "a": 1, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 96 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher097", "ch": "ch3", "topic": "溝通與團隊空間", "q": "某專案的流程與文件都很完整，但團隊不願合作，也不接受客戶回饋。最適當的改善方向為何？", "o": ["增加文件頁數，讓流程更完整", "將所有問題交由主管逐項裁決", "同時檢視管理流程與人的互動，恢復價值導向及協作", "停止與客戶接觸，避免需求變動"], "a": 2, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 97 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher098", "ch": "ch3", "topic": "教練方式與情境", "q": "敏捷教練要安排一個迭代的指導方式，下列哪一項最適當？", "o": ["初期只進行個別指導，末期不再參與", "初期個別教練，中期全隊教練，末期再進行個別教練", "只有發生嚴重衝突時才提供全隊指導", "初期全隊教練，中期個別教練，末期再進行全隊教練"], "a": 3, "e": "答案依老師公布的正確答案。【Ch3 老師小考第 98 題｜老師原題】", "src": "ch3-teacher"}, {"id": "c3teacher099", "ch": "ch3", "topic": "教練方式與情境", "q": "每日立會中，某成員提出目前工作遭遇的阻礙，接著有人建議立即在會中重新設計公司整體制度。此時，最適當的處理方式為何？", "o": ["讓會議持續進行，直
