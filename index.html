const CH = {ch1:'Ch1',ch2:'Ch2',x2:'Ch2',ch3:'Ch3'};
const SOURCE={original:'原有題庫',lecture:'講義習題',teacher:'老師小考',ai:'AI 模擬'};
const chapterOf=q=>q.ch==='x2'?'ch2':q.ch;
const sourceOf=q=>q.src==='drill'||q.src==='ch3-ai'?'ai':q.src==='ch3-lecture'?'lecture':q.src==='ch3-teacher'?'teacher':'original';
const questionNumber=q=>BANK.indexOf(q)+1;
const BANKS = {exam:{name:'專案管理題庫', sub:'Ch1–Ch3 章節練習；Ch2 AI 模擬 66 題，Ch3 含 105 題老師小考原題、60 題 AI 模擬與 5 題講義習題。AI 模擬題依講義編製，非實際考題。', has:q=>true}};
const inBank=q=>(st.ch==='all'||chapterOf(q)===st.ch)&&(st.source==='all'||sourceOf(q)===st.source);
const TOPIC_ORDER=['專案管理基礎','創新與時代趨勢','敏捷思維與宣言','組織專案管理與 PMO','傳統開發模式','Scrum','其他敏捷方法論','人名與年份','方法論對照','模式與流程','數字與清單'];
const TOPICS = [...new Set(BANK.map(q=>q.ch+'|'+q.topic))].map(s=>{const [ch,t]=s.split('|');return {ch,t};}).sort((a,b)=>a.ch.localeCompare(b.ch)||TOPIC_ORDER.indexOf(a.t)-TOPIC_ORDER.indexOf(b.t));
const KEY='pm-quiz-v1';
let rec = {};
try{ rec = JSON.parse(localStorage.getItem(KEY)||'{}') || {}; }catch(e){ rec = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(rec)); }catch(e){} }

const st={bank:'exam',ch:'all',source:'all',topics:new Set(),mode:'all',count:20};
const SETTINGS_KEY='pm-quiz-settings-v2',SESSION_KEY='pm-quiz-session-v1';
try{const p=JSON.parse(localStorage.getItem(SETTINGS_KEY)||'null');if(p){if(['all','ch1','ch2','ch3'].includes(p.ch))st.ch=p.ch;if(['all','original','lecture','teacher','ai'].includes(p.source))st.source=p.source;if([10,20,40,0].includes(p.count))st.count=p.count;}}catch{}
function saveSettings(){try{localStorage.setItem(SETTINGS_KEY,JSON.stringify({ch:st.ch,source:st.source,count:st.count}))}catch{}}
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const L = 'ABCD';

function segment(el, items, get, set){
  el.innerHTML='';
  items.forEach(([v,label])=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=label;
    b.setAttribute('aria-pressed', String(get()===v));
    b.onclick=()=>{ set(v); renderHome(); };
    el.appendChild(b);
  });
}

function pool(){
  return BANK.filter(q=>{
    if(!inBank(q)) return false;
    if(st.topics.size && !st.topics.has(q.ch+'|'+q.topic)) return false;
    const r=rec[q.id];
    if(st.mode==='wrong') return r && r.last===false;
    if(st.mode==='new') return !r;
    return true;
  });
}

function renderHome(){
  $('subtitle').textContent='Ch1–Ch3 章節練習、講義習題、老師小考與 AI 模擬題。';
  segment($('chSeg'),[['all','全部'],['ch1','Ch1'],['ch2','Ch2'],['ch3','Ch3']],()=>st.ch,v=>{st.ch=v;st.topics.clear();document.querySelector('.topic-options').open=v!=='all';if(!BANK.some(inBank))st.source='all';});
  segment($('sourceSeg'),[['all','全部來源'],['original','原有題庫'],['lecture','講義習題'],['teacher','老師小考'],['ai','AI 模擬']],()=>st.source,v=>{st.source=v;st.topics.clear();});
  Array.from($('sourceSeg').children).forEach((b,i)=>{const key=['all','original','lecture','teacher','ai'][i];b.disabled=!BANK.some(q=>(st.ch==='all'||chapterOf(q)===st.ch)&&(key==='all'||sourceOf(q)===key));});
  saveSettings();
  const tc=$('topicChips'); tc.innerHTML='';
  TOPICS.filter(t=>BANK.some(q=>inBank(q)&&q.ch===t.ch&&q.topic===t.t)).forEach(t=>{
    const k=t.ch+'|'+t.t, n=BANK.filter(q=>q.ch===t.ch&&q.topic===t.t).length;
    const b=document.createElement('button'); b.type='button';
    b.innerHTML=(st.ch==='all'?CH[t.ch]+' ':'')+esc(t.t)+'<small>'+n+'</small>';
    b.setAttribute('aria-pressed', String(st.topics.has(k)));
    b.onclick=()=>{ st.topics.has(k)?st.topics.delete(k):st.topics.add(k); renderHome(); };
    tc.appendChild(b);
  });
  const wrongN=BANK.filter(q=>inBank(q)&&rec[q.id]&&rec[q.id].last===false).length;
  segment($('modeSeg'), [['all','全部題目'],['wrong','只練錯題（'+wrongN+'）'],['new','還沒做過的']], ()=>st.mode, v=>st.mode=v);
  segment($('countSeg'), [[10,'10 題'],[20,'20 題'],[40,'40 題'],[0,'全部']], ()=>st.count, v=>st.count=v);
  const p=pool(), n=st.count?Math.min(st.count,p.length):p.length;
  $('poolInfo').textContent = p.length ? `符合條件 ${p.length} 題，這次出 ${n} 題` : (st.mode==='wrong'?'目前沒有答錯的題目':'沒有符合條件的題目');
  $('startBtn').disabled = !p.length;$('quickTen').disabled=!p.length;
  const wrong=BANK.filter(q=>inBank(q)&&rec[q.id]?.last===false);$('quickWrong').textContent=`重練錯題（${wrong.length}）`;$('quickWrong').disabled=!wrong.length;
  $('quickHint').textContent=`${st.ch==='all'?'全部章節':st.ch.toUpperCase()}・${st.source==='all'?'全部來源':SOURCE[st.source]}，${p.length} 題符合設定。`;
  $('topicSummary').textContent=st.topics.size?`已選 ${st.topics.size} 個主題`:'全部主題';
  const pending=readSession();$('resumeBtn').hidden=!pending;if(pending)$('resumeBtn').textContent=`繼續上次（${pending.i+1}/${pending.qs.length}）`;

  renderGrid(); renderStats();
}

function renderGrid(){
  const g=$('grid'); g.innerHTML='';
  const inPool=new Set(pool().map(q=>q.id));
  BANK.filter(inBank).forEach((q,i)=>{
    const r=rec[q.id], b=document.createElement('button');
    b.type='button'; b.className='cell'+(r?(r.last?' ok':' ng'):'')+(inPool.has(q.id)?'':' dim');
    b.textContent=questionNumber(q); b.title=`${CH[q.ch]}・${q.topic}：${q.q}`;
    b.setAttribute('aria-label', `第 ${questionNumber(q)} 題，${r?(r.last?'上次答對':'上次答錯'):'還沒做過'}`);
    b.onclick=()=>startQuiz([q]);
    g.appendChild(b);
  });
  $('gridSummary').textContent=`${BANK.filter(inBank).length} 題・點此展開`;
  const tb=$('topicBars'); tb.innerHTML='';
  TOPICS.filter(t=>BANK.some(q=>inBank(q)&&q.ch===t.ch&&q.topic===t.t)).forEach(t=>{
    const qs=BANK.filter(q=>q.ch===t.ch&&q.topic===t.t);
    const ok=qs.filter(q=>rec[q.id]&&rec[q.id].last).length, ng=qs.filter(q=>rec[q.id]&&rec[q.id].last===false).length;
    const row=document.createElement('div'); row.className='trow';
    row.innerHTML=`<span>${st.ch==='all'?CH[t.ch]+' ':''}${esc(t.t)}</span><span class="bar"><i class="b-ok" style="width:${ok/qs.length*100}%"></i><i class="b-ng" style="width:${ng/qs.length*100}%"></i></span><span class="mono">${ok}/${qs.length}</span>`;
    tb.appendChild(row);
  });
}

function renderStats(){
  const B=BANK.filter(inBank);
  const done=B.filter(q=>rec[q.id]).length, ok=B.filter(q=>rec[q.id]&&rec[q.id].last).length;
  const ng=done-ok;
  $('hdrStats').innerHTML=`<div class="stat"><span class="label">已做過</span><b>${done}<small style="font-size:13px;color:var(--muted)">/${B.length}</small></b></div><div class="stat"><span class="label">上次答對</span><b style="color:var(--good)">${ok}</b></div><div class="stat"><span class="label">待加強</span><b style="color:var(--bad)">${ng}</b></div>`;
}

function readSession(){try{const p=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');if(!p||!Array.isArray(p.qs)||!p.qs.length||!Number.isInteger(p.i)||p.i<0||p.i>=p.qs.length)return null;const ids=new Set(BANK.map(q=>q.id));if(!p.qs.every(x=>ids.has(x.id)&&Array.isArray(x.order)&&x.order.length===4&&[...x.order].sort().join()==='0,1,2,3'))return null;return p;}catch{return null}}
function saveSession(){if(!run)return;try{localStorage.setItem(SESSION_KEY,JSON.stringify({qs:run.qs.map(x=>({id:x.q.id,order:x.order})),i:run.i,right:run.right,picked:run.picked,answered:run.answered,wrong:run.wrong.map(w=>({id:w.q.id,order:w.order,picked:w.picked})),source:run.source.map(q=>q.id)}))}catch{}}
function clearSession(){try{localStorage.removeItem(SESSION_KEY)}catch{}}
function resumeQuiz(){const p=readSession();if(!p){renderHome();return}const byId=new Map(BANK.map(q=>[q.id,q]));run={qs:p.qs.map(x=>({q:byId.get(x.id),order:x.order})),i:p.i,right:p.right||0,wrong:(p.wrong||[]).filter(w=>byId.has(w.id)).map(w=>({...w,q:byId.get(w.id)})),source:(p.source||p.qs.map(x=>x.id)).map(id=>byId.get(id)).filter(Boolean),answered:false,picked:null};show('quiz');renderQ();if(p.answered&&Number.isInteger(p.picked)){run.answered=true;run.picked=p.picked;renderAnswered(p.picked)}saveSession()}
let run=null;
function startQuiz(list){
  const qs=shuffle(list).map(q=>{
    const fixed=q.o.some(o=>/以上/.test(o)) || !$('shuffleOpts').checked;
    const order=fixed?[0,1,2,3]:shuffle([0,1,2,3]);
    return {q, order};
  });
  run={qs,i:0,right:0,wrong:[],answered:false,picked:null,source:list};
  show('quiz'); renderQ();saveSession();
}
function show(id){ ['home','quiz','result'].forEach(s=>$(s).hidden = s!==id); window.scrollTo(0,0); }

function remap(text, order){
  // explanation letters refer to the original option order; map them to the displayed letters
  return text.replace(/(?<![A-Za-z])([A-D])(?![A-Za-z])/g, m=>L[order.indexOf(L.indexOf(m))]);
}

function renderQ(){
  const {q,order}=run.qs[run.i];
  $('qCount').textContent=`第 ${run.i+1} / ${run.qs.length} 題`;
  $('qProg').style.width=(run.i/run.qs.length*100)+'%';
  $('qScore').textContent=`答對 ${run.right}`;
  const n=questionNumber(q), r=rec[q.id];
  $('qMeta').innerHTML=`<span class="tag ch">${CH[q.ch]}</span><span class="tag src-${sourceOf(q)}">${SOURCE[sourceOf(q)]}</span><span class="tag">${esc(q.topic)}</span><span class="tag mono">#${n}</span>`+(r&&r.last===false?'<span class="tag" style="color:var(--bad);border-color:var(--bad)">上次答錯</span>':'');
  $('qText').textContent=q.q;
  const ul=$('qOpts'); ul.innerHTML='';
  order.forEach((orig,pos)=>{
    const li=document.createElement('li');
    const b=document.createElement('button'); b.type='button'; b.className='opt'; b.id='opt'+pos;
    b.innerHTML=`<span class="bubble">${L[pos]}</span><span class="txt">${esc(q.o[orig])}</span>`;
    b.onclick=()=>answer(pos);
    li.appendChild(b); ul.appendChild(li);
  });
  $('qFeedback').innerHTML=''; $('nextBtn').hidden=true; run.answered=false;run.picked=null;
}

function renderAnswered(pos){const {q,order}=run.qs[run.i],correctPos=order.indexOf(q.a),ok=pos===correctPos;
 document.querySelectorAll('.opt').forEach((b,i)=>{b.disabled=true;if(i===correctPos)b.classList.add('right');else if(i===pos)b.classList.add('wrong')});
 $('qScore').textContent=`答對 ${run.right}`;
 $('qFeedback').innerHTML=`<div class="feedback ${ok?'yes':'no'}"><strong>${ok?'答對了':'答錯了，正確答案是 '+L[correctPos]}</strong><p>${esc(remap(q.e,order))}</p></div>`;
 const nb=$('nextBtn');nb.hidden=false;nb.textContent=run.i===run.qs.length-1?'看成績':'下一題';nb.focus({preventScroll:true});
}
function answer(pos){if(run.answered)return;run.answered=true;run.picked=pos;const {q,order}=run.qs[run.i],ok=order.indexOf(q.a)===pos;const prev=rec[q.id]||{n:0,ok:0};rec[q.id]={n:prev.n+1,ok:prev.ok+(ok?1:0),last:ok};save();if(ok)run.right++;else run.wrong.push({q,order,picked:pos});renderAnswered(pos);saveSession();}

function next(){ if(!run.answered) return; if(run.i<run.qs.length-1){ run.i++; renderQ();saveSession(); } else finish(); }

function finish(){
  clearSession();
  const total=run.i+(run.answered?1:0);
  show('result');
  $('rScore').textContent = total ? Math.round(run.right/total*100)+'%' : '—';
  $('rDetail').textContent = `${total} 題答對 ${run.right} 題`;
  $('retryWrongBtn').hidden = !run.wrong.length;
  $('rWrongTitle').textContent = run.wrong.length ? `答錯的 ${run.wrong.length} 題` : (total?'全部答對':'尚未作答');
  $('rWrong').innerHTML = run.wrong.map(w=>{
    const cp=w.order.indexOf(w.q.a);
    return `<div class="witem"><div class="qmeta"><span class="tag ch">${CH[w.q.ch]}</span><span class="tag src-${sourceOf(w.q)}">${SOURCE[sourceOf(w.q)]}</span><span class="tag">${esc(w.q.topic)}</span></div><div class="q">${esc(w.q.q)}</div><div class="ans">你選 <span class="y">${L[w.picked]}. ${esc(w.q.o[w.order[w.picked]])}</span><br>正確 <span class="c">${L[cp]}. ${esc(w.q.o[w.q.a])}</span></div><div class="e">${esc(remap(w.q.e, w.order))}</div></div>`;
  }).join('');
}

$('quickTen').onclick=()=>{const p=pool();if(p.length)startQuiz(shuffle(p).slice(0,10))};
$('quickWrong').onclick=()=>{const p=BANK.filter(q=>inBank(q)&&rec[q.id]?.last===false);if(p.length)startQuiz(p)};
$('resumeBtn').onclick=resumeQuiz;
$('pauseBtn').onclick=()=>{saveSession();show('home');renderHome()};
$('startBtn').onclick=()=>{ const p=pool(); startQuiz(st.count?shuffle(p).slice(0,st.count):p); };
$('nextBtn').onclick=next;
$('quitBtn').onclick=finish;
$('homeBtn').onclick=()=>{ show('home'); renderHome(); };
$('againBtn').onclick=()=>{ const p=pool(); if(p.length) startQuiz(st.count?shuffle(p).slice(0,st.count):p); else { show('home'); renderHome(); } };
$('retryWrongBtn').onclick=()=>startQuiz(run.wrong.map(w=>w.q));
let resetArmed=false;
$('resetBtn').onclick=()=>{
  if(!resetArmed){ resetArmed=true; $('resetBtn').textContent='再按一次確認清除'; setTimeout(()=>{resetArmed=false;$('resetBtn').textContent='清除作答紀錄';},4000); return; }
  rec={}; save(); resetArmed=false; $('resetBtn').textContent='清除作答紀錄'; renderHome();
};
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]') || $('quiz').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const k=e.key.toUpperCase();
  const idx = 'ABCD'.indexOf(k)>=0 ? 'ABCD'.indexOf(k) : '1234'.indexOf(k);
  if(idx>=0 && !run.answered && k.length===1){ e.preventDefault(); answer(idx); }
  else if(e.key==='Enter' && run.answered){ e.preventDefault(); next(); }
});
renderHome();
document.querySelector('.topic-options').open=st.ch!=='all';
</script>


</body>
</html>
