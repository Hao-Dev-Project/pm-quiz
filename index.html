<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="專案管理 Ch1–Ch2 題庫：小考題庫與 Ch2 記憶加練，即時解析、錯題重練，作答紀錄只存在你的瀏覽器。">
<meta name="theme-color" content="#eef1f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11161c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="專案管理題庫">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>專案管理題庫</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: an exam answer sheet — a bubble grid of every question beside the setup, then one question card at a time. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#eef1f4; --sheet:#ffffff; --ink:#18222e; --muted:#5b6876; --rule:#d5dbe2;
  --accent:#2340b8; --accent-soft:#e3e8fb;
  --good:#17845a; --good-soft:#dff3ea; --bad:#c43a4f; --bad-soft:#fbe5e9; --unseen:#f6f8fa;
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11161c; --sheet:#19212a; --ink:#e6ebf1; --muted:#97a3b1; --rule:#2c3743;
  --accent:#8ea2ff; --accent-soft:#232d52;
  --good:#4cc792; --good-soft:#163428; --bad:#f07689; --bad-soft:#3d1c24; --unseen:#1f2832; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161c; --sheet:#19212a; --ink:#e6ebf1; --muted:#97a3b1; --rule:#2c3743;
  --accent:#8ea2ff; --accent-soft:#232d52;
  --good:#4cc792; --good-soft:#163428; --bad:#f07689; --bad-soft:#3d1c24; --unseen:#1f2832; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
#installBtn{font:inherit;font-size:13px}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px}
.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
h1,h2{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
h1{font-size:clamp(26px,4vw,34px);font-weight:900;letter-spacing:.02em}
h2{font-size:18px;font-weight:700}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-bottom:2px solid var(--ink);padding-bottom:14px}
header p{margin:4px 0 0;color:var(--muted)}
.stats{display:flex;gap:20px}
.stat b{display:block;font-family:var(--f-mono);font-size:22px;line-height:1.1}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:22px}
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.home{grid-template-columns:minmax(0,1fr)}}
.field{display:flex;flex-direction:column;gap:8px;padding-block:14px;border-top:1px dashed var(--rule)}
.field:first-of-type{border-top:0;padding-top:4px}
.seg,.chips{display:flex;flex-wrap:wrap;gap:8px}
.seg button,.chips button{font:inherit;font-size:14px;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer}
.seg button[aria-pressed="true"],.chips button[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.chips button small{font-family:var(--f-mono);opacity:.7;margin-left:4px}
.toggle{display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
.start-row{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding-top:16px;border-top:1px dashed var(--rule)}
.btn{font:inherit;font-weight:700;border:0;border-radius:8px;padding:11px 22px;cursor:pointer;background:var(--accent);color:#fff}
:root[data-theme="dark"] .btn{color:#0f1530}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn{color:#0f1530}}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--rule);font-weight:500}
.btn.small{padding:7px 14px;font-size:14px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{color:var(--muted);font-size:13px}
/* answer-card grid */
.card-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.cell{aspect-ratio:1;max-width:100%;border:1px solid var(--rule);border-radius:6px;background:var(--unseen);font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.cell.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.cell.ng{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:600}
.cell.dim{opacity:.25}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px;border:1px solid var(--rule);background:var(--unseen)}
.legend .l-ok::before{background:var(--good-soft);border-color:var(--good)}
.legend .l-ng::before{background:var(--bad-soft);border-color:var(--bad)}
.topics{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.trow{display:grid;grid-template-columns:minmax(0,9em) minmax(0,1fr) 3.6em;gap:10px;align-items:center;font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--unseen);border:1px solid var(--rule);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .b-ok{background:var(--good)} .bar .b-ng{background:var(--bad)}
.trow .mono{text-align:right;color:var(--muted);font-size:12px}
.linkish{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
/* quiz */
.qbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.progress{flex:1 1 200px;height:6px;background:var(--rule);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qcard{max-width:760px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tag{font-size:12px;border:1px solid var(--rule);border-radius:4px;padding:1px 8px;color:var(--muted)}
.tag.ch{border-color:var(--accent);color:var(--accent)}
.qtext{font-size:19px;font-weight:700;line-height:1.6;margin:0}
.opts{display:flex;flex-direction:column;gap:10px;list-style:none;margin:0;padding:0}
.opt{width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:12px 14px;display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.bubble{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-size:13px;font-weight:600;color:var(--muted)}
.opt .txt{min-width:0;padding-top:2px}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .bubble{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bubble{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.feedback{border-left:4px solid var(--good);background:var(--sheet);border-radius:0 8px 8px 0;padding:12px 16px}
.feedback.no{border-left-color:var(--bad)}
.feedback strong{display:block;margin-bottom:2px}
.feedback.yes strong{color:var(--good)} .feedback.no strong{color:var(--bad)}
.feedback p{margin:0}
.nav{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.kbd{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
/* result */
.score{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 18px}
.score .big{font-family:var(--f-mono);font-size:56px;font-weight:600;line-height:1}
.wrong-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.witem{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;background:var(--sheet);display:flex;flex-direction:column;gap:6px}
.witem .q{font-weight:700}
.witem .ans{font-size:14px}
.witem .ans .y{color:var(--bad)} .witem .ans .c{color:var(--good);font-weight:700}
.witem .e{font-size:14px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:480px){.grid{grid-template-columns:repeat(8,minmax(0,1fr))}.stats{gap:14px}.sheet{padding:16px}.qtext{font-size:17px}}
</style>

</head>
<body>
<div class="wrap" id="app">
  <header>
    <div>
      <h1>專案管理題庫</h1>
      <p id="subtitle"></p>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px"><div class="stats" id="hdrStats"></div><button class="btn ghost small" id="installBtn" hidden>安裝到主畫面</button></div>
  </header>

  <section id="home" class="home">
    <div class="sheet">
      <div class="field">
        <span class="label">題庫</span>
        <div class="seg" id="bankSeg"></div>
      </div>
      <div class="field" id="chField">
        <span class="label">章節</span>
        <div class="seg" id="chSeg"></div>
      </div>
      <div class="field">
        <span class="label">主題（可複選，不選＝全部）</span>
        <div class="chips" id="topicChips"></div>
      </div>
      <div class="field">
        <span class="label">出題範圍</span>
        <div class="seg" id="modeSeg"></div>
      </div>
      <div class="field">
        <span class="label">題數</span>
        <div class="seg" id="countSeg"></div>
      </div>
      <div class="field">
        <label class="toggle"><input type="checkbox" id="shuffleOpts" checked> 打亂選項順序</label>
      </div>
      <div class="start-row">
        <button class="btn" id="startBtn">開始測驗</button>
        <span class="hint" id="poolInfo"></span>
      </div>
    </div>

    <div class="sheet">
      <div class="card-head">
        <h2>答題卡</h2>
        <span class="label">點格子可單獨練那一題</span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="legend"><span class="l-ok">上次答對</span><span class="l-ng">上次答錯</span><span>還沒做過</span></div>
      <div class="topics" id="topicBars"></div>
      <div style="margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center" id="resetRow">
        <button class="linkish" id="resetBtn">清除作答紀錄</button>
      </div>
    </div>
  </section>

  <section id="quiz" hidden>
    <div class="qcard">
      <div class="qbar">
        <span class="mono" id="qCount"></span>
        <div class="progress"><i id="qProg"></i></div>
        <span class="mono" id="qScore"></span>
        <button class="btn ghost small" id="quitBtn">結束</button>
      </div>
      <div class="sheet" style="display:flex;flex-direction:column;gap:16px">
        <div class="qmeta" id="qMeta"></div>
        <p class="qtext" id="qText"></p>
        <ul class="opts" id="qOpts"></ul>
        <div id="qFeedback"></div>
      </div>
      <div class="nav">
        <span class="kbd" id="kbdHint">鍵盤：A–D 或 1–4 作答，Enter 下一題</span>
        <button class="btn" id="nextBtn" hidden>下一題</button>
      </div>
    </div>
  </section>

  <section id="result" hidden>
    <div class="qcard">
      <div class="sheet" style="display:flex;flex-direction:column;gap:16px">
        <span class="label">本次成績</span>
        <div class="score"><span class="big" id="rScore"></span><span id="rDetail"></span></div>
        <div class="actions">
          <button class="btn" id="retryWrongBtn">重練這次答錯的題</button>
          <button class="btn ghost" id="againBtn">同樣設定再考一次</button>
          <button class="btn ghost" id="homeBtn">回到首頁</button>
        </div>
      </div>
      <div id="rWrongWrap">
        <h2 style="margin-bottom:8px" id="rWrongTitle"></h2>
        <div class="wrong-list" id="rWrong"></div>
      </div>
    </div>
  </section>
</div>

<script>
const BANK = [{"id": "q000", "ch": "ch1", "topic": "創新與時代趨勢", "q": "根據 Steve Blank 對中國大陸與美國矽谷創新生態的觀察，下列哪一項是中國大陸「完全不具備」的？", "o": ["創業動機", "基礎建設", "創新創業管理工具", "創業人才"], "a": 2, "e": "Steve Blank 認為中國大陸在「管理工具」方面完全不具備，也就是缺乏創新創業管理工具。", "src": "ch1"}, {"id": "q001", "ch": "ch1", "topic": "創新與時代趨勢", "q": "根據 Steve Blank 對中國大陸與美國矽谷創新生態的觀察，中國大陸在哪一方面與美國一樣？", "o": ["管理工具", "文化", "動機", "原創力"], "a": 2, "e": "動機方面中國大陸和美國一樣（基礎建設也一樣完備）；文化方面稍缺冒險精神與原創力；管理工具則完全不具備。", "src": "ch1"}, {"id": "q002", "ch": "ch1", "topic": "創新與時代趨勢", "q": "下列何者正確描述 LLP 模式？", "o": ["商業模式＋客戶開發＋敏捷開發", "商業模式＋品質管理＋瀑布開發", "市場分析＋財務管理＋人力資源", "客戶開發＋風險管理＋成本管理"], "a": 0, "e": "LLP 是 Lean LaunchPad：商業模式＋客戶開發＋敏捷開發。", "src": "ch1"}, {"id": "q003", "ch": "ch1", "topic": "創新與時代趨勢", "q": "在創新經濟時代，傳統專案管理應如何因應？", "o": ["完全被敏捷取代", "適度結合敏捷實務", "完全排除敏捷方法", "只增加文件與流程"], "a": 1, "e": "簡報指出：在創新經濟時代，傳統專案管理也可以適度結合敏捷實務，讓專案更順利、更成功。", "src": "ch1"}, {"id": "q004", "ch": "ch1", "topic": "創新與時代趨勢", "q": "Standish Group 1995 年的調查指出，許多專案無法如期完成與失敗的兩個主要原因為何？", "o": ["預算不足與技術落後", "需求不完整與缺乏使用者參與", "員工不足與設備不足", "管理者經驗不足與市場競爭"], "a": 1, "e": "Standish Group 1995 年報告：專案無法如期完成與失敗的兩大主因是「需求不完整」和缺乏「使用者參與」。", "src": "ch1"}, {"id": "q005", "ch": "ch1", "topic": "創新與時代趨勢", "q": "下列何者「不是」Ken Schwaber 所提出的軟體開發常見問題？", "o": ["無法準時交付", "開發期間很難做更改", "品質持續惡化", "客戶參與程度過高"], "a": 3, "e": "Ken Schwaber 列的問題包括發布時間越來越長、無法準時交付、開發期間很難更改、品質持續惡化、死亡行軍等。客戶參與過高不在其中，傳統問題反而是參與不足。", "src": "ch1"}, {"id": "q006", "ch": "ch1", "topic": "創新與時代趨勢", "q": "傳統工作時代的專案管理模式較屬於哪一種流程？", "o": ["明確固定型流程", "完全隨機流程", "自我組織流程", "客戶驅動流程"], "a": 0, "e": "傳統工作時代的專案管理模式是「明確固定型流程」，並不適用於軟體開發。", "src": "ch1"}, {"id": "q007", "ch": "ch1", "topic": "創新與時代趨勢", "q": "根據簡報，傳統固定型專案管理模式較不適合下列哪種工作？", "o": ["工作內容穩定的工作", "大量重複性生產", "充滿變動的軟體與新產品研發", "流程高度標準化的工作"], "a": 2, "e": "明確固定型流程對充滿變動的軟體和新產品研發而言，是浪費時間且達不到預期成果的。", "src": "ch1"}, {"id": "q008", "ch": "ch1", "topic": "創新與時代趨勢", "q": "工業時代與知識經濟時代相比，工業時代較強調：", "o": ["根據需求改變", "依計畫行事", "持續創新", "給予授權"], "a": 1, "e": "工業時代強調依計畫行事；知識經濟時代強調根據需求改變。", "src": "ch1"}, {"id": "q009", "ch": "ch1", "topic": "創新與時代趨勢", "q": "知識經濟時代的工作特點為何？", "o": ["工作內容穩定", "決策點較少", "工作內容常變", "強調命令與控制"], "a": 2, "e": "知識經濟時代工作內容常變，工業時代則是工作內容穩定。", "src": "ch1"}, {"id": "q010", "ch": "ch1", "topic": "創新與時代趨勢", "q": "在知識經濟時代，相較於「強調正確的答案」，更重視什麼？", "o": ["問正確的問題", "減少所有問題", "遵循主管指示", "建立標準答案"], "a": 0, "e": "工業時代強調正確的答案；知識經濟時代重視問正確的問題。", "src": "ch1"}, {"id": "q011", "ch": "ch1", "topic": "創新與時代趨勢", "q": "工業時代較強調「命令與控制」，知識經濟時代則強調什麼？", "o": ["集權", "監督", "給予授權", "嚴格管制"], "a": 2, "e": "工業時代強調命令與控制；知識經濟時代強調給予授權。", "src": "ch1"}, {"id": "q012", "ch": "ch1", "topic": "創新與時代趨勢", "q": "下列何者最符合知識經濟時代的工作特點？", "o": ["專注於數量", "嚴謹的標準", "將員工工作成本最小化", "將員工視為財產而不是成本"], "a": 3, "e": "知識經濟時代將員工視為財產（資產）而不是成本；專注數量、嚴謹標準、員工成本最小化都是工業時代的特點。", "src": "ch1"}, {"id": "q013", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷宣言於哪一年被提出？", "o": ["1995 年", "1999 年", "2001 年", "2012 年"], "a": 2, "e": "敏捷宣言於 2001 年 2 月 11–13 日提出。", "src": "ch1"}, {"id": "q014", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "2001 年，17 位軟體實務大師聚集在哪裡討論輕量級軟體開發模式？", "o": ["美國矽谷", "美國猶他州雪鳥", "紐約哥倫比亞大學", "麻省理工學院"], "a": 1, "e": "17 位大師聚集在美國猶他州的雪鳥（Snowbird, Utah）。", "src": "ch1"}, {"id": "q015", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷軟體開發模式希望取代的主要是什麼？", "o": ["以文件為導向的重量級軟體開發模式", "客戶參與的開發模式", "團隊合作的開發模式", "產品導向的開發模式"], "a": 0, "e": "敏捷要以輕量級軟體開發模式，取代重量級、以文件為導向的開發模式。", "src": "ch1"}, {"id": "q016", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "根據敏捷的觀點，最終決定產品的應該是誰？", "o": ["製造團隊", "設計團隊", "客戶", "專案經理"], "a": 2, "e": "做出產品後就上市，再根據客戶回饋修改；決定產品的不是製造團隊或設計團隊，而是客戶。", "src": "ch1"}, {"id": "q017", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列何者符合敏捷宣言的價值觀？", "o": ["流程與工具勝於個人與互動", "個人與互動勝於流程與工具", "合約談判勝於客戶協作", "遵循計畫勝於回應變更"], "a": 1, "e": "四大價值觀：個人與互動＞流程與工具、可用的軟體＞複雜的文件、與客戶協作＞合約談判、回應變更＞遵循計畫。", "src": "ch1"}, {"id": "q018", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷宣言認為，下列何者勝於「複雜的文件」？", "o": ["詳細的合約", "完整的計畫", "可用的軟體", "嚴格的流程"], "a": 2, "e": "可用的軟體勝於複雜的文件。", "src": "ch1"}, {"id": "q019", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷宣言認為「與客戶協作」勝於：", "o": ["合約談判", "團隊溝通", "回應變更", "軟體測試"], "a": 0, "e": "與客戶協作勝於合約談判。", "src": "ch1"}, {"id": "q020", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "「回應變更勝於＿＿＿＿」是敏捷宣言四大價值觀之一，空格應填入什麼？", "o": ["與客戶協作", "遵循計畫", "個人與互動", "可用的軟體"], "a": 1, "e": "回應變更勝於遵循計畫。", "src": "ch1"}, {"id": "q021", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則的第一優先任務是什麼？", "o": ["降低人事成本", "完成所有文件", "儘早且持續交付有價值的成果以滿足客戶", "完全避免需求變更"], "a": 2, "e": "敏捷原則第 1 條：第一優先是儘早且持續交付有價值的軟體（成果）來滿足客戶。", "src": "ch1"}, {"id": "q022", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "當客戶在開發後期提出需求變更時，依敏捷原則應如何處理？", "o": ["一律拒絕", "歡迎改變需求", "延到下一個專案", "要求客戶重新簽約後才能討論"], "a": 1, "e": "敏捷原則第 2 條：竭誠歡迎改變需求，即使在最後開發階段也是如此。", "src": "ch1"}, {"id": "q023", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則認為，交付可用成果的時間間隔應如何安排？", "o": ["越長越好", "一律每年一次", "以較短的時間間隔為佳", "專案結束才交付"], "a": 2, "e": "敏捷原則第 3 條：經常交付可用的軟體，頻率從數週到數月，以較短的時間間隔為佳。", "src": "ch1"}, {"id": "q024", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則認為，業務人員與開發者在專案進行中應：", "o": ["每天一起工作", "每月開會一次", "各自獨立工作", "只透過專案經理聯絡"], "a": 0, "e": "敏捷原則第 4 條：業務人員與開發者在專案進行中必須每天一起工作。", "src": "ch1"}, {"id": "q025", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則認為，團隊成員之間傳遞訊息最有效率與效能的方式是什麼？", "o": ["正式公文", "電子郵件", "面對面溝通", "詳細的工作報告"], "a": 2, "e": "敏捷原則第 6 條：面對面的溝通是傳遞訊息最有效率與效能的方式。", "src": "ch1"}, {"id": "q026", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則將什麼視為進度的主要測量標準？", "o": ["已完成的文件頁數", "已召開的會議次數", "可用的產品、服務或成果", "團隊工作時數"], "a": 2, "e": "敏捷原則第 7 條：可用的軟體（產品、服務或成果）是進度的主要測量標準。", "src": "ch1"}, {"id": "q027", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "「盡最大的可能排除不需要的工作」最符合敏捷原則中的哪一項？", "o": ["精簡", "控制", "標準化", "文件化"], "a": 0, "e": "敏捷原則第 10 條：精簡，精髓是要盡最大的可能排除不需要的工作。", "src": "ch1"}, {"id": "q028", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷原則認為，最佳的架構、需求及設計來自：", "o": ["高階主管", "外部顧問", "自我組織的團隊", "專案管理辦公室"], "a": 2, "e": "敏捷原則第 11 條：最佳的架構、需求及設計皆來自於能自我組織的團隊。", "src": "ch1"}, {"id": "q029", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "某敏捷團隊每隔一段時間便檢討「怎樣工作可以更有效率」，並據以調整工作方式。這最符合哪一項敏捷原則？", "o": ["團隊定期自省並調整與修正行為", "遵循原始計畫", "加強合約談判", "增加專案文件"], "a": 0, "e": "敏捷原則第 12 條：團隊定期自省如何更有效率，並據以調整與修正行為。", "src": "ch1"}, {"id": "q030", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列何者「不是」簡報所列採用敏捷可達成的五項主要商業目標？", "o": ["可持續創新", "產品有彈性", "加速上市時間", "完全消除市場風險"], "a": 3, "e": "Jim Highsmith 列的五項：可持續創新、產品有彈性、加速上市時間、人員與流程有彈性、產出可靠的成果。沒有「完全消除市場風險」。", "src": "ch1"}, {"id": "q031", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷為何可能增加投資報酬率（ROI）？", "o": ["延後產品上市", "根據市場價值開發小批迭代產品，儘快上市與快速回收", "增加產品文件", "減少與客戶接觸"], "a": 1, "e": "加速上市時間：根據市場價值開發小批迭代產品，可儘快上市與快速回收，增加 ROI。", "src": "ch1"}, {"id": "q032", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "組織專案管理（OPM）的主要目的為何？", "o": ["讓每個專案完全獨立於組織策略", "透過專案相關管理實務達成組織策略", "只負責軟體開發", "只管理日常營運"], "a": 1, "e": "OPM 是基於組織策略的執行框架，藉由專案組合、專案集、專案及組織驅動實務來達成組織策略。", "src": "ch1"}, {"id": "q033", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "OPM3 中的「SMCI」四個成熟度測評等級，正確順序為何？", "o": ["Standardize → Measure → Control → Improve", "Structure → Manage → Control → Innovate", "Standardize → Manage → Create → Improve", "Strategy → Measure → Control → Integrate"], "a": 0, "e": "SMCI＝標準化（Standardize）→ 可衡量（Measure）→ 可控制（Control）→ 持續改進（Improve）。", "src": "ch1"}, {"id": "q034", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "下列關於「專案組合（Portfolio）」與「專案集（Program）」的敘述，何者正確？", "o": ["Portfolio 只能包含單一專案", "Program 是一群彼此完全無關的專案", "Portfolio 可包含專案、專案集、子專案組合及日常營運工作", "Program 與組織策略完全無關"], "a": 2, "e": "專案組合包含專案、專案集、子專案組合和日常營運工作；專案集是一群「相關」的專案；兩者都要符合組織策略。", "src": "ch1"}, {"id": "q035", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列哪一項不是「敏捷原則」（Agile Principle）？", "o": ["專案靠積極的個人來完成，給予他們所需的環境與支援，並相信他們可以完成工作。", "經常交付可用的成果，頻率可從數週到數個月，以較長的時間間隔為佳。", "敏捷流程提倡穩定持續的開發，發起人、開發者及用戶都應該能不斷地維持穩定的步調。", "精簡 — 精髓是要盡最大的可能，排除不需要做的工作。"], "a": 1, "e": "敏捷原則第 3 條是「以較短的時間間隔為佳」，B 寫成較長，所以不是敏捷原則。", "src": "ch1"}, {"id": "q036", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列對敏捷原則中「精簡（Simplicity）」的敘述，哪一項正確？", "o": ["是要盡最大的可能，排除不需要做的工作。", "是要盡最小的可能，排除不需要做的工作。", "是要盡最大的可能，排除需要做的工作。", "是要盡最小的可能，排除需要做的工作。"], "a": 0, "e": "敏捷原則第 10 條：精簡是要盡最大的可能，排除不需要做的工作。", "src": "ch1"}, {"id": "q037", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列哪一項不是「敏捷原則」（Agile Principle）？", "o": ["可用的軟體是進度的主要量測標準", "持續專注於追求卓越的技術與優良的設計以強化敏捷力", "最佳的架構、需求及設計皆來自於能有效監控的團隊", "團隊定期自省應如何更有效率，並據以適當地調整與修正行為"], "a": 2, "e": "敏捷原則第 11 條是「能自我組織的團隊」，不是「能有效監控的團隊」。", "src": "ch1"}, {"id": "q038", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "根據「敏捷原則」（Agile Principle），下列哪一項是進度的主要量測標準？", "o": ["大量的文件", "可用的軟體", "好的架構", "充分授權的工作環境"], "a": 1, "e": "敏捷原則第 7 條：可用的軟體是進度的主要量測標準。", "src": "ch1"}, {"id": "q039", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "根據「敏捷原則」（Agile Principle），最佳的架構、需求及設計皆來自於下列哪一項？", "o": ["產品負責人(ProductOwner)", "敏捷教練 (Coach)", "能自我組織的團隊", "專案經理"], "a": 2, "e": "敏捷原則第 11 條：最佳的架構、需求及設計皆來自於能自我組織的團隊。", "src": "ch1"}, {"id": "q040", "ch": "ch2", "topic": "傳統開發模式", "q": "根據資訊系統開發模式演進圖，下列哪一個模式最早提出？", "o": ["漸進模式", "雛型模式", "瀑布模式", "螺旋模式"], "a": 2, "e": "瀑布模式（Royce, 1970）最早；漸進、雛型是 1977，螺旋是 1988，RUP 是 1999。", "src": "ch12a"}, {"id": "q041", "ch": "ch2", "topic": "傳統開發模式", "q": "若開發團隊將雛型系統視為最終產品，最可能造成什麼結果？", "o": ["客戶滿意度提高", "需求更完整", "文件更齊全", "犧牲產品品質"], "a": 3, "e": "雛型模式的缺點：開發團隊會將雛型系統視為最終產品，犧牲產品品質。", "src": "ch12a"}, {"id": "q042", "ch": "ch2", "topic": "傳統開發模式", "q": "RUP 模式以什麼作為系統開發的首要工作，以便更精確地了解使用者需求？", "o": ["企業塑模", "程式撰寫", "部署", "測試"], "a": 0, "e": "RUP 以「企業塑模」為系統開發首要工作，讓開發者更精確地了解使用者需求。", "src": "ch12a"}, {"id": "q043", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者符合瀑布模式的特性？", "o": ["各階段可以同時並行進行", "專案資源配置以客戶需求變動為基礎", "各階段工作人員須完成正確、完整、易讀的文件，移交給下一階段的工作人員", "客戶全程密集參與開發過程"], "a": 2, "e": "瀑布模式特性：各階段要完成正確、完整、易讀的文件移交下一階段。A、B、D 都與瀑布相反。", "src": "ch12a"}, {"id": "q044", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 的基本價值觀？", "o": ["公開", "專注", "承諾", "檢視"], "a": 3, "e": "Scrum 五個價值觀：公開、勇氣、尊重、專注、承諾。「檢視」是三大支柱之一。", "src": "ch12a"}, {"id": "q045", "ch": "ch2", "topic": "Scrum", "q": "Scrum 是由誰在何時共同提出的？", "o": ["Kent Beck 於 1999 年", "Alistair Cockburn 於 2001 年", "Jeff De Luca 於 1997 年", "Ken Schwaber 與 Jeff Sutherland 於 1995 年"], "a": 3, "e": "Scrum 由 Ken Schwaber 與 Jeff Sutherland 於 1995 年在 OOPSLA 研討會共同提出。", "src": "ch12a"}, {"id": "q046", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者「不是」瀑布模式的缺點？", "o": ["專案開始時必須完整且清楚地描述所有需求", "客戶要到專案末期才能看到產品", "各階段的改變或錯誤須回溯到前一階段，並經冗長的審查簽核", "各階段的產出都須經過確認、驗證及測試，藉此發現品質缺失並加以改善"], "a": 3, "e": "D 是瀑布模式的「特性」（產出要經確認、驗證及測試），不是缺點。", "src": "ch12a"}, {"id": "q047", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者是 RUP 模式的缺點？", "o": ["缺乏視覺化模型", "無法迭代", "模式過於繁雜，企業學習與導入困難，且支援工具受限於 IBM Rational 軟體", "不重視需求分析"], "a": 2, "e": "RUP 缺點：模式過於繁雜、學習導入困難，支援工具受限於 IBM Rational 軟體。", "src": "ch12a"}, {"id": "q048", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 的儀式？", "o": ["燃盡圖", "衝刺規劃", "衝刺審查", "衝刺回顧"], "a": 0, "e": "燃盡圖是 Scrum 的「產出」，不是儀式。四儀式：衝刺規劃、每日立會、衝刺審查、衝刺回顧。", "src": "ch12a"}, {"id": "q049", "ch": "ch2", "topic": "傳統開發模式", "q": "瀑布模式的標準開發流程順序為何？", "o": ["設計→需求→開發→測試→部署", "需求→設計→開發→測試→部署", "需求→開發→設計→部署→測試", "需求→設計→測試→開發→部署"], "a": 1, "e": "瀑布流程：需求 → 設計 → 開發 → 測試 → 部署。", "src": "ch12a"}, {"id": "q050", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者是漸進模式的缺點？", "o": ["無法分階段編列預算", "需要對每個漸進階段做清楚完整的定義，可能使系統開發期程變長", "風險管理成本過高", "完全沒有文件可供維護"], "a": 1, "e": "漸進模式缺點：每個階段都要清楚完整定義（期程變長）、階層僵化不易關聯、總成本通常大於瀑布。", "src": "ch12a"}, {"id": "q051", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式屬於客戶導向的分析與設計，但可能遇到什麼問題？", "o": ["客戶參與度過低", "開發團隊不願意修改系統", "大部分時間客戶並不清楚他們真正的需求是什麼", "專案一開始就能精確估算完成時間"], "a": 2, "e": "雛型模式屬客戶導向，但大部分時間客戶並不清楚自己真正的需求是什麼。", "src": "ch12a"}, {"id": "q052", "ch": "ch2", "topic": "傳統開發模式", "q": "螺旋模式是由哪位學者於哪一年提出？", "o": ["Royce，1970", "Bally et al.，1977", "Barry，1988", "Booch，1999"], "a": 2, "e": "螺旋模式由 Barry 於 1988 年提出。", "src": "ch12a"}, {"id": "q053", "ch": "ch2", "topic": "傳統開發模式", "q": "瀑布模式的風險與失敗成本偏高，主要原因為何？", "o": ["專案較後階段才開始進行開發", "專案初期過度簡化需求", "客戶參與過多", "各階段不需要審查簽核"], "a": 0, "e": "瀑布模式在專案較後階段才開始開發，所以風險與失敗成本都高。", "src": "ch12a"}, {"id": "q054", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 的產出？", "o": ["產品待辦清單", "甘特圖", "燃盡圖", "衝刺待辦清單"], "a": 1, "e": "Scrum 四個產出：產品待辦清單、衝刺待辦清單、可交付的增量成果、燃盡圖。甘特圖不是。", "src": "ch12a"}, {"id": "q055", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式強調的重點是什麼？", "o": ["風險分析與風險管理", "完整的分析設計文件", "以企業塑模為首要工作", "雛型的快速開發及使用者高度參與"], "a": 3, "e": "雛型模式強調雛型的快速開發及使用者高度參與。風險分析是螺旋，企業塑模是 RUP。", "src": "ch12a"}, {"id": "q056", "ch": "ch2", "topic": "傳統開發模式", "q": "螺旋模式藉由哪一項作法，大幅降低軟體失敗造成損失的可能性？", "o": ["風險分析", "完整文件", "嚴格簽核", "一次性完整需求"], "a": 0, "e": "螺旋模式藉由風險分析，大幅降低軟體失敗造成損失的可能性。", "src": "ch12a"}, {"id": "q057", "ch": "ch2", "topic": "傳統開發模式", "q": "漸進模式的第一個漸進階段（漸進一）建置的是什麼？", "o": ["核心功能", "功能一", "所有功能的雛型", "部署與教育訓練"], "a": 0, "e": "漸進一建置核心功能，之後依序加入功能一、功能二、功能三。", "src": "ch12a"}, {"id": "q058", "ch": "ch2", "topic": "其他敏捷方法論", "q": "由 Kent Beck 創建，專注於敏捷開發實務，強調效率、聚焦於客戶、回饋及品質的是哪一種方法論？", "o": ["Scrum", "精益（Lean）", "看板（Kanban）", "終極編程（XP）"], "a": 3, "e": "終極編程（XP）由 Kent Beck 創建，專注於敏捷開發實務，強調效率、聚焦於客戶、回饋及品質。", "src": "ch12a"}, {"id": "q059", "ch": "ch2", "topic": "傳統開發模式", "q": "為什麼螺旋模式「不利於已簽署合約的客戶與開發者之間的協調」？", "o": ["因為文件過於繁雜", "因為工具受限於特定廠商", "因為開發流程過於靈活", "因為客戶完全不參與"], "a": 2, "e": "螺旋模式的開發流程過於靈活，不利於已簽約的客戶與開發者之間的協調。", "src": "ch12a"}, {"id": "q060", "ch": "ch2", "topic": "其他敏捷方法論", "q": "下列敏捷方法論與創建者的配對，何者正確？", "o": ["看板（Kanban）— David J. Anderson", "Scrum — Kent Beck", "功能驅動開發（FDD）— Alistair Cockburn", "水晶家族（Crystal） — Jeff De Luca"], "a": 0, "e": "Kanban—David J. Anderson 正確。Scrum 是 Sutherland & Schwaber，FDD 是 Jeff De Luca，Crystal 是 Alistair Cockburn。", "src": "ch12a"}, {"id": "q061", "ch": "ch2", "topic": "傳統開發模式", "q": "RUP 模式的四個階段為何？", "o": ["需求、設計、開發、測試", "初始、詳述、建構、轉移", "構想、推測、探索、調整", "決定目標、風險分析、開發、規劃"], "a": 1, "e": "RUP 四階段：初始、詳述、建構、轉移。C 是 APM 的階段，D 是螺旋模式的步驟。", "src": "ch12a"}, {"id": "q062", "ch": "ch2", "topic": "Scrum", "q": "在 Scrum 流程中，一個衝刺（Sprint）與每日立會的週期分別約為多久？", "o": ["衝刺約 2–4 週，每日立會每 24 小時一次", "衝刺約 6 個月，每日立會每週一次", "衝刺約 1 天，每日立會每月一次", "衝刺約 3 個月，每日立會每 24 小時一次"], "a": 0, "e": "一個衝刺約 2–4 週，每日立會每 24 小時一次（15 分鐘）。", "src": "ch12a"}, {"id": "q063", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 團隊的組成角色？", "o": ["產品負責人（PO）", "開發團隊", "專案經理", "Scrum 大師"], "a": 2, "e": "Scrum 團隊只有產品負責人、Scrum 大師、開發團隊，沒有專案經理。", "src": "ch12a"}, {"id": "q064", "ch": "ch2", "topic": "傳統開發模式", "q": "若組織希望員工能充分熟悉與接受新系統，並有充分時間學習與進行技術移轉，較適合採用哪一種模式？", "o": ["瀑布模式", "雛型模式", "螺旋模式", "漸進模式"], "a": 3, "e": "漸進模式分階段建置，讓組織成員有充分時間學習與進行技術移轉。", "src": "ch12a"}, {"id": "q065", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理的知識中，軟技術方面的要求，不包含下列何者？", "o": ["決策的分析與下達", "人力資源的運用及專案領導的藝術", "對人際關係的互動", "時程規劃"], "a": 3, "e": "時程規劃屬硬技術。軟技術是與人相關的技術，如人際互動、溝通、決策、專案領導。", "src": "ch12a"}, {"id": "q066", "ch": "ch1", "topic": "專案管理基礎", "q": "專案章程於專案管理過程中何時撰寫 ？", "o": ["起始過程組", "規劃過程組", "結束過程組", "監視與管制過程組"], "a": 0, "e": "專案章程在起始過程組撰寫，用來正式授權專案。", "src": "ch12a"}, {"id": "q067", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者屬於專案管理知識結構中「軟技術」之部分？", "o": ["專案領導的藝術", "時程規劃", "品質確保", "成本分析"], "a": 0, "e": "專案領導的藝術屬軟技術；時程規劃、品質確保、成本分析都屬硬技術。", "src": "ch12a"}, {"id": "q068", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "下列何者屬專案管理辦公室類型？", "o": ["支援型", "管制型", "指示型", "以上皆是"], "a": 3, "e": "PMO 三種類型：支援型（管制低）、管制型（管制中）、指示型（管制高）。", "src": "ch12a"}, {"id": "q069", "ch": "ch1", "topic": "專案管理基礎", "q": "「定義活動」屬於哪一專案管理知識領域？", "o": ["專案資源管理", "專案範疇管理", "專案採購管理", "專案時程管理"], "a": 3, "e": "定義活動屬於專案時程管理。", "src": "ch12a"}, {"id": "q070", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "根據「敏捷原則」（Agile Principle），下列哪一項是衡量進度的主要標準？", "o": ["大量的文件", "可用的軟體 ( 成果 )", "好的架構", "充分授權的工作環境"], "a": 1, "e": "敏捷原則第 7 條：可用的軟體（成果）是進度的主要測量標準。", "src": "ch12a"}, {"id": "q071", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理學會組織（PMI）何時成立？", "o": ["1958", "1968", "1969", "1978"], "a": 2, "e": "PMI（專案管理學會）成立於 1969 年。", "src": "ch12a"}, {"id": "q072", "ch": "ch1", "topic": "專案管理基礎", "q": "「獲得資源」屬於哪一專案管理知識領域？", "o": ["專案資源管理", "專案範疇管理", "專案整合管理", "專案溝通管理"], "a": 0, "e": "獲得資源屬於專案資源管理。", "src": "ch12a"}, {"id": "q073", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "敏捷專案管理緊盯的是？", "o": ["計畫", "願景", "需求", "成本"], "a": 1, "e": "敏捷專案管理緊盯願景，而不是緊盯計畫。", "src": "ch12a"}, {"id": "q074", "ch": "ch1", "topic": "專案管理基礎", "q": "「建立工作分解結構（WBS）」屬於哪一專案管理知識領域？", "o": ["專案資源管理", "專案範疇管理", "專案採購管理", "專案溝通管理"], "a": 1, "e": "建立工作分解結構（WBS）屬於專案範疇管理。", "src": "ch12a"}, {"id": "q075", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何種活動可以歸屬於專案？", "o": ["公司上市計畫", "建置資訊系統", "建設工程", "以上皆是"], "a": 3, "e": "公司上市計畫、建置資訊系統、建設工程都是為了創造獨特成果的暫時性努力，都可以是專案。", "src": "ch12a"}, {"id": "q076", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列哪一項不是「敏捷宣言」（Agile Manifesto）的價值觀？", "o": ["流程與工具勝於個人與互動", "可用的軟體勝於複雜的文件", "與客戶協同合作勝於合約談判", "回應變更勝於遵循計畫"], "a": 0, "e": "正確的價值觀是「個人與互動勝於流程與工具」，A 把順序顛倒了。", "src": "ch12a"}, {"id": "q077", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "哪一種專案管理辦公室（PMO）對於專案管控採直接管理方式，專案經理由 PMO 指派並直接對 PMO 報告？", "o": ["支援型", "管制型", "指示型", "配合型"], "a": 2, "e": "指示型 PMO：直接管理專案，專案經理由 PMO 指派並直接對 PMO 報告，管制程度高。", "src": "ch12a"}, {"id": "q078", "ch": "ch1", "topic": "專案管理基礎", "q": "專案是指：為了創造出獨特的產品、服務或成果所做的何種努力？", "o": ["長期性", "暫時性", "短期性", "中程性"], "a": 1, "e": "專案是為了創造出獨一無二的產品、服務或成果所做「暫時性」的努力。", "src": "ch12a"}, {"id": "q079", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者不是「專案」(Project)？", "o": ["研發新手機", "開發校務資訊系統", "舉辦畢業典禮", "經營早餐店"], "a": 3, "e": "經營早餐店是持續、重複的日常營運，不是專案。", "src": "ch12a"}, {"id": "q080", "ch": "ch1", "topic": "組織專案管理與 PMO", "q": "哪一種專案管理辦公室（PMO）除了提供諮詢之外，還要求專案遵循相關規定？", "o": ["支援型", "管制型", "指示型", "配合型"], "a": 1, "e": "管制型 PMO：除了提供諮詢，還要求專案遵循相關規定，管制程度中等。", "src": "ch12a"}, {"id": "q081", "ch": "ch1", "topic": "專案管理基礎", "q": "依 PMBOK 第六版，專案管理共有幾個專案管理過程？", "o": ["42", "49", "47", "39"], "a": 1, "e": "PMBOK 第六版共 49 個專案管理過程，分布在 5 大過程組、10 大知識領域。", "src": "ch12a"}, {"id": "q082", "ch": "ch1", "topic": "專案管理基礎", "q": "「估算活動資源」屬於哪一專案管理知識領域？", "o": ["專案資源管理", "專案範疇管理", "專案採購管理", "專案時間管理"], "a": 0, "e": "估算活動資源屬於專案資源管理（第六版）。", "src": "ch12a"}, {"id": "q083", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者屬於專案管理知識結構中 「軟技術」之部分？", "o": ["成本分析", "品質確保", "風險控管", "決策的分析與下達"], "a": 3, "e": "決策的分析與下達屬軟技術；成本分析、品質確保、風險控管屬硬技術。", "src": "ch12a"}, {"id": "q084", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理指的是：將下列哪些應用於專案活動上，以滿足專案需求？", "o": ["知識", "技能", "工具及技術", "以上皆是"], "a": 3, "e": "專案管理是將知識、技能、工具及技術應用於專案活動上，以滿足專案需求。", "src": "ch12a"}, {"id": "q085", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者不是專案與日常營運工作的共同性？", "o": ["都是靠人來完成", "都受到有限資源的限制", "達成組織特殊的目標", "都必須經過規劃、執行和監視與管制的過程"], "a": 2, "e": "專案與日常營運都靠人完成、受有限資源限制、須經規劃執行與監管；「達成組織特殊目標」是專案才有的。", "src": "ch12a"}, {"id": "q086", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者不是「專案」(Project)的特性？", "o": ["帶來商業價值", "任務的獨特性", "時間的明確性", "資源的可用性"], "a": 3, "e": "專案基本特性：任務獨特、時間明確、有衡量完成的方法、帶來改變、帶來商業價值。資源的可用性不是。", "src": "ch12a"}, {"id": "q087", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理有幾大過程組？", "o": ["3", "4", "5", "6"], "a": 2, "e": "五大過程組：起始、規劃、執行、監視與管制、結束。", "src": "ch12a"}, {"id": "q088", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者屬於專案管理知識結構中「軟技術」之部分？", "o": ["人際關係的互動", "溝通、協調", "談判能力的發揮", "以上皆是"], "a": 3, "e": "人際關係的互動、溝通協調、談判能力都是與人相關的軟技術。", "src": "ch12a"}, {"id": "q089", "ch": "ch2", "topic": "傳統開發模式", "q": "螺旋模式每個循環的四個步驟，順序為何？", "o": ["開發與測試→決定目標→識別與解決風險→規劃下個循環", "決定目標 → 識別與解決風險 → 開發與測試 → 規劃下個循環", "規劃下個循環 → 決定目標 → 開發與測試 → 識別與解決風險", "識別與解決風險 → 決定目標 → 規劃下個循環 → 開發與測試"], "a": 1, "e": "螺旋模式四步驟：決定目標 → 識別與解決風險 → 開發與測試 → 規劃下個循環。", "src": "ch12b"}, {"id": "q090", "ch": "ch2", "topic": "Scrum", "q": "下列何者「不是」Scrum 的三大屬性？", "o": ["輕量的", "文件嚴謹", "簡單易懂", "難以精通"], "a": 1, "e": "Scrum 三大屬性：輕量的（文件夠用就好）、簡單易懂、難以精通。", "src": "ch12b"}, {"id": "q091", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式是由哪位學者於哪一年提出？", "o": ["Bally et al.，1977", "Bally et al.，1972", "Barry，1988", "Royce，1970"], "a": 0, "e": "雛型模式由 Bally et al. 於 1977 年提出（漸進模式也是）。", "src": "ch12b"}, {"id": "q092", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者是漸進模式的優點？", "o": ["總開發成本一定低於瀑布模式", "預算編列、付款、系統測試及教育訓練可分階段進行，降低財務風險與專案失敗風險", "不需要對每個漸進階段做完整定義", "各漸進階段之間高度關聯、容易整合"], "a": 1, "e": "漸進模式優點：預算、付款、測試、教育訓練都可分階段進行，降低財務與專案失敗風險。", "src": "ch12b"}, {"id": "q093", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式強調以「雛型演進」代替完整的分析與設計，可能造成什麼問題？", "o": ["開發成本大幅降低", "系統文件較不完備，後續程式維護相對困難", "客戶無法參與需求溝通", "無法快速滿足使用者需求"], "a": 1, "e": "以雛型演進代替完整分析設計，系統文件較不完備，後續程式維護相對困難。", "src": "ch12b"}, {"id": "q094", "ch": "ch2", "topic": "其他敏捷方法論", "q": "哪一種敏捷方法論的重點是「精簡與流程最佳化」，強調減少無法創造客戶價值的工作？", "o": ["DSDM", "FDD", "精益（Lean）", "Crystal"], "a": 2, "e": "精益（Lean）：精簡與流程最佳化，減少無法創造客戶價值的工作。", "src": "ch12b"}, {"id": "q095", "ch": "ch2", "topic": "其他敏捷方法論", "q": "依「敏捷方法和實務的使用率」調查（9th State of Agile），使用率最高的敏捷方法是什麼？", "o": ["Kanban", "Scrum", "XP", "Lean Development"], "a": 1, "e": "第 9 屆 State of Agile 調查中 Scrum 使用率 56%，遠高於其他方法。", "src": "ch12b"}, {"id": "q096", "ch": "ch2", "topic": "Scrum", "q": "下列何者是 Scrum 的三大支柱之一？", "o": ["透明", "承諾", "勇氣", "尊重"], "a": 0, "e": "Scrum 三大支柱：透明、檢視、調適。承諾、勇氣、尊重是五大價值觀。", "src": "ch12b"}, {"id": "q097", "ch": "ch2", "topic": "Scrum", "q": "下列哪一項最符合 Scrum 的定義？", "o": ["一套詳細規定所有文件格式的重量級流程", "以一次完整交付為目標的開發方法", "讓團隊關注於「在最短時間內交付最高商業價值產品」的框架", "專門用於測試階段的管理工具"], "a": 2, "e": "Mike Cohn（2007）：Scrum 是讓我們關注於「在最短時間內交付最高商業價值產品」的框架。", "src": "ch12b"}, {"id": "q098", "ch": "ch2", "topic": "傳統開發模式", "q": "RUP 採用迭代式開發，主要優點為何？", "o": ["完全不需要文件", "不需要專案管理", "可以省略測試", "每次迭代中能及早發現問題，降低開發風險"], "a": 3, "e": "RUP 採迭代式開發，每次迭代中能及早發現問題，降低開發風險。", "src": "ch12b"}, {"id": "q099", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者是螺旋模式的缺點？", "o": ["無法建立雛型", "不重視軟體測試", "客戶無法提供回饋", "過分依賴風險分析的經驗與技術，分析若出現偏差將造成重大損失"], "a": 3, "e": "螺旋模式缺點：過分依賴風險分析的經驗與技術，分析若出現偏差將造成重大損失。", "src": "ch12b"}, {"id": "q100", "ch": "ch2", "topic": "傳統開發模式", "q": "雛型模式較不適用於哪一類專案？", "o": ["大型及多人參與的系統開發專案", "小型專案", "需要快速確認需求的專案", "使用者介面導向的專案"], "a": 0, "e": "雛型模式缺乏整體規劃、分析與設計，較不適用於大型及多人參與的專案。", "src": "ch12b"}, {"id": "q101", "ch": "ch2", "topic": "傳統開發模式", "q": "下列何者「不是」RUP 的九大工作流程之一？", "o": ["企業塑模", "風險分析", "組態管理與變更管理", "環境"], "a": 1, "e": "RUP 九大工作流程：企業塑模、需求、設計、開發、測試、部署、組態管理與變更管理、專案管理、環境。沒有風險分析。", "src": "ch12b"}, {"id": "q102", "ch": "ch2", "topic": "傳統開發模式", "q": "在瀑布模式中，一個階段的結束代表什麼意義？", "o": ["專案正式結束", "必須重新蒐集需求", "客戶必須完成驗收並付款", "專案管理的里程碑，據以決定是否進入下一階段"], "a": 3, "e": "瀑布模式中，一個階段的結束就是專案管理的里程碑，依成果決定是否進入下一階段。", "src": "ch12b"}, {"id": "q103", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者屬於專案管理知識結構中「軟技術」之部分？", "o": ["政治與權力問題的處理", "決策的分析與下達", "人力資源的運用", "以上皆是"], "a": 3, "e": "政治與權力問題的處理、決策的分析與下達、人力資源的運用都是軟技術。", "src": "ch12b"}, {"id": "q104", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者是專案的基本特性？", "o": ["任務是否獨特", "時間是否明確", "是否帶來改變", "以上均是"], "a": 3, "e": "專案基本特性包括任務獨特、時間明確、帶來改變等，全部都是。", "src": "ch12b"}, {"id": "q105", "ch": "ch1", "topic": "專案管理基礎", "q": "專案管理知識結構中，硬技術不包含下列何者？", "o": ["衝突的化解", "成本分析", "時程規劃", "過程設計"], "a": 0, "e": "衝突的化解是軟技術；成本分析、時程規劃、過程設計是硬技術。", "src": "ch12b"}, {"id": "q106", "ch": "ch1", "topic": "專案管理基礎", "q": "下列何者不屬於專案管理知識結構中「硬技術」之部分？", "o": ["成本分析", "品質確保", "風險控管", "決策的分析與下達"], "a": 3, "e": "決策的分析與下達屬軟技術，不屬硬技術。", "src": "ch12b"}, {"id": "q107", "ch": "ch1", "topic": "敏捷思維與宣言", "q": "下列哪一項不是「敏捷原則」（Agile Principle）？", "o": ["專案成功依賴於積極的個人，應給予他們所需的支持與信任。", "定期交付可用的軟體（成果），從數週到數月不等，以較長的交付週期為佳。", "敏捷流程強調穩定且持續的開發，發起人、開發者與用戶都應維持穩定的步調。", "精簡-精髓是要盡最大的可能，排除不需要做的工作。"], "a": 1, "e": "敏捷原則第 3 條是「以較短的時間間隔為佳」，B 寫成較長的交付週期，所以錯。", "src": "ch12b"}, {"id": "q108", "ch": "ch1", "topic": "專案管理基礎", "q": "專案計畫書於專案管理過程中何時撰寫？", "o": ["起始過程組", "規劃過程組", "結束過程組", "監視與管制過程組"], "a": 1, "e": "專案計畫書在規劃過程組撰寫。", "src": "ch12b"}, {"id": "q110", "ch": "ch1", "topic": "專案管理基礎", "q": "下列有關「專案」(Project)的敘述，何者不正確？", "o": ["專案是指為了創造出獨一無二的產品、服務或成果所做暫時性的努力", "專案是靠人來完成，受到有限資源的限制，必須經過規劃、執行和監視與管制的過程", "專案是指特殊而有限的任務，或由一群具相互關聯性的工作共同組合的產品、服務或成果。", "專案是持續性、重複性的工作，是執行重要的日常營運任務。"], "a": 3, "e": "專案是暫時性的努力；D 描述的是持續性、重複性的日常營運。", "src": "ch12b"}, {"id": "d000", "ch": "x2", "topic": "人名與年份", "q": "瀑布模式由誰在哪一年提出？", "o": ["Booch，1999", "Bally et al.，1977", "Royce，1970", "Barry，1988"], "a": 2, "e": "演進圖：瀑布模式是 Royce 於 1970 年提出，是最早的模式。", "src": "drill"}, {"id": "d001", "ch": "x2", "topic": "人名與年份", "q": "漸進模式由誰在哪一年提出？", "o": ["Booch，1983", "Royce，1970", "Aoyama，1996", "Bally et al.，1977"], "a": 3, "e": "漸進模式和雛型模式都是 Bally et al. 於 1977 年提出。", "src": "drill"}, {"id": "d002", "ch": "x2", "topic": "人名與年份", "q": "演進圖中的「物件導向開發模式」由誰在哪一年提出？", "o": ["Booch，1999", "Booch，1983", "Bally et al.，1977", "Barry，1988"], "a": 1, "e": "物件導向開發模式是 Booch 1983；Booch 1999 提出的是 RUP。", "src": "drill"}, {"id": "d003", "ch": "x2", "topic": "人名與年份", "q": "RUP 模式由誰在哪一年提出？", "o": ["Beck，2001", "Aoyama，1996", "Booch，1999", "Barry，1988"], "a": 2, "e": "RUP 是 Booch 於 1999 年提出。", "src": "drill"}, {"id": "d004", "ch": "x2", "topic": "人名與年份", "q": "演進圖中的「同步模式」與「MDA 模式」由誰在哪一年提出？", "o": ["Beck，2001", "Aoyama，1996", "Booch，1983", "Bally et al.，1977"], "a": 1, "e": "同步模式和 MDA 模式都是 Aoyama 於 1996 年提出。", "src": "drill"}, {"id": "d005", "ch": "x2", "topic": "人名與年份", "q": "演進圖中的「敏捷開發模式」標示為誰、哪一年？", "o": ["Booch，1999", "Aoyama，1996", "Beck，2001", "Royce，1970"], "a": 2, "e": "敏捷開發模式標示為 Beck 2001，與敏捷宣言同年。", "src": "drill"}, {"id": "d006", "ch": "x2", "topic": "人名與年份", "q": "螺旋模式由誰在哪一年提出？", "o": ["Booch，1983", "Aoyama，1996", "Bally et al.，1977", "Barry，1988"], "a": 3, "e": "螺旋模式是 Barry 於 1988 年提出。", "src": "drill"}, {"id": "d007", "ch": "x2", "topic": "人名與年份", "q": "哪兩個模式同在 1977 年由 Bally et al. 提出？", "o": ["螺旋模式與 RUP", "漸進模式與雛型模式", "雛型模式與螺旋模式", "瀑布模式與漸進模式"], "a": 1, "e": "漸進模式和雛型模式都是 Bally et al. 1977。", "src": "drill"}, {"id": "d008", "ch": "x2", "topic": "人名與年份", "q": "Booch 在演進圖中提出了哪兩個模式？", "o": ["漸進模式與雛型模式", "同步模式與 MDA 模式", "物件導向開發模式與 RUP", "螺旋模式與 RUP"], "a": 2, "e": "Booch 1983 提出物件導向開發模式，1999 提出 RUP。", "src": "drill"}, {"id": "d009", "ch": "x2", "topic": "人名與年份", "q": "依提出年份由早到晚，下列排序何者正確？", "o": ["瀑布 → 螺旋 → 漸進／雛型 → RUP → 物件導向 → 敏捷", "瀑布 → 物件導向 → 漸進／雛型 → 螺旋 → RUP → 敏捷", "漸進／雛型 → 瀑布 → 螺旋 → RUP → 同步／MDA → 敏捷", "瀑布 → 漸進／雛型 → 物件導向 → 螺旋 → 同步／MDA → RUP → 敏捷"], "a": 3, "e": "年份依序：1970、1977、1983、1988、1996、1999、2001。", "src": "drill"}, {"id": "d010", "ch": "x2", "topic": "人名與年份", "q": "Scrum 是在哪一個研討會上被提出的？", "o": ["PMI 全球大會", "OOPSLA（物件導向編程、系統、語言及應用研討會）", "敏捷聯盟年會", "猶他州雪鳥會議"], "a": 1, "e": "Ken Schwaber 和 Jeff Sutherland 於 1995 年在 OOPSLA 共同提出 Scrum。", "src": "drill"}, {"id": "d011", "ch": "x2", "topic": "人名與年份", "q": "「Scrum 是一個讓我們關注於在最短時間內交付最高商業價值產品的框架」是誰在哪一年的定義？", "o": ["Mike Griffiths，2012", "Ken Schwaber，1995", "Jeff Sutherland，2001", "Mike Cohn，2007"], "a": 3, "e": "這是 Mike Cohn（2007）的定義；另一個定義來自 Scrum 指南。", "src": "drill"}, {"id": "d012", "ch": "x2", "topic": "人名與年份", "q": "終極編程（XP）是由哪些人開發的？", "o": ["Jim Highsmith、Alistair Cockburn", "Mary 與 Tom Poppendieck", "Kent Beck、Ron Jeffries、Ward Cunningham", "Ken Schwaber、Jeff Sutherland"], "a": 2, "e": "XP 由 Kent Beck、Ron Jeffries 和 Ward Cunningham 開發；總表上的創建者寫 Kent Beck。", "src": "drill"}, {"id": "d013", "ch": "x2", "topic": "人名與年份", "q": "XP 是在哪一個專案工作時被提出的？", "o": ["豐田汽車的生產線改善專案", "IBM Rational 工具開發專案", "克萊斯勒綜合報酬系統（C3）的薪水冊專案", "為亞洲客戶開發的軟體專案"], "a": 2, "e": "XP 源自克萊斯勒綜合報酬系統（Chrysler Comprehensive Compensation System, C3）的薪水冊專案。", "src": "drill"}, {"id": "d014", "ch": "x2", "topic": "人名與年份", "q": "精益（Lean）軟體開發的創建者是誰？", "o": ["David J. Anderson", "Kent Beck", "Jeff De Luca", "Mary 與 Tom Poppendieck"], "a": 3, "e": "Lean 的創建者是 Mary 與 Tom Poppendieck。", "src": "drill"}, {"id": "d015", "ch": "x2", "topic": "人名與年份", "q": "看板（Kanban）由誰發現？受到什麼啟發？", "o": ["David J. Anderson，受豐田「及時交付」啟發", "Kent Beck，受克萊斯勒 C3 專案啟發", "Poppendieck 夫婦，受日本百貨業啟發", "Alistair Cockburn，受晶體結構啟發"], "a": 0, "e": "Kanban 由 David J. Anderson 發現，受日本豐田汽車「及時交付」（Just-in-Time Delivery）啟發。", "src": "drill"}, {"id": "d016", "ch": "x2", "topic": "人名與年份", "q": "DSDM 由誰在哪一年提出？", "o": ["DSDM 聯盟，1994", "Ken Schwaber，1995", "Jeff De Luca，1997", "Jim Highsmith，2001"], "a": 0, "e": "DSDM 是 DSDM 聯盟（DSDM Consortium）於 1994 年提出。", "src": "drill"}, {"id": "d017", "ch": "x2", "topic": "人名與年份", "q": "DSDM 聯盟的總部設在哪裡？屬於什麼性質的組織？", "o": ["舊金山，非營利組織", "倫敦，非營利組織", "紐約，營利公司", "東京，政府機構"], "a": 1, "e": "DSDM 聯盟屬非營利組織，總部設於倫敦。", "src": "drill"}, {"id": "d018", "ch": "x2", "topic": "人名與年份", "q": "FDD（功能驅動開發）由誰在哪一年提出？", "o": ["Kent Beck，1999", "Jeff De Luca，1997", "Alistair Cockburn，1997", "DSDM 聯盟，1994"], "a": 1, "e": "FDD 是 Jeff De Luca 於 1997 年提出。", "src": "drill"}, {"id": "d019", "ch": "x2", "topic": "人名與年份", "q": "Jeff De Luca 當初提出 FDD，是為了在哪裡提供客戶軟體？", "o": ["澳洲", "歐洲", "美國矽谷", "亞洲"], "a": 3, "e": "Jeff De Luca 在 1997 年為了在亞洲提供客戶軟體，想出這個迭代且有效率交付軟體的方法。", "src": "drill"}, {"id": "d020", "ch": "x2", "topic": "人名與年份", "q": "水晶家族（Crystal Family）的創建者是誰？", "o": ["Alistair Cockburn", "Mike Griffiths", "Jim Highsmith", "Ward Cunningham"], "a": 0, "e": "Crystal 由 Alistair Cockburn 創建。", "src": "drill"}, {"id": "d021", "ch": "x2", "topic": "人名與年份", "q": "APM 模式（構想、推測、探索、調整、結束）是誰提出的？", "o": ["Mike Griffiths", "Jim Highsmith", "Kent Beck", "Mike Cohn"], "a": 1, "e": "APM 模式結構出自 Jim Highsmith。", "src": "drill"}, {"id": "d022", "ch": "x2", "topic": "人名與年份", "q": "敏捷通用流程（AUP）概觀圖出自誰？", "o": ["Booch", "Jim Highsmith", "Mike Cohn", "Mike Griffiths"], "a": 3, "e": "AUP 出自 Mike Griffiths。注意 APM 是 Jim Highsmith，Mike Cohn 是 Scrum 定義。", "src": "drill"}, {"id": "d023", "ch": "x2", "topic": "人名與年份", "q": "RUP 的支援工具受限於哪一家公司的軟體？", "o": ["Oracle Primavera", "IBM Rational", "Atlassian Jira", "Microsoft Project"], "a": 1, "e": "RUP 的缺點之一：支援工具受限於 IBM Rational 軟體。", "src": "drill"}, {"id": "d024", "ch": "x2", "topic": "方法論對照", "q": "摘要為「敏捷專案管理架構」，強調「組成團隊、安排工作」的是哪一種方法論？", "o": ["DSDM", "Scrum", "XP", "Crystal"], "a": 1, "e": "Scrum：敏捷專案管理架構，強調組成團隊、安排工作。", "src": "drill"}, {"id": "d025", "ch": "x2", "topic": "方法論對照", "q": "摘要為「強調在對的時間交付對的成果」，以結構化方式快速開發、綜整最佳實務的是？", "o": ["Kanban", "FDD", "Lean", "DSDM"], "a": 3, "e": "DSDM：在對的時間交付對的成果，以結構化的方式快速開發、綜整最佳實務。", "src": "drill"}, {"id": "d026", "ch": "x2", "topic": "方法論對照", "q": "摘要為「專注於產品功能的交付」，迭代開發出使用者所要功能的是？", "o": ["FDD", "XP", "DSDM", "Scrum"], "a": 0, "e": "FDD（功能驅動開發）：專注於產品功能的交付。", "src": "drill"}, {"id": "d027", "ch": "x2", "topic": "方法論對照", "q": "摘要為「條列出特定情況的解決方案」，強調人、溝通、產品和組織動態有機融合的是？", "o": ["水晶家族（Crystal）", "DSDM", "Lean", "Scrum"], "a": 0, "e": "Crystal：條列出特定情況的解決方案，強調人、溝通、產品和組織動態有機融合的嚴謹流程。", "src": "drill"}, {"id": "d028", "ch": "x2", "topic": "方法論對照", "q": "摘要為「工作可視化與限制進行中工作」，強調及時開發的是？", "o": ["XP", "精益（Lean）", "FDD", "看板（Kanban）"], "a": 3, "e": "Kanban：工作可視化與限制進行中工作，強調可視化與管理工作流程、及時開發。", "src": "drill"}, {"id": "d029", "ch": "x2", "topic": "方法論對照", "q": "摘要為「專注於敏捷開發實務」，強調效率、聚焦於客戶、回饋及品質的是？", "o": ["Scrum", "XP", "Crystal", "FDD"], "a": 1, "e": "XP：專注於敏捷開發實務。", "src": "drill"}, {"id": "d030", "ch": "x2", "topic": "方法論對照", "q": "哪一種方法論可以視為其他敏捷方法論的上層？", "o": ["DSDM", "Scrum", "XP", "精益（Lean）"], "a": 3, "e": "精益的 7 項原則在精神上已包含看板和其他敏捷方法，可視為其他方法論的上層。", "src": "drill"}, {"id": "d031", "ch": "x2", "topic": "方法論對照", "q": "水晶家族為什麼用「水晶」命名？", "o": ["沒有兩個晶體是一樣的，就像沒有兩個專案一模一樣", "取自創建者的姓氏", "水晶透明，代表流程透明", "水晶堅硬，代表流程嚴謹"], "a": 0, "e": "用「水晶」命名，是因為沒有兩個晶體是一樣的，就好像沒有兩個專案是一模一樣的。", "src": "drill"}, {"id": "d032", "ch": "x2", "topic": "方法論對照", "q": "DSDM 是哪一種開發方式更結構化的版本？", "o": ["螺旋模式", "瀑布模式", "快速應用開發（RAD）", "RUP"], "a": 2, "e": "DSDM 是一種更結構化的「快速應用開發（Rapid Application Development）」。", "src": "drill"}, {"id": "d033", "ch": "x2", "topic": "方法論對照", "q": "精益（Lean）軟體開發源自什麼？", "o": ["克萊斯勒的薪資系統專案", "IBM 的軟體流程", "豐田的生產製造流程", "日本百貨業的廣告牌"], "a": 2, "e": "精益軟體開發源於豐田的生產製造流程，主要概念是以客戶為主。", "src": "drill"}, {"id": "d034", "ch": "x2", "topic": "方法論對照", "q": "「看板」一詞的原意是什麼？", "o": ["工作清單", "流程圖", "招牌或廣告牌", "會議紀錄"], "a": 2, "e": "看板的原意是招牌或廣告牌，豐田和日本百貨業用它顯示待做、進行中、可交付的產品。", "src": "drill"}, {"id": "d035", "ch": "x2", "topic": "方法論對照", "q": "XP 角色對照 Scrum，下列何者正確？", "o": ["教練相當於產品負責人", "客戶相當於開發團隊", "客戶相當於產品負責人", "測試者相當於 Scrum 大師"], "a": 2, "e": "程式設計師＋測試者＝開發團隊；教練＝Scrum 大師；客戶＝產品負責人。", "src": "drill"}, {"id": "d036", "ch": "x2", "topic": "模式與流程", "q": "RUP 的四個階段，順序何者正確？", "o": ["初始 → 詳述 → 建構 → 轉移", "初始 → 建構 → 詳述 → 轉移", "詳述 → 初始 → 建構 → 轉移", "構想 → 推測 → 探索 → 調整"], "a": 0, "e": "RUP 四階段：初始、詳述、建構、轉移。構想、推測、探索、調整是 APM。", "src": "drill"}, {"id": "d037", "ch": "x2", "topic": "模式與流程", "q": "在 RUP 開發流程圖中，「企業塑模」的工作量主要集中在哪個階段？", "o": ["轉移階段", "建構階段", "平均分布在四個階段", "初始階段"], "a": 3, "e": "企業塑模是 RUP 的首要工作，工作量集中在專案前段的初始階段。", "src": "drill"}, {"id": "d038", "ch": "x2", "topic": "模式與流程", "q": "在 RUP 開發流程圖中，「部署」的工作量主要集中在哪個階段？", "o": ["轉移階段", "初始階段", "詳述階段", "平均分布在四個階段"], "a": 0, "e": "部署集中在最後的轉移階段。", "src": "drill"}, {"id": "d039", "ch": "x2", "topic": "模式與流程", "q": "螺旋模式圖中，雛型的演進順序為何？", "o": ["雛型 1 → 雛型 2 → 可運轉雛型", "雛型 1 → 可運轉雛型 → 雛型 2", "整個流程只建立一個雛型", "可運轉雛型 → 雛型 1 → 雛型 2"], "a": 0, "e": "螺旋由內往外，每一圈都做風險分析，雛型依序為雛型 1、雛型 2、可運轉雛型。", "src": "drill"}, {"id": "d040", "ch": "x2", "topic": "模式與流程", "q": "雛型模式的流程中，客戶評估雛型後若不滿意，接下來會怎麼做？", "o": ["檢討／更新後回到設計，再產出新雛型", "結束專案", "直接進入正式開發", "直接進行部署"], "a": 0, "e": "雛型模式：原始需求 → 設計 → 產出雛型 → 客戶評估 → 檢討／更新，反覆循環到滿意才正式開發。", "src": "drill"}, {"id": "d041", "ch": "x2", "topic": "模式與流程", "q": "雛型模式流程中，客戶評估滿意之後的步驟順序為何？", "o": ["部署 → 測試 → 維護", "維護 → 正式開發 → 測試", "正式開發 → 測試 → 維護", "測試 → 正式開發 → 維護"], "a": 2, "e": "客戶評估滿意後依序進入正式開發、測試、維護。", "src": "drill"}, {"id": "d042", "ch": "x2", "topic": "模式與流程", "q": "APM 模式中，產出「發布計畫書（Release Plan）」的是哪個階段？", "o": ["調整（Adapt）", "探索（Explore）", "推測（Speculate）", "構想（Envision）"], "a": 2, "e": "推測階段依據故事待辦清單產出發布計畫書。", "src": "drill"}, {"id": "d043", "ch": "x2", "topic": "模式與流程", "q": "APM 模式中，「構想（Envision）」階段的產出是什麼？", "o": ["完成的故事", "最終產品", "願景（Vision）", "發布計畫書"], "a": 2, "e": "構想階段產出願景；推測產出發布計畫書；探索產出完成的故事。", "src": "drill"}, {"id": "d044", "ch": "x2", "topic": "模式與流程", "q": "APM 模式中，哪幾個階段會反覆循環？", "o": ["推測 → 探索 → 調整", "探索 → 調整 → 結束", "構想 → 結束", "構想 → 推測 → 探索"], "a": 0, "e": "推測、探索、調整是循環；構想和結束只各發生一次。", "src": "drill"}, {"id": "d045", "ch": "x2", "topic": "模式與流程", "q": "敏捷通用流程（AUP）的流程順序為何？", "o": ["構想 → 推測 → 探索 → 調整 → 結束", "起始 → 可行性研究 → 迭代 → 發布規劃 → 結束", "初始 → 詳述 → 建構 → 轉移", "可行性研究 → 起始 → 發布規劃 → 迭代 → 結束"], "a": 3, "e": "AUP：可行性研究（Feasibility）→ 起始（Initiation）→ 發布規劃 → 迭代內 → 發布前置迭代 → 結束（Close Out）。", "src": "drill"}, {"id": "d046", "ch": "x2", "topic": "模式與流程", "q": "漸進模式的四個漸進階段，依序建置什麼？", "o": ["核心功能 → 功能一 → 功能二 → 功能三", "功能一 → 功能二 → 功能三 → 核心功能", "需求 → 設計 → 開發 → 測試", "雛型 → 核心功能 → 測試 → 部署"], "a": 0, "e": "漸進一建核心功能，之後依序加入功能一、二、三。", "src": "drill"}, {"id": "d047", "ch": "x2", "topic": "模式與流程", "q": "Scrum 流程中，產品待辦清單、衝刺待辦清單、增量產品的流向為何？", "o": ["產品待辦清單 → 增量產品 → 衝刺待辦清單", "產品待辦清單 → 衝刺待辦清單 → 潛在可交付的增量產品", "增量產品 → 產品待辦清單 → 衝刺待辦清單", "衝刺待辦清單 → 產品待辦清單 → 增量產品"], "a": 1, "e": "衝刺規劃時從產品待辦清單挑出工作放進衝刺待辦清單，衝刺結束產出潛在可交付的增量產品。", "src": "drill"}, {"id": "d048", "ch": "x2", "topic": "數字與清單", "q": "XP 共有幾個核心實務？", "o": ["13 個", "12 個", "7 個", "9 個"], "a": 0, "e": "XP 的核心是 13 個實務，例如結對編程、測試驅動、重構、持續整合。", "src": "drill"}, {"id": "d049", "ch": "x2", "topic": "數字與清單", "q": "精益（Lean）有幾個基本原則？", "o": ["7 個", "12 個", "5 個", "13 個"], "a": 0, "e": "Lean 七原則：消除浪費、強化學習、盡可能晚做決策、盡可能儘快交付、授權團隊、建構完整性、著眼整體。", "src": "drill"}, {"id": "d050", "ch": "x2", "topic": "數字與清單", "q": "Kanban 的主要原則、核心價值、實務，各有幾個？", "o": ["4、6、5", "6、5、4", "5、4、6", "4、5、6"], "a": 3, "e": "Kanban：4 個主要原則、5 個核心價值（與精益共享）、6 個實務。", "src": "drill"}, {"id": "d051", "ch": "x2", "topic": "數字與清單", "q": "水晶家族規定漸進式開發最長不要超過多久？", "o": ["一個月", "六個月", "一年", "四個月"], "a": 3, "e": "Crystal 適用規則：漸進式開發最長不超過四個月，專案前後都要開檢討會議。", "src": "drill"}, {"id": "d052", "ch": "x2", "topic": "數字與清單", "q": "水晶家族分類圖中，橫軸與縱軸分別代表什麼？", "o": ["團隊經驗；風險", "參與人數；臨界（缺陷造成的損失）", "功能數量；品質", "專案時間；預算"], "a": 1, "e": "橫軸是參與人數（±20%），縱軸是臨界，也就是缺陷造成的損失。", "src": "drill"}, {"id": "d053", "ch": "x2", "topic": "數字與清單", "q": "水晶家族的臨界等級，由低到高依序為何？", "o": ["C 安逸／舒適 → E 必要的 → D 可自由支配的 → L 生活", "D 可自由支配的 → C 安逸／舒適 → E 必要的 → L 生活", "L 生活 → E 必要的 → D 可自由支配的 → C 安逸／舒適", "C 安逸／舒適 → D 可自由支配的 → E 必要的 → L 生活"], "a": 3, "e": "臨界由低到高：C（Comfort）、D（Discretionary）、E（Essential）、L（Life），例如 L6 代表 6 人以下、攸關生命的專案。", "src": "drill"}, {"id": "d054", "ch": "x2", "topic": "數字與清單", "q": "水晶家族的顏色從 C6 到 L1000，分為哪幾種？", "o": ["白色、綠色、黃色、紅色及黑色", "紅色、橘色、黃色、綠色及藍色", "透明、藍色、綠色、黃色及紅色", "透明、黃色、橘色、紅色及藍色"], "a": 3, "e": "顏色依參與人數由少到多：透明、黃、橘、紅、藍，人越多顏色越深。", "src": "drill"}, {"id": "d055", "ch": "x2", "topic": "數字與清單", "q": "Mike Cohn 認為，每隔多久任何人都能看到真正可用的軟體？", "o": ["三到六個月", "一年", "每天", "兩週到一個月"], "a": 3, "e": "Mike Cohn：每兩週到一個月，任何人都能看到真正可用的軟體，並決定交付或再加一個衝刺。", "src": "drill"}, {"id": "d056", "ch": "x2", "topic": "數字與清單", "q": "Scrum 每日立會每次多久？每人說幾件事？", "o": ["15 分鐘，5 件事", "30 分鐘，3 件事", "1 小時，4 件事", "15 分鐘，3 件事"], "a": 3, "e": "每天 15 分鐘、站著開，說三件事：昨天完成什麼、今天要做什麼、有沒有困難。", "src": "drill"}, {"id": "d057", "ch": "x2", "topic": "數字與清單", "q": "第 9 屆 State of Agile 調查中，Scrum 的使用率約為多少？", "o": ["56%", "30%", "8%", "10%"], "a": 0, "e": "Scrum 56%，第二名 Scrum/XP Hybrid 約 10%，Custom Hybrid 約 8%。", "src": "drill"}, {"id": "d058", "ch": "x2", "topic": "數字與清單", "q": "Scrum 的角色、儀式、產出、支柱、價值觀，數量分別為？", "o": ["3 角色、4 儀式、4 產出、3 支柱、5 價值觀", "4 角色、3 儀式、4 產出、3 支柱、5 價值觀", "3 角色、5 儀式、4 產出、3 支柱、4 價值觀", "3 角色、4 儀式、3 產出、5 支柱、4 價值觀"], "a": 0, "e": "角色：PO、Scrum 大師、開發團隊；儀式：規劃、立會、審查、回顧；產出：產品待辦、衝刺待辦、增量、燃盡圖；支柱：透明、檢視、調適；價值觀：公開、勇氣、尊重、專注、承諾。", "src": "drill"}, {"id": "d059", "ch": "x2", "topic": "數字與清單", "q": "XP 團隊共有幾種角色？", "o": ["3 種", "5 種", "4 種", "6 種"], "a": 2, "e": "XP 四種角色：程式設計師、測試者、教練、客戶。", "src": "drill"}, {"id": "d060", "ch": "x2", "topic": "數字與清單", "q": "依簡報，DSDM 團隊的核心原則共有幾條？", "o": ["9 條", "12 條", "7 條", "4 條"], "a": 0, "e": "簡報列出 DSDM 九條核心原則；另外有 4 項團隊必須決定的事（MoSCoW）。", "src": "drill"}, {"id": "d061", "ch": "x2", "topic": "數字與清單", "q": "RUP 開發流程圖中，共有幾個工作流程？", "o": ["7 個", "9 個", "4 個", "13 個"], "a": 1, "e": "九個工作流程：企業塑模、需求、設計、開發、測試、部署、組態管理與變更管理、專案管理、環境。", "src": "drill"}, {"id": "d062", "ch": "x2", "topic": "數字與清單", "q": "FDD 專注的兩項工作是什麼？", "o": ["衝刺規劃、每日立會", "工作可視化、限制進行中工作", "創建模型、開發功能列表", "結對編程、重構"], "a": 2, "e": "FDD 專注於創建模型與開發功能列表。", "src": "drill"}, {"id": "d063", "ch": "x2", "topic": "數字與清單", "q": "水晶家族的價值觀是什麼？", "o": ["公開、承諾", "高耐受性、專注於人和溝通", "透明、檢視、調適", "消除浪費、強化學習"], "a": 1, "e": "Crystal 價值觀：高耐受性（High Tolerance）、專注於人和溝通。", "src": "drill"}, {"id": "d064", "ch": "x2", "topic": "數字與清單", "q": "DSDM 團隊必須決定的四件事（MoSCoW），正確的是？", "o": ["現在做、下週做、以後做、不做", "必要的、重要的、次要的、不要的", "高、中、低、無", "必要的、應該要的、可以要的、不要的"], "a": 3, "e": "Musts 必要的、Shoulds 應該要的、Coulds 可以要的、Won't Have 不要的。", "src": "drill"}, {"id": "d065", "ch": "x2", "topic": "數字與清單", "q": "螺旋模式每個循環包含幾個步驟？", "o": ["6 個", "4 個", "5 個", "3 個"], "a": 1, "e": "四步驟：決定目標、識別與解決風險、開發與測試、規劃下個循環。", "src": "drill"}];
const CH = {ch1:'Ch1', ch2:'Ch2', x2:'Ch2 加練'};
const BANKS = {exam:{name:'小考題庫', sub:'Ch1 敏捷思維與專案管理基礎 ・ Ch2 傳統與敏捷方法論', has:q=>q.ch!=='x2'}, drill:{name:'Ch2 記憶加練', sub:'Ch2 人名、年份、模式流程與數字清單，從簡報挖出的加練題', has:q=>q.ch==='x2'}};
const inBank = q => BANKS[st.bank].has(q);
const TOPIC_ORDER=['專案管理基礎','創新與時代趨勢','敏捷思維與宣言','組織專案管理與 PMO','傳統開發模式','Scrum','其他敏捷方法論','人名與年份','方法論對照','模式與流程','數字與清單'];
const TOPICS = [...new Set(BANK.map(q=>q.ch+'|'+q.topic))].map(s=>{const [ch,t]=s.split('|');return {ch,t};}).sort((a,b)=>a.ch.localeCompare(b.ch)||TOPIC_ORDER.indexOf(a.t)-TOPIC_ORDER.indexOf(b.t));
const KEY='pm-quiz-v1';
let rec = {};
try{ rec = JSON.parse(localStorage.getItem(KEY)||'{}') || {}; }catch(e){ rec = {}; }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(rec)); }catch(e){} }

const st = { bank:'exam', ch:'all', topics:new Set(), mode:'all', count:20 };
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const L = 'ABCD';

function segment(el, items, get, set){
  el.innerHTML='';
  items.forEach(([v,label])=>{
    const b=document.createElement('button'); b.type='button'; b.textContent=label;
    b.setAttribute('aria-pressed', String(get()===v));
    b.onclick=()=>{ set(v); renderHome(); };
    el.appendChild(b);
  });
}

function pool(){
  return BANK.filter(q=>{
    if(!inBank(q)) return false;
    if(st.bank==='exam' && st.ch!=='all' && q.ch!==st.ch) return false;
    if(st.topics.size && !st.topics.has(q.ch+'|'+q.topic)) return false;
    const r=rec[q.id];
    if(st.mode==='wrong') return r && r.last===false;
    if(st.mode==='new') return !r;
    return true;
  });
}

function renderHome(){
  const xN=BANK.filter(q=>q.ch==='x2').length;
  segment($('bankSeg'), [['exam',`小考題庫（${BANK.length-xN}）`],['drill',`Ch2 記憶加練（${xN}）`]], ()=>st.bank, v=>{ if(st.bank!==v){ st.bank=v; st.ch='all'; st.topics.clear(); } });
  $('chField').hidden = st.bank!=='exam';
  $('subtitle').textContent = BANKS[st.bank].sub;
  segment($('chSeg'), [['all','全部'],['ch1','Ch1'],['ch2','Ch2']], ()=>st.ch, v=>{st.ch=v; st.topics.clear();});
  const tc=$('topicChips'); tc.innerHTML='';
  TOPICS.filter(t=>BANKS[st.bank].has({ch:t.ch}) && (st.ch==='all'||t.ch===st.ch)).forEach(t=>{
    const k=t.ch+'|'+t.t, n=BANK.filter(q=>q.ch===t.ch&&q.topic===t.t).length;
    const b=document.createElement('button'); b.type='button';
    b.innerHTML=(st.bank==='exam'&&st.ch==='all'?CH[t.ch]+' ':'')+esc(t.t)+'<small>'+n+'</small>';
    b.setAttribute('aria-pressed', String(st.topics.has(k)));
    b.onclick=()=>{ st.topics.has(k)?st.topics.delete(k):st.topics.add(k); renderHome(); };
    tc.appendChild(b);
  });
  const wrongN=BANK.filter(q=>inBank(q)&&rec[q.id]&&rec[q.id].last===false).length;
  segment($('modeSeg'), [['all','全部題目'],['wrong','只練錯題（'+wrongN+'）'],['new','還沒做過的']], ()=>st.mode, v=>st.mode=v);
  segment($('countSeg'), [[10,'10 題'],[20,'20 題'],[40,'40 題'],[0,'全部']], ()=>st.count, v=>st.count=v);
  const p=pool(), n=st.count?Math.min(st.count,p.length):p.length;
  $('poolInfo').textContent = p.length ? `符合條件 ${p.length} 題，這次出 ${n} 題` : (st.mode==='wrong'?'目前沒有答錯的題目':'沒有符合條件的題目');
  $('startBtn').disabled = !p.length;
  renderGrid(); renderStats();
}

function renderGrid(){
  const g=$('grid'); g.innerHTML='';
  const inPool=new Set(pool().map(q=>q.id));
  BANK.filter(inBank).forEach((q,i)=>{
    const r=rec[q.id], b=document.createElement('button');
    b.type='button'; b.className='cell'+(r?(r.last?' ok':' ng'):'')+(inPool.has(q.id)?'':' dim');
    b.textContent=i+1; b.title=`${CH[q.ch]}・${q.topic}：${q.q}`;
    b.setAttribute('aria-label', `第 ${i+1} 題，${r?(r.last?'上次答對':'上次答錯'):'還沒做過'}`);
    b.onclick=()=>startQuiz([q]);
    g.appendChild(b);
  });
  const tb=$('topicBars'); tb.innerHTML='';
  TOPICS.filter(t=>BANKS[st.bank].has({ch:t.ch})).forEach(t=>{
    const qs=BANK.filter(q=>q.ch===t.ch&&q.topic===t.t);
    const ok=qs.filter(q=>rec[q.id]&&rec[q.id].last).length, ng=qs.filter(q=>rec[q.id]&&rec[q.id].last===false).length;
    const row=document.createElement('div'); row.className='trow';
    row.innerHTML=`<span>${st.bank==='exam'?CH[t.ch]+' ':''}${esc(t.t)}</span><span class="bar"><i class="b-ok" style="width:${ok/qs.length*100}%"></i><i class="b-ng" style="width:${ng/qs.length*100}%"></i></span><span class="mono">${ok}/${qs.length}</span>`;
    tb.appendChild(row);
  });
}

function renderStats(){
  const B=BANK.filter(inBank);
  const done=B.filter(q=>rec[q.id]).length, ok=B.filter(q=>rec[q.id]&&rec[q.id].last).length;
  const ng=done-ok;
  $('hdrStats').innerHTML=`<div class="stat"><span class="label">已做過</span><b>${done}<small style="font-size:13px;color:var(--muted)">/${B.length}</small></b></div><div class="stat"><span class="label">上次答對</span><b style="color:var(--good)">${ok}</b></div><div class="stat"><span class="label">待加強</span><b style="color:var(--bad)">${ng}</b></div>`;
}

let run=null;
function startQuiz(list){
  const qs=shuffle(list).map(q=>{
    const fixed=q.o.some(o=>/以上/.test(o)) || !$('shuffleOpts').checked;
    const order=fixed?[0,1,2,3]:shuffle([0,1,2,3]);
    return {q, order};
  });
  run={qs, i:0, right:0, wrong:[], answered:false, source:list};
  show('quiz'); renderQ();
}
function show(id){ ['home','quiz','result'].forEach(s=>$(s).hidden = s!==id); window.scrollTo(0,0); }

function remap(text, order){
  // explanation letters refer to the original option order; map them to the displayed letters
  return text.replace(/(?<![A-Za-z])([A-D])(?![A-Za-z])/g, m=>L[order.indexOf(L.indexOf(m))]);
}

function renderQ(){
  const {q,order}=run.qs[run.i];
  $('qCount').textContent=`第 ${run.i+1} / ${run.qs.length} 題`;
  $('qProg').style.width=(run.i/run.qs.length*100)+'%';
  $('qScore').textContent=`答對 ${run.right}`;
  const n=BANK.filter(x=>x.ch==='x2'===(q.ch==='x2')).indexOf(q)+1, r=rec[q.id];
  $('qMeta').innerHTML=`<span class="tag ch">${CH[q.ch]}</span><span class="tag">${esc(q.topic)}</span><span class="tag mono">#${n}</span>`+(r&&r.last===false?'<span class="tag" style="color:var(--bad);border-color:var(--bad)">上次答錯</span>':'');
  $('qText').textContent=q.q;
  const ul=$('qOpts'); ul.innerHTML='';
  order.forEach((orig,pos)=>{
    const li=document.createElement('li');
    const b=document.createElement('button'); b.type='button'; b.className='opt'; b.id='opt'+pos;
    b.innerHTML=`<span class="bubble">${L[pos]}</span><span class="txt">${esc(q.o[orig])}</span>`;
    b.onclick=()=>answer(pos);
    li.appendChild(b); ul.appendChild(li);
  });
  $('qFeedback').innerHTML=''; $('nextBtn').hidden=true; run.answered=false;
}

function answer(pos){
  if(run.answered) return; run.answered=true;
  const {q,order}=run.qs[run.i];
  const correctPos=order.indexOf(q.a), ok=pos===correctPos;
  document.querySelectorAll('.opt').forEach((b,i)=>{ b.disabled=true; if(i===correctPos) b.classList.add('right'); else if(i===pos) b.classList.add('wrong'); });
  const prev=rec[q.id]||{n:0,ok:0};
  rec[q.id]={n:prev.n+1, ok:prev.ok+(ok?1:0), last:ok}; save();
  if(ok) run.right++; else run.wrong.push({q, order, picked:pos});
  $('qScore').textContent=`答對 ${run.right}`;
  $('qFeedback').innerHTML=`<div class="feedback ${ok?'yes':'no'}"><strong>${ok?'答對了':'答錯了，正確答案是 '+L[correctPos]}</strong><p>${esc(remap(q.e, order))}</p></div>`;
  const nb=$('nextBtn'); nb.hidden=false; nb.textContent = run.i===run.qs.length-1 ? '看成績' : '下一題'; nb.focus({preventScroll:true});
}

function next(){ if(!run.answered) return; if(run.i<run.qs.length-1){ run.i++; renderQ(); } else finish(); }

function finish(){
  const total=run.i+(run.answered?1:0);
  show('result');
  $('rScore').textContent = total ? Math.round(run.right/total*100)+'%' : '—';
  $('rDetail').textContent = `${total} 題答對 ${run.right} 題`;
  $('retryWrongBtn').hidden = !run.wrong.length;
  $('rWrongTitle').textContent = run.wrong.length ? `答錯的 ${run.wrong.length} 題` : '全部答對';
  $('rWrong').innerHTML = run.wrong.map(w=>{
    const cp=w.order.indexOf(w.q.a);
    return `<div class="witem"><div class="qmeta"><span class="tag ch">${CH[w.q.ch]}</span><span class="tag">${esc(w.q.topic)}</span></div><div class="q">${esc(w.q.q)}</div><div class="ans">你選 <span class="y">${L[w.picked]}. ${esc(w.q.o[w.order[w.picked]])}</span><br>正確 <span class="c">${L[cp]}. ${esc(w.q.o[w.q.a])}</span></div><div class="e">${esc(remap(w.q.e, w.order))}</div></div>`;
  }).join('');
}

$('startBtn').onclick=()=>{ const p=pool(); startQuiz(st.count?shuffle(p).slice(0,st.count):p); };
$('nextBtn').onclick=next;
$('quitBtn').onclick=finish;
$('homeBtn').onclick=()=>{ show('home'); renderHome(); };
$('againBtn').onclick=()=>{ const p=pool(); if(p.length) startQuiz(st.count?shuffle(p).slice(0,st.count):p); else { show('home'); renderHome(); } };
$('retryWrongBtn').onclick=()=>startQuiz(run.wrong.map(w=>w.q));
let resetArmed=false;
$('resetBtn').onclick=()=>{
  if(!resetArmed){ resetArmed=true; $('resetBtn').textContent='再按一次確認清除'; setTimeout(()=>{resetArmed=false;$('resetBtn').textContent='清除作答紀錄';},4000); return; }
  rec={}; save(); resetArmed=false; $('resetBtn').textContent='清除作答紀錄'; renderHome();
};
document.addEventListener('keydown',e=>{
  if($('quiz').hidden || e.metaKey || e.ctrlKey || e.altKey) return;
  const k=e.key.toUpperCase();
  const idx = 'ABCD'.indexOf(k)>=0 ? 'ABCD'.indexOf(k) : '1234'.indexOf(k);
  if(idx>=0 && !run.answered && k.length===1){ e.preventDefault(); answer(idx); }
  else if(e.key==='Enter' && run.answered){ e.preventDefault(); next(); }
});
renderHome();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); deferredPrompt=e; document.getElementById('installBtn').hidden=false; });
document.getElementById('installBtn').addEventListener('click',async()=>{ if(!deferredPrompt) return; deferredPrompt.prompt(); try{ await deferredPrompt.userChoice; }catch(e){} deferredPrompt=null; document.getElementById('installBtn').hidden=true; });
window.addEventListener('appinstalled',()=>{ document.getElementById('installBtn').hidden=true; });
</script>
</body>
</html>
