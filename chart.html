const cv=document.getElementById('cv'),vp=document.getElementById('vp'),sizer=document.getElementById('sizer');let z=1,active=-1,answerView=false,practiceView=null;const fields=[];const KEY='pm-chart-direct-v1';let saved={};try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');if(x&&typeof x==='object'&&!Array.isArray(x))saved=x}catch{}
function norm(s){return String(s||'').normalize('NFKC').replace(/使用者/g,'用戶').replace(/台/g,'臺').replace(/[\s•·、，,。／/（）()：:－-]/g,'')}
function isCorrect(t,a){return norm(t)!==''&&norm(t)===norm(a)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved))}catch{}}
function zoom(v){z=Math.max(.18,Math.min(2.4,v));cv.style.transform=`scale(${z})`;sizer.style.width=1800*z+'px';sizer.style.height=1130*z+'px'}
function center(f){vp.scrollLeft=(f.x+f.w/2)*z-vp.clientWidth/2;vp.scrollTop=(f.y+f.h/2)*z-vp.clientHeight/2}
function reveal(f){const pad=16,left=f.x*z,top=f.y*z,right=(f.x+f.w)*z,bottom=(f.y+f.h)*z;if(left<vp.scrollLeft+pad)vp.scrollLeft=Math.max(0,left-pad);else if(right>vp.scrollLeft+vp.clientWidth-pad)vp.scrollLeft=right-vp.clientWidth+pad;if(top<vp.scrollTop+pad)vp.scrollTop=Math.max(0,top-pad);else if(bottom>vp.scrollTop+vp.clientHeight-pad)vp.scrollTop=bottom-vp.clientHeight+pad}
function fit(){zoom(Math.min(vp.clientWidth/1800,vp.clientHeight/1130));vp.scrollLeft=0;vp.scrollTop=0}
function zoomCenter(v){const px=(vp.scrollLeft+vp.clientWidth/2)/z,py=(vp.scrollTop+vp.clientHeight/2)/z;zoom(v);vp.scrollLeft=px*z-vp.clientWidth/2;vp.scrollTop=py*z-vp.clientHeight/2}
function status(){let done=0,right=0;fields.forEach(f=>{const a=saved[f.key];if(a?.checked){done++;if(isCorrect(a.typed,f.answer))right++}});document.getElementById('status').textContent=`已核對 ${done}/${fields.length} · 答對 ${right}`}
function paint(f){const a=saved[f.key]||{},show=answerView||!!a.checked;f.box.classList.toggle('revealed',show);f.box.classList.toggle('good',show&&(answerView||isCorrect(a.typed,f.answer)));f.box.classList.toggle('bad',!answerView&&!!a.checked&&!isCorrect(a.typed,f.answer));f.input.value=a.typed||'';f.input.readOnly=show;f.input.hidden=show;f.result.textContent=show?f.answer:'';f.input.setAttribute('aria-describedby','feedback')}
function feedback(f){const a=saved[f.key];const el=document.getElementById('feedback');el.className='feedback';if(a?.checked){const ok=isCorrect(a.typed,f.answer);el.classList.add(ok?'good':'bad');el.textContent=(ok?'✓ 答對！':'✗ 你的答案：'+(a.typed||'（未填）')+'。')+' 正確答案：'+f.answer.replace(/\n\s*/g,'');}else el.textContent=`第 ${f.index+1} 格：輸入後按 Enter 顯示正解；Tab 可移到下一格。`}
function open(f){active=f.index;const a=saved[f.key];document.getElementById('check').disabled=!!a?.checked;feedback(f)}
function check(){if(answerView||active<0)return;const f=fields[active];if(saved[f.key]?.checked)return;saved[f.key]={typed:f.input.value,checked:true};paint(f);if(document.activeElement===f.input)f.input.blur();persist();status();feedback(f);document.getElementById('check').disabled=true;}
function focusAt(i){const f=fields[i];if(!f)return;f.input.focus({preventScroll:true});reveal(f)}
function next(){if(!fields.length)return;const i=fields.findIndex((f,i)=>i>active&&!saved[f.key]?.checked);focusAt(i<0?fields.findIndex(f=>!saved[f.key]?.checked):i)}
const sizes={big:22,big2:20,sm:13,xs:11.5};
function create(t,x,y,fs,anchor='',fixedColor=''){
 const m=document.createElement('span');m.className='measure';m.style.fontSize=fs+'px';m.textContent=t;cv.append(m);const w=Math.max(36,m.offsetWidth+4),h=Math.max(25,m.offsetHeight+4);m.remove();const left=x-OX-(anchor==='c'?w/2:0),top=y-OY-Math.round(fs*1.35)/2-2;
 const box=document.createElement('div');box.className='cell';box.style.cssText=`left:${left}px;top:${top}px;width:${w}px;height:${h}px;font-size:${fs}px`;
 const input=document.createElement('textarea');input.className='entry';input.rows=1;input.placeholder='填答';input.autocomplete='off';input.spellcheck=false;input.enterKeyHint='done';input.setAttribute('aria-label',`第 ${fields.length+1} 格答案`);
 const result=document.createElement('span');result.className='result';result.setAttribute('aria-hidden','true');box.append(input,result);cv.append(box);
 const key=String(fields.length)+'|'+t;const f={key,index:fields.length,answer:t.replace(/^•\s*/,''),box,input,result,x:left,y:top,w,h};fields.push(f);
 if(!saved[key]||typeof saved[key].typed!=='string')delete saved[key];paint(f);
 input.addEventListener('focus',()=>open(f));input.addEventListener('pointerdown',()=>{if(saved[key]?.checked)open(f)});
 input.addEventListener('input',()=>{saved[key]={typed:input.value,checked:false};box.classList.remove('revealed','good','bad');result.textContent='';persist();status();feedback(f)});
 input.addEventListener('keydown',e=>{if(e.isComposing||e.keyCode===229)return;if(e.key==='Enter'){e.preventDefault();check()}else if(e.key==='Tab'){const n=f.index+(e.shiftKey?-1:1);if(n>=0&&n<fields.length){e.preventDefault();focusAt(n)}}});
}

document.getElementById('check').onclick=check;document.getElementById('next').onclick=next;document.getElementById('actual').onclick=()=>zoomCenter(1);document.getElementById('fit').onclick=fit;document.getElementById('in').onclick=()=>zoomCenter(z*1.25);document.getElementById('out').onclick=()=>zoomCenter(z/1.25);
document.getElementById('weak').onclick=()=>{const weak=fields.filter(f=>saved[f.key]?.checked&&!isCorrect(saved[f.key].typed,f.answer));if(!weak.length){document.getElementById('feedback').textContent='尚無答錯的格子；先輸入答案並按 Enter 核對。';return;}weak.forEach(f=>{delete saved[f.key];paint(f)});persist();status();focusAt(weak[0].index)};
document.getElementById('clear').onclick=()=>{if(!confirm('清空整張圖的填答紀錄，全部重寫？'))return;saved={};fields.forEach(paint);persist();status();active=-1;document.getElementById('check').disabled=true;document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='已清空，點任一空格重新練習。';};
let pinch;vp.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch={d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),z}}, {passive:true});vp.addEventListener('touchmove',e=>{if(!pinch||e.touches.length!==2)return;e.preventDefault();const r=vp.getBoundingClientRect(),mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top,px=(vp.scrollLeft+mx)/z,py=(vp.scrollTop+my)/z;zoom(pinch.z*Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/pinch.d);vp.scrollLeft=px*z-mx;vp.scrollTop=py*z-my},{passive:false});vp.addEventListener('touchend',()=>pinch=null);
