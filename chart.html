<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>敏捷架構圖默寫</title>
<meta name="description" content="依 NPMA 敏捷專案管理架構圖版面重繪的挖空默寫練習：點格子翻答案，標記不熟的格子，只練不熟的。">
<meta name="theme-color" content="#d9dde2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="專案管理題庫">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700;900&display=swap">
<style>
/* Layout: a faithful redraw of the printed NPMA chart on a fixed 1800×1130 canvas (scaled to fit, zoomable),
   every label replaced by a tap-to-reveal blank in the same spot. Deliberately single (paper) theme, like the handout. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --desk:#d9dde2; --paper:#ffffff; --ink:#1d2430; --muted:#5d6672; --accent:#2340b8;
  --blue:#2b5ea8; --blue-hi:#5d8fd6; --orange:#e2803a; --orange-soft:#f9d8b2; --peach:#fbe7d0;
  --red:#9c2f2f; --pink:#f3cbc6; --green:#8cc06a; --green-soft:#e6f2da;
  --bad:#d4344d;
  --f-serif:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--desk);padding-block:8px}
.top a{color:var(--muted);font-size:13px;margin-right:4px}
.top button{font:inherit;font-size:13px;border:1px solid #b9c0c8;background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.top button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.top button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.top .count{font-size:13px;color:var(--muted);margin-left:auto}
.top .count b{color:var(--ink)} .top .count .w{color:var(--bad)}
.zoom{display:inline-flex;gap:4px}
.zoom button{padding:5px 10px}
.hintline{font-size:12px;color:var(--muted);margin:0 0 8px}
.viewport{overflow:auto;border-radius:6px;box-shadow:0 1px 0 #c3c9d0,0 6px 24px rgba(30,40,60,.12);background:var(--paper);max-height:calc(100vh - 110px);-webkit-overflow-scrolling:touch}
.sizer{position:relative}
.canvas{position:absolute;left:0;top:0;width:1800px;height:1130px;transform-origin:0 0;background:var(--paper)}
.canvas svg{position:absolute;inset:0;width:1800px;height:1130px}
.fixed{position:absolute;font-family:var(--f-serif);font-weight:700;color:var(--ink);white-space:nowrap;pointer-events:none}

/* blanks */
.b{position:absolute;font:inherit;font-family:var(--f-body);font-size:15px;line-height:20px;color:var(--ink);padding:1px 3px;margin:0;
  border:1px solid transparent;border-radius:3px;background:transparent;cursor:pointer;text-align:left;white-space:pre;-webkit-tap-highlight-color:transparent}
.b.c{text-align:center}
.b.serif{font-family:var(--f-serif);font-weight:700}
.b.light{color:#fff}
.b.hid{background:rgba(255,255,255,.9);border:1px dashed #7d8794}
.b.light.hid{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.8)}
.b.hid .a{visibility:hidden}
.b .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8a93a0;font-size:12px;letter-spacing:.12em;pointer-events:none}
.b.light .ph{color:rgba(255,255,255,.9)}
.b:not(.hid) .ph{display:none}
.b.weak{border:2px solid var(--bad)!important;background:rgba(255,226,231,.92)}
.b.weak.light{background:rgba(212,52,77,.35)}
.b.weak.hid{border-style:dashed!important}
.b.flash{outline:3px solid var(--accent);outline-offset:2px}
.b:focus-visible,.top button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.credit{font-size:12px;color:var(--muted);margin-top:8px}
.grp,.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg{gap:0}.seg button:first-child{border-radius:999px 0 0 999px}.seg button:last-child{border-radius:0 999px 999px 0;margin-left:-1px}
.reg select{font:inherit;font-size:13px;border:1px solid #b9c0c8;border-radius:999px;padding:5px 10px;background:#fff;color:var(--ink)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* drag mode */
body.drag{padding-bottom:calc(32vh + 20px)}
body.drag .viewport{max-height:max(200px,calc(100vh - 32vh - 120px))}
body.drag .b:not(.slot){pointer-events:none}
.pool{position:fixed;left:0;right:0;bottom:0;z-index:8;background:#f4f6f8;border-top:1px solid #b9c0c8;box-shadow:0 -6px 20px rgba(30,40,60,.12);
  max-height:32vh;overflow:auto;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.pool-head{font-size:13px;color:var(--muted);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pool-head b{color:var(--ink)} .pool-head .w{color:var(--bad)}
.pool-head button{font:inherit;font-size:13px;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:6px}
.tile{font:inherit;font-size:14px;background:#fff;color:var(--ink);border:1px solid #8f98a3;border-radius:6px;padding:5px 10px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tile.sel{background:var(--accent);color:#fff;border-color:var(--accent)}
.tile.dragging{opacity:.3}
.ghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-70%);box-shadow:0 8px 18px rgba(0,0,0,.25);cursor:grabbing}
.b.slot.hid{border:1.5px dashed var(--accent);background:rgba(232,238,255,.94)}
.b.light.slot.hid{background:rgba(232,238,255,.35);border-color:#fff}
.b.slot.over{outline:3px solid var(--accent);outline-offset:1px}
.b.ok{border:2px solid #17845a!important;background:rgba(223,243,234,.95)}
.b.light.ok{background:rgba(23,132,90,.5)}
.b.no{border:2px solid var(--bad)!important;animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="top" role="toolbar" aria-label="默寫工具">
  <a href="./">← 題庫</a>
  <span class="seg"><button id="mFlip" aria-pressed="true">翻牌</button><button id="mDrag" aria-pressed="false">拖拉字卡</button></span>
  <label class="reg"><span class="vh">練習範圍</span><select id="region"></select></label>
  <span id="flipTools" class="grp">
  <button class="primary" id="nextBtn">翻下一格</button>
  <button id="hideAll">全部遮住</button>
  <button id="showAll">全部顯示</button>
  <button id="weakOnly">只遮不熟的</button>
  </span>
  <span id="dragTools" class="grp" hidden><button class="primary" id="restart">重新洗牌</button></span>
  <button id="hintBtn" aria-pressed="false">字數提示</button>
  <span class="zoom"><button id="zOut" aria-label="縮小">－</button><button id="zFit">整張</button><button id="zIn" aria-label="放大">＋</button></span>
  <span class="count" id="count"></span>
</div>
<p class="hintline" id="hintline"></p>

<div class="viewport" id="vp"><div class="sizer" id="sizer"><div class="canvas" id="cv"><svg id="art" viewBox="60 300 1800 1130" aria-hidden="true"></svg></div></div></div>
<div class="pool" id="pool" hidden><div class="pool-head" id="poolMsg"></div><div class="tiles" id="tiles"></div></div>
<p class="credit">依 NPMA 中華專案管理學會「敏捷專案管理架構圖」版面重繪，僅供個人默寫練習；插圖為簡化示意。</p>

<script>
/* ---------- coordinates: same system as the original photo (x 60–1860, y 300–1430) ---------- */
const OX=60, OY=300;
const C={blue:'#2b5ea8',blueHi:'#6f9be0',orange:'#e2803a',orangeHi:'#f2a865',peach:'#fbe3c8',peachLine:'#eeb27c',
  red:'#9c2f2f',redHi:'#c0504d',pink:'#f5d0cb',pinkLine:'#d98c86',band:'#f6c9cf',green:'#8cc06a',greenSoft:'#e3f0d6',
  ink:'#1d2430',grey:'#9aa3ae',po:'#2f9a4a',coach:'#7b4fc4',member:'#b8432f',tester:'#2f6fc4',sponsor:'#c99a1c',stake:'#e8bb2c'};
let svg='';
const add=s=>svg+=s;
const chevron=(x1,y1,x2,y2,fill,notch=22)=>{const m=(y1+y2)/2;add(`<polygon points="${x1},${y1} ${x2-notch},${y1} ${x2},${m} ${x2-notch},${y2} ${x1},${y2} ${x1+notch},${m}" fill="${fill}"/>`);};
const ghostChev=(x,y1,y2,fill)=>{const m=(y1+y2)/2;add(`<polygon points="${x},${y1} ${x+14},${y1} ${x+30},${m} ${x+14},${y2} ${x},${y2} ${x+16},${m}" fill="${fill}" opacity=".55"/>`);};
const rect=(x,y,w,h,fill,stroke='none',r=14,sw=2)=>add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`);
const arrow=(pts,color=C.red,w=3)=>{const d='M'+pts.map(p=>p.join(' ')).join(' L');add(`<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" marker-end="url(#ah-${color.slice(1)})"/>`);};
const person=(x,y,col,s=1,prop='')=>{
  add(`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="22" rx="17" ry="14" fill="${col}"/><circle cx="0" cy="0" r="11" fill="${col}"/><circle cx="-3" cy="-4" r="4" fill="#fff" opacity=".45"/>`);
  if(prop==='wrench') add(`<rect x="10" y="4" width="16" height="5" rx="2" fill="#8d96a3" transform="rotate(-35 10 4)"/>`);
  if(prop==='watch') add(`<circle cx="13" cy="20" r="8" fill="#fff" stroke="#6b7480" stroke-width="2"/><path d="M13 15 V20 H17" stroke="#6b7480" stroke-width="1.6" fill="none"/>`);
  if(prop==='money') add(`<circle cx="-12" cy="24" r="9" fill="#c9a227" stroke="#8a6d10"/><text x="-12" y="28" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">$</text>`);
  if(prop==='band') add(`<rect x="-11" y="-6" width="22" height="4" fill="#e6e9ee"/>`);
  add(`</g>`);};
const crowd=(x,y,s=1)=>{person(x-10,y+4,C.stake,.7*s);person(x+12,y+4,C.stake,.7*s);person(x+1,y-4,C.stake,.8*s);add(`<path d="M${x+22} ${y+18} l6 -10 l3 3" stroke="${C.stake}" stroke-width="4" fill="none"/>`);};
const team=(x,y,list,s=.8)=>{list.forEach((p,i)=>{const map={po:[C.po,''],coach:[C.coach,'watch'],member:[C.member,'wrench'],tester:[C.tester,'band'],sponsor:[C.sponsor,'money']};person(x+i*30,y+(i%2)*6,map[p][0],s,map[p][1]);});};
const doc=(x,y,w,h)=>{rect(x,y,w,h,'#fff','#8f98a3',2,1.5);for(let i=1;i<6;i++)add(`<line x1="${x+8}" y1="${y+i*h/7}" x2="${x+w-8}" y2="${y+i*h/7}" stroke="#b8bfc8" stroke-width="2"/>`);};
const cards=(x,y,n,w,h,fill,stroke='#8f98a3',dx=8,dy=-6)=>{for(let i=n-1;i>=0;i--)rect(x+i*dx,y+i*dy,w,h,fill,stroke,3,1.5);};
const stackBar=(x,y,h)=>{rect(x,y,26,h,'#3d6fb6','#24497f',2,1.5);for(let i=1;i<6;i++)add(`<line x1="${x}" y1="${y+i*h/6}" x2="${x+26}" y2="${y+i*h/6}" stroke="#fff" stroke-width="1.5"/>`);};
const sticky=(x,y,c='#f4e36b')=>rect(x,y,22,18,c,'#c9b84a',1,1);
const quad=(x,y)=>{rect(x-34,y-14,30,70,'#e8eef6','#8f98a3',3,1.5);[[0,0,'#f6c3c8'],[48,0,'#e3f0a8'],[0,40,'#e6cde9'],[48,40,'#cfe0f3']].forEach(([dx,dy,f])=>rect(x+dx,y+dy,44,36,f,'#9aa3ae',6,1));};

add(`<defs>${['9c2f2f','e2803a','2b5ea8','5d6672'].map(c=>`<marker id="ah-${c}" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#${c}"/></marker>`).join('')}
<linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4b7cc6"/><stop offset="1" stop-color="#244f93"/></linearGradient>
<linearGradient id="gOr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0a463"/><stop offset="1" stop-color="#e07a32"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8443f"/><stop offset="1" stop-color="#8a2626"/></linearGradient>
<linearGradient id="gRel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbe2c4"/><stop offset="1" stop-color="#f6c99a"/></linearGradient>
<linearGradient id="gIt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7d9d5"/><stop offset="1" stop-color="#eba9a3"/></linearGradient></defs>`);

/* header */
add(`<g><circle cx="150" cy="322" r="11" fill="#c0392b"/><text x="167" y="331" font-size="26" font-weight="900" fill="#1f4e8c" font-family="Arial,sans-serif">NPMA</text></g>`);
rect(668,318,826,62,'#2f5f9e','none',10);
/* row labels box for 階段 */
rect(118,482,118,34,'none','#555',2,1.2);

/* ===== stage row ===== */
ghostChev(232,452,548,C.blueHi);
chevron(262,452,528,548,'url(#gBlue)',26);
ghostChev(526,452,548,C.blueHi);ghostChev(548,452,548,C.blueHi);
chevron(548,452,808,548,'url(#gBlue)',26);
ghostChev(808,452,548,C.orangeHi);
chevron(826,456,1515,555,'url(#gOr)',28);
[[862,1018],[1030,1186],[1198,1354],[1366,1508]].forEach(([a,b])=>chevron(a,500,b,548,'#e46f22',16));
ghostChev(1512,452,548,C.blueHi);
chevron(1546,452,1800,548,'url(#gBlue)',26);
/* people above stages */
team(345,398,['po','sponsor','coach'],.85);crowd(498,402);
team(615,392,['member','tester','coach','po'],.8);person(698,432,C.sponsor,.8,'money');crowd(785,402);
team(1000,392,['member','tester','po','member'],.8);person(1100,428,C.sponsor,.8,'money');team(1130,398,['coach'],.8);crowd(1180,402);
crowd(1675,390);team(1620,415,['po'],.8);person(1670,440,C.sponsor,.8,'money');team(1720,418,['member'],.8);

/* 可行性分析 outputs */
rect(290,698,52,82,'#a8262b','#6d1416',3);rect(330,690,52,82,'#c1393b','#6d1416',3);rect(296,712,40,22,'#e8c35c','none',2);
add(`<g transform="rotate(-8 300 880)">`);rect(272,858,96,62,'#eef1f4','#8f98a3',3);for(let i=0;i<4;i++)for(let j=0;j<6;j++)rect(278+j*14,864+i*12,11,8,'#c9d1db','none',1);add(`</g>`);
rect(282,900,46,40,'#d5dae0','#7d8794',4,1.5);

/* 起始 outputs */
doc(565,690,98,98);
rect(552,828,62,58,'#fff','#8f98a3',2);rect(620,828,64,58,'#fff','#8f98a3',2);rect(640,834,30,22,'#c9b8a8','none',2);
cards(556,940,4,110,58,'#fff');
add(`<g>`);[[536,1076,'XS'],[566,1066,'S'],[600,1062,'M'],[634,1068,'L'],[662,1080,'XL']].forEach(([x,y,t],i)=>{add(`<g transform="rotate(${-20+i*10} ${x+22} ${y+30})">`);rect(x,y,44,58,'#fff','#2b5ea8',4,3);add(`<text x="${x+22}" y="${y+36}" font-size="15" text-anchor="middle" font-weight="900" fill="#2b5ea8" font-family="Arial">${t}</text></g>`);});add(`</g>`);
rect(498,1178,136,82,'#f4f6fa','#8f98a3',3);[[504,1186,'#f6c3c8'],[540,1186,'#cfe0f3'],[576,1186,'#e3f0a8'],[504,1212,'#cfe0f3'],[540,1212,'#e6cde9'],[576,1212,'#f6c3c8'],[504,1236,'#e3f0a8'],[540,1236,'#cfe0f3']].forEach(([x,y,f])=>rect(x,y,30,18,f,'none',2));
stackBar(652,1165,95);

/* ===== release box ===== */
add(`<rect x="1148" y="560" width="52" height="16" fill="${C.orange}"/><polygon points="1132,576 1216,576 1174,600" fill="${C.orange}"/>`);
rect(722,604,870,350,'url(#gRel)','#e9a46b',22,2);
ghostChev(724,650,712,C.orangeHi);
chevron(742,650,902,712,'url(#gOr)',20);ghostChev(900,650,712,C.orangeHi);
team(770,612,['po','member','tester','coach'],.75);
person(952,612,C.member,.75,'wrench');
add(`<circle cx="958" cy="668" r="18" fill="#fff" stroke="#5d6672" stroke-width="3"/><line x1="972" y1="680" x2="1008" y2="702" stroke="#5d6672" stroke-width="5"/>`);
person(950,718,C.po,.8);
rect(1040,756,62,42,'#e3edf9','#7d8794',3);rect(1062,760,44,36,'#fff','#7d8794',2);
add(`<rect x="1018" y="640" width="400" height="84" fill="${C.band}" opacity=".9"/>`);
[[1028,1128],[1135,1235],[1242,1322],[1316,1414]].forEach(([a,b])=>chevron(a,682,b,716,'#a63a42',14));
ghostChev(1414,650,722,C.orangeHi);
chevron(1430,650,1586,722,'url(#gOr)',20);
team(1440,612,['po','member','tester','coach'],.75);
[[770,872],[796,880],[782,896],[808,862]].forEach(([x,y])=>sticky(x,y));
[0,1,2,3,4,5,6].forEach(i=>{add(`<g transform="rotate(${-40+i*12} 945 920)">`);rect(925,852,40,60,'#fff','#555',3,1.5);add(`</g>`);});
add(`<g transform="rotate(10 955 880)">`);rect(940,852,40,58,'#fff','#222',3,2);add(`<text x="960" y="890" font-size="22" text-anchor="middle" font-weight="900">1</text></g>`);
add(`<rect x="1058" y="826" width="26" height="12" fill="#f3a7a7"/>`);stackBar(1058,840,82);
rect(1384,786,72,48,'#f0f2f5','#7d8794',3);person(1412,800,'#3a3f47',.7);rect(1380,830,80,18,'#6b4a33','none',2);
rect(1466,780,88,58,'#f7f8f9','#7d8794',2);[[1472,786,'#7cc576'],[1490,786,'#f2e35a'],[1508,786,'#f2e35a'],[1528,786,'#e85b52'],[1472,808,'#f2e35a'],[1490,808,'#f2e35a'],[1528,808,'#f2e35a']].forEach(([x,y,f])=>rect(x,y,14,16,f,'none',1));
quad(1452,880);
add(`<path d="M1562 920 H1582 V728" fill="none" stroke="${C.red}" stroke-width="6" marker-end="url(#ah-9c2f2f)"/>`);
/* 結束 pictures */
rect(1640,640,124,100,'#f3f5f8','#c3c9d0',4,1);[[1660,700],[1690,690],[1730,700]].forEach(([x,y])=>person(x,y,'#3a3f47',.8));add(`<polyline points="1665,670 1690,660 1712,668 1745,645" fill="none" stroke="#c0392b" stroke-width="3"/>`);

const hideWhere=fn=>{blanks.forEach(b=>b.classList.toggle('hid',inRegion(b)&&fn(b)));update();};
function reapplyWeak(){ blanks.forEach(b=>b.classList.toggle('weak',!!weak[b.dataset.k])); }
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function startDrag(){
  selTile=null; mistakes=0; tilesEl.innerHTML='';
  blanks.forEach(b=>{ b.classList.remove('slot','ok','no','over','weak'); delete b.dataset.done; const s=inRegion(b); b.classList.toggle('hid',s); b.classList.toggle('slot',s); });
  shuffle(blanks.filter(inRegion).map(b=>b.dataset.ans)).forEach(a=>{ const t=document.createElement('button'); t.type='button'; t.className='tile'; t.textContent=a; t.dataset.ans=a; bindTile(t); tilesEl.appendChild(t); });
  update();
}
function place(tile,slot){
  if(tile.dataset.ans===slot.dataset.ans){
    slot.classList.remove('hid','no'); slot.classList.add('ok'); slot.dataset.done=1; tile.remove(); selTile=null;
  } else {
    mistakes++; slot.classList.remove('no'); void slot.offsetWidth; slot.classList.add('no'); setTimeout(()=>slot.classList.remove('no'),700);
    weak[slot.dataset.k]=1; save(); tile.classList.remove('sel'); selTile=null;
  }
  update();
}
function bindTile(tile){
  let start=null, dragging=false, ghost=null, over=null;
  const slotAt=(x,y)=>{ const el=document.elementFromPoint(x,y); const s=el&&el.closest('.b.slot'); return s&&!s.dataset.done?s:null; };
  const clearOver=()=>{ if(over) over.classList.remove('over'); over=null; };
  tile.addEventListener('pointerdown',e=>{ if(e.button>0) return; start={x:e.clientX,y:e.clientY}; dragging=false; try{tile.setPointerCapture(e.pointerId);}catch(_){} });
  tile.addEventListener('pointermove',e=>{
    if(!start) return;
    if(!dragging && Math.hypot(e.clientX-start.x,e.clientY-start.y)>6){ dragging=true; ghost=tile.cloneNode(true); ghost.classList.remove('sel'); ghost.classList.add('ghost'); document.body.appendChild(ghost); tile.classList.add('dragging'); }
    if(!dragging) return;
    e.preventDefault();
    ghost.style.left=e.clientX+'px'; ghost.style.top=e.clientY+'px';
    const s=slotAt(e.clientX,e.clientY); if(s!==over){ clearOver(); over=s; if(s) s.classList.add('over'); }
    const r=vp.getBoundingClientRect(), m=48;
    if(e.clientX<r.left+m) vp.scrollLeft-=18; else if(e.clientX>r.right-m) vp.scrollLeft+=18;
    if(e.clientY<r.top+m) vp.scrollTop-=18; else if(e.clientY>r.bottom-m && e.clientY<r.bottom+10) vp.scrollTop+=18;
  });
  const end=e=>{
    if(!start) return;
    if(dragging){ ghost.remove(); ghost=null; tile.classList.remove('dragging'); const s=slotAt(e.clientX,e.clientY); clearOver(); if(s) place(tile,s); }
    else if(e.type==='pointerup'){ const was=tile.classList.contains('sel'); tilesEl.querySelectorAll('.sel').forEach(x=>x.classList.remove('sel')); if(!was){ tile.classList.add('sel'); selTile=tile; } else selTile=null; }
    start=null; dragging=false;
  };
  tile.addEventListener('pointerup',end); tile.addEventListener('pointercancel',e=>{ if(ghost){ghost.remove();ghost=null;} tile.classList.remove('dragging'); clearOver(); start=null; dragging=false; });
}

}

document.getElementById('mFlip').onclick=()=>setMode('flip');
document.getElementById('mDrag').onclick=()=>setMode('drag');
document.getElementById('restart').onclick=startDrag;
setMode(UI.mode==='drag'?'drag':'flip');
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
