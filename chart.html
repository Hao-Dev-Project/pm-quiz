<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>APMA Ch3｜32 格架構圖模擬考</title><style>
/* Layout: a faithful redraw of the printed NPMA chart on a fixed 1800×1130 canvas (scaled to fit, zoomable),
   every label replaced by a tap-to-reveal blank in the same spot. Deliberately single (paper) theme, like the handout. */
:root{
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --desk:#d9dde2; --paper:#ffffff; --ink:#1d2430; --muted:#5d6672; --accent:#2340b8;

  --red:#9c2f2f; --pink:#f3cbc6; --green:#8cc06a; --green-soft:#e6f2da;
  --bad:#d4344d;
  --f-serif:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:10px 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--desk);padding-block:8px}
.top a{color:var(--muted);font-size:13px;margin-right:4px}
.top button{font:inherit;font-size:13px;border:1px solid #b9c0c8;background:#fff;color:var(--ink);border-radius:999px;padding:5px 12px;cursor:pointer}
.top button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.top button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.top .count{font-size:13px;color:var(--muted);margin-left:auto}
.top .count b{color:var(--ink)} .top .count .w{color:var(--bad)}
.zoom{display:inline-flex;gap:4px}
.zoom button{padding:5px 10px}
.hintline{font-size:12px;color:var(--muted);margin:0 0 8px}
.viewport{overflow:auto;border-radius:6px;box-shadow:0 1px 0 #c3c9d0,0 6px 24px rgba(30,40,60,.12);background:var(--paper);max-height:calc(100vh - 110px);-webkit-overflow-scrolling:touch}

.canvas{position:absolute;left:0;top:0;width:1800px;height:1130px;transform-origin:0 0;background:var(--paper)}

.fixed{position:absolute;font-family:var(--f-serif);font-weight:700;color:var(--ink);white-space:nowrap;pointer-events:none}

.b.light.hid{background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.8)}

.grp,.seg{display:inline-flex;flex-wrap:wrap;gap:6px}

.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

body.drag{padding-bottom:calc(32vh + 20px)}

.tile.dragging{opacity:.3}
.ghost{position:fixed;z-index:30;pointer-events:none;transform:translate(-50%,-70%);box-shadow:0 8px 18px rgba(0,0,0,.25);cursor:grabbing}
.b.slot.hid{border:1.5px dashed var(--accent);background:rgba(232,238,255,.94)}
.b.light.slot.hid{background:rgba(232,238,255,.35);border-color:#fff}
.b.slot.over{outline:3px solid var(--accent);outline-offset:1px}
.b.ok{border:2px solid #17845a!important;background:rgba(223,243,234,.95)}
.b.light.ok{background:rgba(23,132,90,.5)}

.top{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.top::-webkit-scrollbar{display:none}
.top>*{flex:none}
.top .count{padding-left:8px}
.viewport{touch-action:pan-x pan-y}
.cands{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cand{font:inherit;font-size:15px;min-height:44px;background:#fff;border:1px solid #8f98a3;border-radius:8px;padding:8px 12px;text-align:left;color:var(--ink);cursor:pointer;-webkit-tap-highlight-color:transparent}
.cand:active{background:#e8eeff}
.cand.no{border-color:var(--bad);background:#ffe5ea;color:var(--bad);animation:shake .35s}
.b.slot.active{outline:3px solid #f2a900;outline-offset:2px;background:rgba(255,240,190,.97)!important;border-color:#c98a00!important}
.b.light.slot.active{background:rgba(255,226,140,.6)!important}
.pool-head .link{background:none;border:0;color:var(--accent);text-decoration:underline;padding:0;font-size:13px;cursor:pointer}
.pool-head .q{font-weight:700;color:var(--ink);font-size:14px}
@media (max-width:700px),(max-height:500px){
  .hintline,.credit{display:none}
  body{padding-block:2px 12px;padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
  .top{padding-block:6px}
  .top button,.reg select{padding:6px 10px}
  .viewport{max-height:calc(100vh - 64px)}

}

</style></head><body><header class="apphead"><h1>APMA Ch3｜架構圖模擬考</h1><a href="./">回題庫</a> · <a href="chart-practice.html">原版 95 格練習</a><p>依考試截圖的 1–32 號位置練習 · 不看選項，直接填入完整名稱</p></header><div class="tools"><button id="fit">整張圖</button><button id="minus" aria-label="縮小">－</button><button id="plus" aria-label="放大">＋</button><select id="scope" aria-label="練習範圍"><option value="all">全部 32 格</option><option value="1,4">圖表標籤 1–4</option><option value="5,9">階段 5–9</option><option value="10,17">角色 10–17</option><option value="18,26">工作事項 18–26</option><option value="27,32">起始產出 27–32</option></select><button class="main" id="grade">交卷批改</button><button id="reveal">顯示答案</button><button id="retry">重練錯題</button><button id="reset">清空作答</button><span class="status" role="status" id="status"></span></div><div class="notice">每格 3 分，全部共 96 分。8 號在圖上重複出現，答案相同。作答自動保存在此瀏覽器。</div><main class="layout"><section class="mapbox"><div class="viewport" id="vp"><div class="sizer" id="sizer"><div class="canvas" id="cv"><svg id="art" viewBox="60 300 1800 1130" aria-hidden="true"></svg></div></div></div><div class="help">可左右／上下滑動；點圖中編號可跳到輸入欄。放大看細節，整張圖看位置。手機可用雙指縮放圖面。</div></section><aside class="sheet"><h2>填空答題卡</h2><div class="mobile-nav"><button id="prevQ" aria-label="上一格">← 上一格</button><strong id="currentQ" aria-live="polite">第 1 格</strong><button id="nextQ" aria-label="下一格">下一格 →</button><button id="toggleNums" aria-expanded="false">跳題</button></div><div class="navnums" id="nav"></div><p id="sheetInfo">先回想再填寫，交卷後顯示錯題與正解。</p><div id="cards"></div><div class="mini">11 號依原圖為「贊助者」，不採用截圖中被判錯的「投資者」。可接受「台／臺」「用戶／使用者」及合理標點差異；其餘以完整名稱比對。此模擬考不保證與老師判分規則完全相同。</div></aside></main><script>
/* ---------- coordinates: same system as the original photo (x 60–1860, y 300–1430) ---------- */
const OX=60, OY=300;
const C={blue:'#2b5ea8',blueHi:'#6f9be0',orange:'#e2803a',orangeHi:'#f2a865',peach:'#fbe3c8',peachLine:'#eeb27c',
  red:'#9c2f2f',redHi:'#c0504d',pink:'#f5d0cb',pinkLine:'#d98c86',band:'#f6c9cf',green:'#8cc06a',greenSoft:'#e3f0d6',
  ink:'#1d2430',grey:'#9aa3ae',po:'#2f9a4a',coach:'#7b4fc4',member:'#b8432f',tester:'#2f6fc4',sponsor:'#c99a1c',stake:'#e8bb2c'};
let svg='';
const add=s=>svg+=s;
const chevron=(x1,y1,x2,y2,fill,notch=22)=>{const m=(y1+y2)/2;add(`<polygon points="${x1},${y1} ${x2-notch},${y1} ${x2},${m} ${x2-notch},${y2} ${x1},${y2} ${x1+notch},${m}" fill="${fill}"/>`);};
const ghostChev=(x,y1,y2,fill)=>{const m=(y1+y2)/2;add(`<polygon points="${x},${y1} ${x+14},${y1} ${x+30},${m} ${x+14},${y2} ${x},${y2} ${x+16},${m}" fill="${fill}" opacity=".55"/>`);};
const rect=(x,y,w,h,fill,stroke='none',r=14,sw=2)=>add(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`);
const arrow=(pts,color=C.red,w=3)=>{const d='M'+pts.map(p=>p.join(' ')).join(' L');add(`<path d="${d}" fill="none" stroke="${color}" stroke-width="${w}" marker-end="url(#ah-${color.slice(1)})"/>`);};
const person=(x,y,col,s=1,prop='')=>{
  add(`<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="22" rx="17" ry="14" fill="${col}"/><circle cx="0" cy="0" r="11" fill="${col}"/><circle cx="-3" cy="-4" r="4" fill="#fff" opacity=".45"/>`);
  if(prop==='wrench') add(`<rect x="10" y="4" width="16" height="5" rx="2" fill="#8d96a3" transform="rotate(-35 10 4)"/>`);
  if(prop==='watch') add(`<circle cx="13" cy="20" r="8" fill="#fff" stroke="#6b7480" stroke-width="2"/><path d="M13 15 V20 H17" stroke="#6b7480" stroke-width="1.6" fill="none"/>`);
  if(prop==='money') add(`<circle cx="-12" cy="24" r="9" fill="#c9a227" stroke="#8a6d10"/><text x="-12" y="28" font-size="11" text-anchor="middle" fill="#fff" font-weight="700">$</text>`);
  if(prop==='band') add(`<rect x="-11" y="-6" width="22" height="4" fill="#e6e9ee"/>`);
  add(`</g>`);};
const crowd=(x,y,s=1)=>{person(x-10,y+4,C.stake,.7*s);person(x+12,y+4,C.stake,.7*s);person(x+1,y-4,C.stake,.8*s);add(`<path d="M${x+22} ${y+18} l6 -10 l3 3" stroke="${C.stake}" stroke-width="4" fill="none"/>`);};
const team=(x,y,list,s=.8)=>{list.forEach((p,i)=>{const map={po:[C.po,''],coach:[C.coach,'watch'],member:[C.member,'wrench'],tester:[C.tester,'band'],sponsor:[C.sponsor,'money']};person(x+i*30,y+(i%2)*6,map[p][0],s,map[p][1]);});};
const doc=(x,y,w,h)=>{rect(x,y,w,h,'#fff','#8f98a3',2,1.5);for(let i=1;i<6;i++)add(`<line x1="${x+8}" y1="${y+i*h/7}" x2="${x+w-8}" y2="${y+i*h/7}" stroke="#b8bfc8" stroke-width="2"/>`);};
const cards=(x,y,n,w,h,fill,stroke='#8f98a3',dx=8,dy=-6)=>{for(let i=n-1;i>=0;i--)rect(x+i*dx,y+i*dy,w,h,fill,stroke,3,1.5);};
const stackBar=(x,y,h)=>{rect(x,y,26,h,'#3d6fb6','#24497f',2,1.5);for(let i=1;i<6;i++)add(`<line x1="${x}" y1="${y+i*h/6}" x2="${x+26}" y2="${y+i*h/6}" stroke="#fff" stroke-width="1.5"/>`);};
const sticky=(x,y,c='#f4e36b')=>rect(x,y,22,18,c,'#c9b84a',1,1);
const quad=(x,y)=>{rect(x-34,y-14,30,70,'#e8eef6','#8f98a3',3,1.5);[[0,0,'#f6c3c8'],[48,0,'#e3f0a8'],[0,40,'#e6cde9'],[48,40,'#cfe0f3']].forEach(([dx,dy,f])=>rect(x+dx,y+dy,44,36,f,'#9aa3ae',6,1));};

 if(n){b.dataset.n=n;b.className='b exam';b.textContent=n;b.setAttribute('aria-label',`第 ${n} 格`);b.onclick=()=>focusInput(n);b.style.height=Math.max(h,24)+'px';}

const norm=s=>s.normalize('NFKC').replace(/使用者/g,'用戶').replace(/台/g,'臺').replace(/[\s•·、，,。／/（）()：:－-]/g,'');
function correct(n){const v=norm(state[n]||'');return [answers[n-1],...([26,31].includes(n)?['建立產品地圖','建立用戶故事地圖'].filter(()=>n===26).concat(n===31?['產品地圖','用戶故事地圖']:[]):[])].some(a=>norm(a)===v);}
function visible(n){const s=document.getElementById('scope').value;let ok=s==='all'||(n>=+s.split(',')[0]&&n<=+s.split(',')[1]);return ok&&(!onlyWrong||lastWrong.includes(n));}
function persist(){try{localStorage.setItem('pm-exam32-v1',JSON.stringify(state))}catch{}}
function centerQuestion(n){if(!isMobile())return;const b=[...document.querySelectorAll('.exam')].find(b=>+b.dataset.n===n);if(!b)return;vp.scrollLeft=(parseFloat(b.style.left)+b.offsetWidth/2)*z-vp.clientWidth/2;vp.scrollTop=(parseFloat(b.style.top)+b.offsetHeight/2)*z-vp.clientHeight/2;}
function mobileUI(){const ns=answers.map((_,i)=>i+1).filter(visible);if(!ns.includes(current))current=ns[0]||1;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('current',c.querySelector('input')?.id==='a'+current));document.getElementById('currentQ').textContent=`第 ${current} 格 · ${Math.max(0,ns.indexOf(current)+1)} / ${ns.length}`;document.getElementById('prevQ').disabled=ns.indexOf(current)<=0;document.getElementById('nextQ').disabled=ns.indexOf(current)>=ns.length-1;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('current',+b.textContent===current));}
function focusInput(n){const input=document.getElementById('a'+n);if(!input||!visible(n))return;current=n;mobileUI();if(isMobile()){document.querySelector('.sheet').classList.remove('numbers-open');document.getElementById('toggleNums').setAttribute('aria-expanded','false');centerQuestion(n);}else input.closest('.card').scrollIntoView({block:'nearest',behavior:'smooth'});input.focus({preventScroll:true});highlight(n);}
function highlight(n){document.querySelectorAll('.exam').forEach(b=>b.classList.toggle('active',+b.dataset.n===n));}
function render(){let count=0,filled=0,right=0;const cards=document.getElementById('cards');cards.replaceChildren();document.getElementById('nav').replaceChildren();
 for(let n=1;n<=32;n++){if(!visible(n))continue;count++;if((state[n]||'').trim())filled++;if(correct(n))right++;
 const card=document.createElement('div');card.className='card'+(graded?(correct(n)?' good':' bad'):'');const label=document.createElement('label');label.htmlFor='a'+n;const num=document.createElement('span');num.textContent=n;const input=document.createElement('input');input.id='a'+n;input.value=state[n]||'';input.autocomplete='off';input.setAttribute('aria-label',`第 ${n} 格答案`);input.enterKeyHint='next';input.spellcheck=false;input.onfocus=()=>{current=n;mobileUI();highlight(n);centerQuestion(n);};input.oninput=()=>{state[n]=input.value;graded=false;show=false;persist();card.className='card'+(current===n?' current':'');card.querySelector('.feedback')?.remove();updateStatus();};input.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();stepQuestion(1);}};label.append(num,input);card.append(label);if(graded||show){const feedback=document.createElement('div');feedback.className='feedback';feedback.textContent=(graded?(correct(n)?'✓ 正確':'✗ 正確答案：'):'答案：')+((!graded||!correct(n))?answers[n-1]:'');card.append(feedback);}cards.append(card);
 const b=document.createElement('button');b.textContent=n;b.className=graded?(correct(n)?'pass':'err'):(state[n]?'done':'');b.onclick=()=>focusInput(n);document.getElementById('nav').append(b);
 }
 document.querySelectorAll('.exam').forEach(b=>{const n=+b.dataset.n;b.classList.toggle('correct',graded&&visible(n)&&correct(n));b.classList.toggle('wrong',graded&&visible(n)&&!correct(n));});updateStatus();mobileUI();
 document.getElementById('sheetInfo').textContent=onlyWrong?'僅顯示上次答錯或未填的編號。':show?'已展開答案；先遮住答案回想，再核對。':'先回想再填寫，交卷後顯示錯題與正解。';
}
function updateStatus(){const ns=answers.map((_,i)=>i+1).filter(visible);const filled=ns.filter(n=>(state[n]||'').trim()).length;document.getElementById('status').textContent=graded?`${ns.filter(correct).length} / ${ns.length} 格正確 · ${ns.filter(correct).length*3} / ${ns.length*3} 分`:`已填 ${filled} / ${ns.length} 格`;}
function zoom(v){z=Math.max(.22,Math.min(2,v));cv.style.transform=`scale(${z})`;document.getElementById('sizer').style.cssText=`width:${1800*z}px;height:${1130*z}px`;}
document.getElementById('fit').onclick=()=>zoom(vp.clientWidth/1800);function centeredZoom(v){const px=(vp.scrollLeft+vp.clientWidth/2)/z,py=(vp.scrollTop+vp.clientHeight/2)/z;zoom(v);vp.scrollLeft=px*z-vp.clientWidth/2;vp.scrollTop=py*z-vp.clientHeight/2;}document.getElementById('plus').onclick=()=>centeredZoom(z*1.25);document.getElementById('minus').onclick=()=>centeredZoom(z/1.25);
document.getElementById('grade').onclick=()=>{graded=true;show=false;lastWrong=answers.map((_,i)=>i+1).filter(n=>visible(n)&&!correct(n));render();};document.getElementById('reveal').onclick=()=>{show=!show;render();};document.getElementById('retry').onclick=()=>{if(!lastWrong.length){document.getElementById('status').textContent='請先交卷；若全對，可清空後再練。';return;}onlyWrong=true;lastWrong.forEach(n=>delete state[n]);graded=false;show=false;persist();render();};document.getElementById('reset').onclick=()=>{if(!confirm('清空目前所有 32 格作答？'))return;state={};onlyWrong=false;lastWrong=[];graded=false;show=false;persist();render();};document.getElementById('scope').onchange=()=>{onlyWrong=false;graded=false;show=false;render();if(isMobile())centerQuestion(current);};
function stepQuestion(delta){const ns=answers.map((_,i)=>i+1).filter(visible);const n=ns[ns.indexOf(current)+delta];if(n)focusInput(n);}
document.getElementById('prevQ').onclick=()=>stepQuestion(-1);document.getElementById('nextQ').onclick=()=>stepQuestion(1);document.getElementById('toggleNums').onclick=()=>{const open=document.querySelector('.sheet').classList.toggle('numbers-open');document.getElementById('toggleNums').setAttribute('aria-expanded',String(open));};
function viewportSize(){document.documentElement.style.setProperty('--app-height',(window.visualViewport?.height||window.innerHeight)+'px');}viewportSize();window.visualViewport?.addEventListener('resize',viewportSize);window.addEventListener('resize',viewportSize);
let pinch;vp.addEventListener('touchstart',e=>{if(e.touches.length===2)pinch={sx:vp.scrollLeft,sy:vp.scrollTop,d:Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY),z};},{passive:true});vp.addEventListener('touchmove',e=>{if(e.touches.length!==2||!pinch)return;e.preventDefault();const r=vp.getBoundingClientRect(),mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top,px=(vp.scrollLeft+mx)/z,py=(vp.scrollTop+my)/z;zoom(pinch.z*Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY)/pinch.d);vp.scrollLeft=px*z-mx;vp.scrollTop=py*z-my;},{passive:false});vp.addEventListener('touchend',()=>pinch=null);render();zoom(isMobile()?.8:vp.clientWidth/1800);if(isMobile())centerQuestion(current);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
